研究方法（基因导入、异源表达、光学成像）。",false]]},{"kind":"bullet","runs":[["命题方式：811 惯于把当年诺奖与教材主干交叉命题，最可能出现在名词解释、简答与论述中，落脚点仍是膜蛋白、离子通道与信号转导。",false]]}]},{"key":"must","title":"今日必须背诵","blocks":[{"kind":"p","runs":[["一、名词解释（逐字背）",true]]},{"kind":"p","runs":[["光遗传学（optogenetics）：把光敏蛋白（如通道视紫红质 ChR2）的基因导入特定类型细胞并使其在细胞膜上表达，从而用特定波长的光在毫秒级时间内精确开启或关闭细胞电活动的技术。该技术由 Deisseroth 等在 2005—2007 年间建立，2006 年正式命名为光遗传学。它的特点是具有细胞类型特异性与毫秒级时间分辨率，可把神经元活动与特定行为、记忆和情绪建立起因果联系。",false]]},{"kind":"p","runs":[["通道视紫红质（channelrhodopsin，ChR）：绿藻莱茵衣藻（Chlamydomonas reinhardtii）眼点中的光门控离子通道蛋白，含 7 次跨膜螺旋，以全反式视黄醛为发色团。吸收蓝光后其构象改变、通道开放，Na⁺、Ca²⁺ 等阳离子内流引起去极化。其特点是光感受器与离子通道合于一体，从光照到通道开放的潜伏期仅约 0.2ms，据此可实现对神经元活动的光控。",false]]},{"kind":"p","runs":[["二、关键事实与数字（考场上最容易加分的细节）",true]]},{"kind":"bullet","runs":[["衣藻眼点受光照射后约 0.5ms 即出现电信号；而人眼的光转导要经过 G 蛋白偶联受体级联反应，至少需要 10ms 以上，衣藻的反应比人眼快 20 倍以上。",false]]},{"kind":"bullet","runs":[["2002—2003 年，Hegemann 与 Nagel 从衣藻基因组中筛出两个与已知感光蛋白同源的基因，分别导入非洲爪蟾卵母细胞异源表达，证明其编码的蛋白就是光门控离子通道，命名为通道视紫红质 1 与通道视紫红质 2（ChR1、ChR2）。",false]]},{"kind":"bullet","runs":[["2005 年，Deisseroth 把 ChR2 基因导入大鼠培养神经元，用蓝光照射即可触发动作电位；2007 年，他把该基因导入活体小鼠运动皮层的特定神经元，经植入的光纤给光，可控制小鼠胡须的运动。",false]]},{"kind":"bullet","runs":[["2012 年，Deisseroth 与利根川进等用光遗传学重新激活记忆痕迹（engram），证明特定的一群神经元是恐惧记忆所必需的。",false]]},{"kind":"p","runs":[["三、机制链条（能画能说）",true]]},{"kind":"p","runs":[["ChR2 基因经基因工程导入神经元并表达于细胞膜 → 全反式视黄醛吸收蓝光 → 蛋白构象改变、通道开放 → Na⁺、Ca²⁺ 等阳离子顺电化学梯度内流 → 膜去极化 → 达到阈电位产生动作电位。因此，对光照时间与位置的控制，就等于对神经元活动的控制。",false]]},{"kind":"p","runs":[["四、必须会对比的三组概念",true]]},{"kind":"bullet","runs":[["通道视紫红质与动物视紫红质：动物视紫红质是 G 蛋白偶联受体，本身不形成通道，需经转导蛋白、cGMP 磷酸二酯酶等级联反应间接门控通道，速度慢（10ms 以上）；通道视紫红质本身既是光感受器又是离子通道，光照后一步完成，速度快（约 0.2ms）。",false]]},{"kind":"bullet","runs":[["通道视紫红质与细菌视紫红质：细菌视紫红质是光驱动的质子泵，每吸收一个光子跨膜泵出一个质子，属于主动运输；通道视紫红质是光门控通道，离子顺电化学梯度被动通过，属于被动运输。",false]]},{"kind":"bullet","runs":[["光遗传学与传统电刺激：电刺激无法区分细胞类型，光遗传学可以只作用于表达了光敏蛋白的特定类型神经元，实现细胞类型特异性与毫秒级时间精度的双重控制。",false]]},{"kind":"p","runs":[["五、意义与应用（论述题的收尾）",true]]},{"kind":"bullet","runs":[["科学意义：把神经活动研究从只能观察相关关系，提升为可以证明因果关系，因而能够确定控制疼痛、社交、饮水、摄食、奖赏、攻击、昼夜节律与免疫发热等具体行为的神经环路；同时揭示了神经系统与心脏、肠道等外周器官细胞之间的相互作用。",false]]},{"kind":"bullet","runs":[["临床应用：已开展用光遗传学方法恢复视网膜色素变性患者视力的临床试验——把光敏蛋白导入视网膜残留神经元并配合发光眼镜，受试者能够辨认并抓取桌面上的物体；还有望用于改进人工耳蜗对听神经的精确激活。",false]]},{"kind":"bullet","runs":[["技术地位：为神经科学与精神疾病研究提供了毫秒级、细胞类型特异性的因果性研究工具，被认为是神经科学的里程碑式方法。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["本专题暂无 811 真题原题，以下按 811 命题风格自拟，答案按考场标准写法给出。",true]]},{"kind":"mcq","stem":"2026 年诺贝尔生理学或医学奖授予光遗传学的创立，其核心蛋白通道视紫红质最初发现于（　）。","opts":{"A":"小鼠视网膜","B":"单细胞绿藻莱茵衣藻","C":"非洲爪蟾卵母细胞","D":"大肠杆菌"},"ans":"B","explain":"通道视紫红质是 Hegemann 与 Nagel 在单细胞绿藻莱茵衣藻的眼点中发现的；非洲爪蟾卵母细胞只是异源表达该系统时所使用的宿主细胞。","src":"2026 诺奖 · 预测题"},{"kind":"mcq","stem":"作为光遗传学的核心工具，通道视紫红质（ChR2）属于（　）。","opts":{"A":"光驱动的质子泵","B":"光门控的阳离子通道","C":"G 蛋白偶联受体","D":"光驱动的氯离子泵"},"ans":"B","explain":"ChR2 是光门控的非选择性阳离子通道，吸收蓝光后通道开放，Na⁺、Ca²⁺ 等阳离子顺电化学梯度内流，引起膜去极化；细菌视紫红质则是光驱动的质子泵。","src":"2026 诺奖 · 预测题"},{"kind":"mcq","stem":"衣藻眼点受到光照后产生电信号的潜伏期约为 0.5ms，比人眼的光转导快 20 倍以上，其主要原因是（　）。","opts":{"A":"衣藻的感光蛋白同时兼具光感受器与离子通道的功能","B":"衣藻的光转导不依赖任何蛋白质","C":"衣藻细胞内没有离子通道","D":"衣藻的光信号不需要跨膜传递"},"ans":"A","explain":"动物视紫红质是 G 蛋白偶联受体，需经转导蛋白、cGMP 磷酸二酯酶等级联反应间接门控通道，至少需要 10ms；通道视紫红质本身既是光感受器又是离子通道，光照后一步完成通道开放，因此仅需约 0.2～0.5ms。","src":"2026 诺奖 · 预测题"},{"kind":"fib","stem":"通道视紫红质以[[0]]为发色团，吸收[[1]]后通道开放，从光照到通道开放的潜伏期约为[[2]]毫秒。","ans":[["全反式视黄醛","视黄醛"],["蓝光","蓝","蓝光（约470nm）","470nm 蓝光"],["0.2"]],"explain":"通道视紫红质以全反式视黄醛为发色团，吸收蓝光（约 470nm）后构象改变、通道开放，阳离子内流引起去极化；在非洲爪蟾卵母细胞中测得从光照到通道开放的潜伏期仅约 0.2ms。","src":"2026 诺奖 · 预测题"},{"kind":"p","runs":[["名词解释：光遗传学。",true]]},{"kind":"p","runs":[["答案：光遗传学是指把光敏蛋白（如通道视紫红质 ChR2）的基因导入特定类型细胞并使其在细胞膜上表达，从而用特定波长的光在毫秒级时间内精确开启或关闭细胞电活动的技术。该技术由 Deisseroth 等在 2005—2007 年间建立，2006 年正式命名。其特点是细胞类型特异性与毫秒级时间分辨率，可把神经元活动与特定行为、记忆和情绪建立起因果联系。",false]]},{"kind":"p","runs":[["名词解释：通道视紫红质（ChR）。",true]]},{"kind":"p","runs":[["答案：通道视紫红质是绿藻莱茵衣藻眼点中的光门控离子通道蛋白，含 7 次跨膜螺旋，以全反式视黄醛为发色团。吸收蓝光后其构象改变、通道开放，Na⁺、Ca²⁺ 等阳离子内流引起去极化。它同时兼具光感受器与离子通道的功能，从光照到通道开放的潜伏期仅约 0.2ms，是光遗传学的核心工具。",false]]},{"kind":"p","runs":[["简答：简述通道视紫红质（ChR2）的结构特点与工作机理。",true]]},{"kind":"p","runs":[["答案：① ChR2 含 7 次跨膜螺旋，以共价结合的视黄醛为发色团，本身既是光感受器，又是离子通道；② 蓝光照射使视黄醛异构化，蛋白构象改变，中央孔道开放；③ Na⁺、Ca²⁺ 等阳离子顺电化学梯度内流，细胞膜去极化；④ 去极化达到阈电位即触发动作电位，于是光的开启与关闭就对应神经元活动的开启与关闭。整个过程一步完成，潜伏期仅约 0.2ms，因而可以在毫秒级时间尺度上控制神经元活动。",false]]},{"kind":"p","runs":[["简答：为什么衣藻对光的反应比人眼快 20 倍以上？",true]]},{"kind":"p","runs":[["答案：人眼的光转导是 G 蛋白偶联受体介导的级联反应：视紫红质吸收光子后激活转导蛋白，进而激活 cGMP 磷酸二酯酶水解 cGMP，使 cGMP 门控通道关闭，光感受器细胞超极化，全过程至少需要 10ms。衣藻眼点的通道视紫红质本身就是光门控离子通道，吸收光子后不需要任何中间信号分子，通道直接开放，阳离子内流并产生电信号，仅需约 0.2～0.5ms。二者的差别在于感光与门控是否由同一个蛋白一步完成，因此衣藻的反应比人眼快 20 倍以上。",false]]},{"kind":"p","runs":[["论述：以光遗传学为例，说明膜蛋白的结构与功能相适应，并说明基因导入与异源表达技术在细胞生物学研究中的作用。",true]]},{"kind":"p","runs":[["答案：（一）膜蛋白的结构与功能相适应。通道视紫红质含 7 次跨膜螺旋，跨膜段的疏水氨基酸与脂双层相互作用，使其稳定地镶嵌在膜内并具有确定的方向性；跨膜螺旋围成亲水的中央孔道，孔道内壁的极性氨基酸与选择性滤器决定其允许通过的离子种类；辅基视黄醛位于孔道附近的疏水口袋中，接受光子后发生异构化，引起螺旋位置改变、孔道开放，此过程不消耗 ATP，离子顺电化学梯度通过，属于被动运输。膜蛋白的方向性在粗面内质网上合成时就已经确定，在随后的转运过程中始终不变，这正是 ChR2 表达于细胞膜后，通道朝向能够保证阳离子内流并引起去极化的结构基础。\n（二）基因导入与异源表达技术的作用。① 把目的基因导入宿主细胞并使其表达，可以确定基因产物及其功能：Hegemann 与 Nagel 把衣藻的两个基因分别注入非洲爪蟾卵母细胞，使卵母细胞表达出 ChR1 与 ChR2，测得光照后通道开放，从而证明该基因编码的是光门控离子通道；② 把 ChR2 基因导入大鼠培养神经元与活体小鼠的特定神经元，可以赋予原本不感光的细胞以光敏感性，实现对特定细胞类型的选择性控制；③ 同一策略还可用于荧光蛋白标记、基因敲除与基因编辑等，是分析细胞结构、功能与行为的通用手段。\n（三）结论。光遗传学是基因工程与膜蛋白结构功能研究结合的产物，它说明：明确膜蛋白的结构与功能关系是认识细胞活动的基础，而基因导入与异源表达是把这种认识转化为研究工具的关键技术。",false]]},{"kind":"p","runs":[["论述：说明 2026 年诺贝尔生理学或医学奖成果的科学意义与临床应用前景。",true]]},{"kind":"p","runs":[["答案：（一）科学意义。① 提供了因果性研究工具：光遗传学可以在毫秒级时间尺度上、以细胞类型特异性方式开启或关闭神经元活动，把以往只能观察相关关系的神经活动研究提升为可以证明因果关系的研究，因而能够确定控制记忆、情绪、奖赏、摄食、疼痛与昼夜节律的具体神经环路。② 推动了膜蛋白结构功能研究的应用：通道视紫红质感光与门控合于一体，正是这一技术得以成立的分子基础。③ 拓展了细胞生物学与神经生物学的交叉：借助光遗传学发现了神经活动与心脏、肠道等外周器官细胞之间的相互作用，揭示了细胞间信号交流的新内容。④ 在方法学上，异源表达与基因导入加光学控制的思路，已成为现代细胞生物学研究的通用范式。\n（二）临床应用前景。① 视力恢复：视网膜色素变性患者的视杆细胞与视锥细胞被破坏，把通道视紫红质类光敏蛋白导入视网膜残留神经元并配合发光眼镜，已使失明患者恢复部分视力、能够辨认并抓取桌面物体，目前仍在开展临床试验。② 听觉修复：有望用于改进人工耳蜗，实现对听神经更精确的激活。③ 神经与精神疾病：为抑郁、焦虑、精神分裂症、阿尔茨海默病与帕金森病等研究提供了解析病理性神经环路的工具，也为深部脑刺激等疗法的机制解释与改进提供了依据。\n（三）局限与展望。光敏蛋白需要经基因导入长期表达，存在免疫原性、表达稳定性与安全性问题；光在脑组织中的穿透深度有限，目前多需植入光纤，创伤性与长期稳定性仍需验证。随着更灵敏、可用更长波长激活的新型光敏通道以及无创给光技术的发展，光遗传学有望从研究工具逐步走向临床治疗手段。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：光遗传学。",false]]},{"kind":"num","runs":[["名词解释：通道视紫红质（ChR）。",false]]},{"kind":"num","runs":[["简答：简述 ChR2 从吸收光子到引起神经元动作电位的全过程。",false]]},{"kind":"num","runs":[["简答：为什么衣藻对光的反应速度远快于人眼？",false]]},{"kind":"num","runs":[["论述：以光遗传学为例说明膜蛋白结构与功能相适应，并说明其科学意义与临床应用前景。",false]]}]}]},{"n":"T2","special":true,"title":"原理一：膜的双重身份——既分隔又通讯","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["膜脂为什么能自发形成双层，而且还能自我封闭、自我修复？",false]]},{"kind":"bullet","runs":[["膜为什么既稳定又能流动？这两个性质矛盾吗？",false]]},{"kind":"bullet","runs":[["膜蛋白为什么必须有明确的方向？方向由谁决定、什么时候决定？",false]]},{"kind":"bullet","runs":[["膜的不对称性怎么建立、怎么维持？它有什么用？",false]]},{"kind":"bullet","runs":[["以上性质如何决定物质运输、信号转导、细胞连接与细胞识别？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 3 章：膜脂（磷脂、鞘脂、固醇）、膜蛋白（外在、内在、脂锚定）、糖被、膜的流动性、膜的不对称性、膜蛋白方向性、红细胞膜骨架。",false]]},{"kind":"bullet","runs":[["第 4 章：脂双层对物质的通透性。第 6 章：膜泡运输中膜拓扑学的保持。第 15 章：磷脂酰丝氨酸外翻与凋亡识别。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 6、Day 7。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["一、自组装原理：两亲性是膜存在的物理基础",true]]},{"kind":"p","runs":[["磷脂是两亲性分子，头部亲水、尾部疏水。在水中，疏水尾部相互靠拢、亲水头部朝向水相，这是熵增驱动的自发过程——原本在疏水链周围排列有序的水分子被释放，体系熵增加、自由能降低。因此脂双层不需要模板、不需要消耗能量就能自发形成，并且具有自我封闭与自我修复的能力。",false]]},{"kind":"p","runs":[["推论：凡是两亲性分子都倾向于形成膜状结构；膜在热力学上是稳定的，而分子在其中可以侧向扩散，所以“稳定”与“流动”并不矛盾，膜是二维流体。",false]]},{"kind":"p","runs":[["条件与例外：温度低于膜脂的相变温度时，脂双层转为凝胶态，流动性骤降；胆固醇在动物细胞膜中起双向调节作用，高温时限制脂链运动，低温时阻止脂链紧密排列，使流动性维持在相对恒定的范围。",false]]},{"kind":"p","runs":[["二、流动性原理：膜是二维流体",true]]},{"kind":"p","runs":[["流动性的表现为膜脂的侧向扩散、旋转、摆动与极少数的翻转，其中侧向扩散最快，翻转几乎不发生（需要翻转酶消耗能量）。影响因素有四条：脂肪酸链越短、不饱和键越多，流动性越大；温度越高越流动；胆固醇起双向调节；膜蛋白的流动性受细胞骨架与胞外基质的限制，并非自由扩散。",false]]},{"kind":"p","runs":[["证据：荧光漂白恢复（FRAP）、人—鼠细胞融合后膜蛋白在 37℃ 下混合、受体交联引起的成帽与成斑。",false]]},{"kind":"p","runs":[["三、方向性原理：由合成时的拓扑学决定，并在转运中保持不变",true]]},{"kind":"p","runs":[["膜蛋白的方向性在粗面内质网上合成时即已确定：信号肽与跨膜肽段决定它穿膜的方式与朝向。糖基化只发生在内质网和高尔基体的腔面，所以糖蛋白与糖脂的糖链只分布在细胞膜的膜外表面；在内膜系统中，糖链只出现在腔面（ES 面）。膜泡运输时膜不发生翻转，因此拓扑学特征始终不变。",false]]},{"kind":"p","runs":[["推论：不对称性是膜功能的前提——糖被位于膜外，承担识别与保护；受体与通道必须有确定的朝向才能接收信号、运输物质；磷脂酰丝氨酸（PS）主要分布在内侧，其外翻成为凋亡细胞被巨噬细胞识别的信号。",false]]},{"kind":"p","runs":[["四、结构—功能对应原理：膜的每一项功能都有对应的结构安排",true]]},{"kind":"p","runs":[["分隔与屏障对应连续的疏水核心；选择性运输对应通道、载体与泵；信息接收对应受体与糖被；连接与识别对应黏着分子与糖链；酶促反应平台对应膜上的酶复合物与呼吸链、光合链。反过来说，任何“膜的功能”题都可以从结构、位置、朝向、性质四个角度作答。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["物理（两亲性自组装）→ 性质（流动性、不对称性、方向性）→ 行为（膜融合、出芽、成帽）→ 现象（膜泡运输、分泌与内吞、细胞融合、免疫受体交联）",false]]},{"kind":"bullet","runs":[["膜蛋白方向性（第 3 章）→ 信号肽与分选信号（第 6 章）→ 蛋白质分选与膜泡运输 → 膜蛋白在质膜、溶酶体、线粒体上的正确朝向（第 5、6、7 章）",false]]},{"kind":"bullet","runs":[["膜不对称性 → PS 外翻 → 巨噬细胞识别吞噬凋亡细胞（第 15 章 + 免疫）→ 炎症与自身免疫的边界",false]]},{"kind":"bullet","runs":[["膜的流动性 → 细胞融合与细胞工程（第 2 章）→ 受体聚集与成帽 → B 细胞受体交联激活（免疫）",false]]},{"kind":"bullet","runs":[["膜运输（第 4 章）→ 膜电位 → 神经元动作电位 → 2026 诺奖：光门控离子通道与光遗传学（专题 T1）",false]]}]},{"key":"apply","title":"灵活运用","blocks":[{"kind":"qa","q":"【情境】把红细胞放入低渗溶液，细胞吸水膨胀成球形，但在临界溶血点之前并不会胀破。请从膜的自组装与膜骨架的角度解释这一现象，并说明超过临界点后为什么会溶血。","a":"答案：①脂双层是两亲性分子自发形成的二维流体，具有自我封闭与自我修复能力，膜本身柔软而连续，因此可以随渗透压变化改变形状而不出现破口；②红细胞膜内侧有一层以血影蛋白、肌动蛋白、锚定蛋白与带 3 蛋白构成的膜骨架网络，它把膜限制在一定的表面积与形变范围内，使细胞在膨胀时仍能维持完整性；③当渗透压继续降低，膜面积被拉伸到极限（一般可拉伸约 20%～30%），膜骨架的锚定被破坏，膜的连续性被撕开，血红蛋白漏出，即发生溶血。这一现象同时说明：膜的稳定性一方面来自脂双层的自组装，另一方面来自膜骨架对膜的力学支撑。","src":"灵活运用 · 综合"},{"kind":"qa","q":"【实验设计】现有两种来源不同的人体细胞（A、B）和对应的荧光标记抗体，请设计实验证明膜蛋白可以在膜上作侧向扩散，并说明如何排除细胞未融合或抗体交叉反应的干扰。","a":"答案：①用两种不同颜色的荧光抗体分别标记 A、B 细胞的膜蛋白，用灭活的仙台病毒或 PEG 诱导细胞融合；②37℃ 培养 40 分钟后观察，若两种荧光在杂交细胞膜上均匀分布（混合），说明膜蛋白可以侧向扩散；若 4℃ 培养或先用甲醛固定，荧光保持各自成簇的分布，作为对照说明混合依赖膜的流动性；③排除干扰：设未融合的 A、B 细胞对照组（不应出现混合荧光），并用抗体的单独标记对照排除交叉反应；④若需要定量，可对杂交细胞做荧光漂白恢复（FRAP）实验，测恢复半衰期，恢复越慢表示膜蛋白扩散受限制越多。结论：膜蛋白可以在膜上侧向扩散，其扩散受细胞骨架与胞外基质的限制，扩散系数小于膜脂。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【变式】为什么去垢剂能溶解膜蛋白？离子型去垢剂与非离子型去垢剂在处理膜蛋白时有什么本质区别？","a":"答案：去垢剂也是两亲性分子，它可与膜脂和膜蛋白的疏水区竞争结合，形成可溶性的混合胶束，把膜蛋白从脂双层中“拉”出来。离子型去垢剂（如 SDS）带电荷，会破坏蛋白质内部的疏水相互作用并使蛋白质变性，因此多用于电泳前的变性处理；非离子型去垢剂（如 Triton X-100）不带电荷、作用温和，可把膜蛋白连同部分脂一起溶解下来并保持其活性与相互作用，常用于膜蛋白的分离纯化与功能研究。","src":"灵活运用 · 概念辨析"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["为什么膜能自发形成双层，而且能自我封闭？（从两亲性与熵增驱动作答）",false]]},{"kind":"num","runs":[["膜蛋白的方向性在什么部位、什么时候确定？为什么在之后的转运过程中不会改变？",false]]},{"kind":"num","runs":[["说出膜流动性的四条影响因素，并说明胆固醇为什么被称为“双向调节器”。",false]]},{"kind":"num","runs":[["用“结构—位置—朝向—性质”四个角度说明膜结构与功能的对应关系。",false]]}]}]},{"n":"T3","special":true,"title":"原理二：跨膜运输的能量学——为什么能逆浓度梯度","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["物质过膜的方式有哪几类，分类的根本依据是什么？",false]]},{"kind":"bullet","runs":[["为什么有的运输需要能量、有的不需要？能量从哪里来？",false]]},{"kind":"bullet","runs":[["通道与载体的本质区别是什么，决定了它们各适合什么任务？",false]]},{"kind":"bullet","runs":[["钠钾泵为什么消耗一个 ATP 能泵出 3 个 Na⁺、泵入 2 个 K⁺？这个数字有什么意义？",false]]},{"kind":"bullet","runs":[["主动运输、通道蛋白与膜电位之间是什么关系？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 4 章：被动运输（简单扩散、协助扩散、通道、载体）、主动运输（泵、协同运输、光驱动泵）、胞吞与胞吐、离子通道的门控类型。",false]]},{"kind":"bullet","runs":[["第 11 章：离子通道与膜电位、可兴奋细胞的信号；第 7 章：线粒体膜上的电子传递与质子泵；专题 T1：光门控通道。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 7、Day 8。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["一、分类原理：一切运输都由电化学梯度与自由能变化决定",true]]},{"kind":"p","runs":[["物质跨膜的方向由两个力共同决定：浓度梯度（化学势）与膜电位（电势），合称电化学梯度。凡顺电化学梯度、体系自由能降低的过程属于被动运输（简单扩散、协助扩散、通道运输），不需要细胞供能；凡逆电化学梯度、自由能升高的过程属于主动运输，必须与放能过程耦联才能进行。这就是全部运输方式的统一判据。",false]]},{"kind":"p","runs":[["二、被动运输原理：降低活化能与提供亲水通路",true]]},{"kind":"p","runs":[["脂双层对物质的通透性取决于分子的大小与极性：小分子非极性物质（O₂、CO₂、乙醇）自由扩散；水与甘油可经水通道或缓慢扩散；而葡萄糖、离子、氨基酸等极性物质必须借助膜蛋白。通道与载体都不改变运输方向，只降低跨越疏水屏障所需的活化能。",false]]},{"kind":"p","runs":[["三、通道与载体：两种不同的工作方式",true]]},{"kind":"p","runs":[["通道形成贯穿膜的亲水孔道，转运速率极高（每秒 10⁶～10⁸ 个离子），只作被动运输，且受门控（电压门控、配体门控、应力激活）；载体每次结合并转运一个或少量底物，速率低（每秒 10²～10⁴），要经历构象改变，因此既可行被动运输也可行主动运输。由此可以判断：需要高速、快速响应的场合（神经、肌肉）用通道；需要选择性强、可控速率的场合用载体。",false]]},{"kind":"p","runs":[["四、主动运输原理：耦联一个放能反应",true]]},{"kind":"p","runs":[["ATP 驱动泵（P 型、V 型、F 型、ABC 超家族）直接水解 ATP 供能；协同运输利用一种离子（多为 Na⁺ 或 H⁺）顺电化学梯度回流所释放的自由能，把另一种物质逆梯度转运，属于继发性主动运输，分同向与反向两类；光驱动泵（如细菌视紫红质）利用光能。三种来源不同，但共同点是与放能过程严格耦联。",false]]},{"kind":"p","runs":[["五、钠钾泵：一次循环的化学计量与意义",true]]},{"kind":"p","runs":[["钠钾泵每水解 1 个 ATP，泵出 3 个 Na⁺、泵入 2 个 K⁺，因而一个循环净移出 1 个正电荷，是生电性泵。它使细胞内高 K⁺、低 Na⁺，并造成膜内负外的电位差，这也是静息膜电位的来源之一。功能上它维持渗透平衡（防止细胞吸水胀破）、维持膜电位、为继发性主动运输提供 Na⁺ 梯度，例如小肠上皮细胞吸收葡萄糖、肾小管重吸收氨基酸都依赖它建立的 Na⁺ 梯度。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["电化学梯度 → 被动运输（通道、载体）→ 膜电位 → 动作电位 → 神经元信号（第 11 章 + T1）",false]]},{"kind":"bullet","runs":[["ATP 水解 → 泵的构象循环 → 钠钾泵、钙泵、质子泵 → 细胞内外离子分布与渗透平衡（第 3、4 章）",false]]},{"kind":"bullet","runs":[["质子梯度 → 线粒体氧化磷酸化与叶绿体光合磷酸化 → 化学渗透学说（第 7 章 + T5）",false]]},{"kind":"bullet","runs":[["Na⁺ 梯度 → 小肠上皮与肾小管的继发性主动运输 → 葡萄糖吸收、霍乱毒素与水盐代谢（第 4 章 + 病理）",false]]},{"kind":"bullet","runs":[["载体的构象变化 → 易化扩散与主动运输的共同机制 → 与酶的催化、G 蛋白开关共用“构象循环”这一底层逻辑（第 11 章）",false]]}]},{"key":"apply","title":"灵活运用","blocks":[{"kind":"qa","q":"【情境】某同学把细胞放在含 Na⁺ 的溶液中，再用乌本苷（钠钾泵抑制剂）处理，发现细胞内 Na⁺ 浓度升高、K⁺ 降低，细胞逐渐吸水。请解释乌本苷的作用机制与上述现象之间的关系。","a":"答案：①乌本苷与钠钾泵的 K⁺ 结合位点结合，抑制 ATP 水解和钠钾泵的构象循环，使 Na⁺ 不能被泵出、K⁺ 不能被泵入；②细胞内 Na⁺ 浓度升高、K⁺ 浓度降低，细胞内外原有的离子梯度消失；③细胞内的蛋白质与核酸等大分子带负电，使水因渗透作用进入细胞，而失去 Na⁺ 外排能力后细胞无法维持渗透平衡，于是逐渐吸水膨胀；④若在红细胞上继续升高乌本苷浓度，细胞将超过膜面积可拉伸的限度而溶血。可见钠钾泵不仅维持膜电位，也是维持细胞渗透平衡与体积稳定的关键。","src":"灵活运用 · 综合"},{"kind":"qa","q":"【比较】为什么神经细胞在传递信号时使用离子通道，而小肠上皮细胞吸收葡萄糖时先使用载体、再依靠钠钾泵？请从能量与速率的原理上解释。","a":"答案：①神经信号要求毫秒级、快速完成并能迅速恢复，通道的转运速率可达每秒 10⁶～10⁸ 个离子，且只需电化学梯度提供动力，所以适合动作电位的快速去极化与复极化；②小肠上皮细胞吸收葡萄糖时，肠腔葡萄糖浓度可能低于细胞内，必须逆浓度梯度运输，此时由钠钾泵消耗 ATP 建立 Na⁺ 梯度，再经 Na⁺—葡萄糖协同运输载体（同向协同）把葡萄糖带进细胞，属于继发性主动运输；③载体每次转运需要构象改变，速率低但可以耦联能量、专一性强，适合承担逆梯度的精细运输。可见运输方式的选择由任务对速率与能量的要求共同决定。","src":"灵活运用 · 比较"},{"kind":"qa","q":"【实验设计】请设计实验证明某物质的跨膜运输是主动运输而不是被动运输（至少写出三项判断依据与相应的实验思路）。","a":"答案：①方向判据：测定细胞内外的浓度，若运输方向是逆浓度梯度（胞内浓度显著高于胞外），则必为主动运输；②能量判据：用呼吸链抑制剂（如氰化物）、解偶联剂（如 2,4-二硝基苯酚）或低温处理，若运输速率显著下降甚至停止，说明依赖 ATP；③耦联判据：改变介质中 Na⁺（或 H⁺）的浓度，若运输速率随之改变，说明依赖离子梯度（继发性主动运输）；④专一性对照：加入钠钾泵抑制剂乌本苷，若运输受抑制，说明由钠钾泵建立的梯度供能；⑤若同时测定 ATP 消耗量，运输量与 ATP 水解量的化学计量关系也可作为直接证据。以上各项结合，即可判定为主动运输并区分其供能方式。","src":"灵活运用 · 实验设计"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["说出物质跨膜运输的统一判据，并据此把运输方式分类。",false]]},{"kind":"num","runs":[["通道与载体在工作方式、速率、能量上的本质区别是什么？",false]]},{"kind":"num","runs":[["钠钾泵一次循环的化学计量是多少？为什么说它是生电性泵？",false]]},{"kind":"num","runs":[["主动运输的三种能量来源分别是什么？各举一例。",false]]}]}]},{"n":"T4","special":true,"title":"原理三：分选信号与膜泡运输——蛋白质如何各就各位","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["一个蛋白质合成后，靠什么知道该去哪里？",false]]},{"kind":"bullet","runs":[["为什么分泌蛋白要“边合成边进入内质网”，而不能先合好再送？",false]]},{"kind":"bullet","runs":[["膜泡运输如何保证货物不送错、膜不丢失？",false]]},{"kind":"bullet","runs":[["细胞膜的“出入口”如何保持平衡，为什么细胞不会越分泌越小？",false]]},{"kind":"bullet","runs":[["哪些细胞器不用膜泡运输，它们靠什么把蛋白送进去？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 5 章：内质网、高尔基体、溶酶体、过氧化物酶体的结构与功能。第 6 章：信号肽、共翻译转运、COPⅠ/COPⅡ、网格蛋白、Rab、SNARE、M6P 分选。",false]]},{"kind":"bullet","runs":[["第 10 章：核糖体与翻译。第 3 章：膜蛋白方向性。第 15 章：溶酶体与自噬。第 12 章：分泌与免疫效应分子的释放。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 9、Day 10。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["一、分选原理：信号决定去向",true]]},{"kind":"p","runs":[["蛋白质的去向由其自身的分选信号决定，而不是由运输机器“挑选”。信号肽（N 端，引导进入内质网，进入后常被切除）、KDEL/KKXX（驻留与回收信号）、M6P（溶酶体酶的标记）、核定位信号、线粒体与叶绿体的基质导入信号等，都是写在蛋白质本身的一段短序列。只要给一个胞质蛋白加上内质网信号肽，它就会被送到内质网——这是“信号决定去向”的直接证据。",false]]},{"kind":"p","runs":[["二、共翻译转运原理：边合成边穿膜",true]]},{"kind":"p","runs":[["信号肽一露出核糖体即被信号识别颗粒（SRP）识别并结合，翻译暂停；SRP 与内质网膜上的 SRP 受体结合，把核糖体带到易位子上，翻译恢复，肽链直接穿入内质网腔。这样安排的意义是：避免蛋白在胞质中先折叠成不能穿膜的构象，也使疏水肽段不会暴露在胞质水相中造成聚集。",false]]},{"kind":"p","runs":[["三、膜泡运输的三个保证",true]]},{"kind":"p","runs":[["① 出芽与选择货物：COPⅡ 负责内质网到高尔基体的顺向运输，COPⅠ 负责高尔基体到内质网的回收与膜内运输，网格蛋白参与高尔基体到质膜、质膜内吞的途径；② 定向对接：Rab 蛋白家族（哺乳动物 60 多种）像“邮政编码”一样把膜泡引到正确的靶膜；③ 特异性融合：v-SNARE 与 t-SNARE 配对形成四螺旋束，保证膜泡只与正确靶膜融合。三者共同保证货物不送错。",false]]},{"kind":"p","runs":[["四、膜循环原理：出口必有入口",true]]},{"kind":"p","runs":[["细胞每分泌一次都有膜加到质膜上，若没有回补，质膜面积会不断增大。事实上胞吐与胞吞是耦联的，内吞把膜与膜蛋白回收，一部分回到质膜（回收途径），一部分送往溶酶体降解（降解途径）。这就是“膜循环”。膜泡运输必须同时满足两条守恒：膜面积守恒与拓扑学守恒（膜不翻转，糖链始终朝向腔面或膜外）。",false]]},{"kind":"p","runs":[["五、条件与例外：不走膜泡的运输",true]]},{"kind":"p","runs":[["核编码的线粒体、叶绿体蛋白、过氧化物酶体蛋白以及核蛋白都属于翻译后转运：蛋白在胞质中合成并折叠完成后，由分子伴侣维持解折叠状态，经易位子直接穿膜进入细胞器。它们不需要膜泡，因为靶细胞器本身有自身的膜转运装置。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["核糖体（第 10 章）→ 信号肽 → 内质网（第 5 章）→ 高尔基体加工与分选（第 6 章）→ 溶酶体、质膜、分泌泡（一条流水线）",false]]},{"kind":"bullet","runs":[["膜蛋白方向性（T2）→ 拓扑学保持不变 → 膜泡运输不翻转 → 糖链朝向膜外",false]]},{"kind":"bullet","runs":[["受体介导的内吞 → LDL 摄取 → 家族性高胆固醇血症（疾病层面）",false]]},{"kind":"bullet","runs":[["溶酶体酶 M6P 分选 → 溶酶体功能 → 自噬与垃圾清除（T10）→ 肿瘤耐药与药物治疗",false]]},{"kind":"bullet","runs":[["分泌泡的调节性分泌 → 神经递质释放 → 突触信号（第 11 章 + T1）",false]]}]},{"key":"apply","title":"灵活运用","blocks":[{"kind":"qa","q":"【情境】Ⅰ 型包涵体细胞病（I-cell disease）患者细胞内缺少多种溶酶体酶，这些酶反而被分泌到细胞外，患者细胞内出现大量未消化物质形成的包涵体。请解释该病发生的原理。","a":"答案：①正常情况下，溶酶体酶在高尔基体中被加上甘露糖-6-磷酸（M6P）标记，再由 M6P 受体识别并分选进入溶酶体；②该病患者缺乏催化 M6P 标记形成的磷酸转移酶，溶酶体酶不能被标记，M6P 受体无法识别它们；③这些酶于是按默认途径被分泌到细胞外，而溶酶体内缺少应有的酸性水解酶，未被消化的物质（黏多糖、脂类等）在溶酶体内堆积形成包涵体；④患者表现出骨骼畸形、智力发育迟缓等多系统症状。该病说明：分选信号是蛋白质定位的必要条件，缺少信号会导致定位错误并引起疾病。","src":"灵活运用 · 情境"},{"kind":"qa","q":"【实验设计】请设计实验证明某分泌蛋白是经“内质网—高尔基体—分泌泡”途径分泌的。","a":"答案：①脉冲—追踪实验：用放射性氨基酸短时间标记细胞（脉冲），再在无标记培养基中追踪不同时间，用免疫沉淀或电镜放射自显影定位标记蛋白的位置，若顺序为内质网→高尔基体→分泌泡→细胞外，即证明该途径；②阻断实验：用布雷菲德菌素 A（BFA）抑制内质网到高尔基体的运输，或用温度敏感突变体（sec 突变体）在限制温度下阻断某一步，蛋白会滞留在相应部位，作为因果证据；③共定位实验：用荧光或免疫电镜标记该蛋白与内质网、高尔基体的标志物，观察共定位顺序；④对照：加入蛋白合成抑制剂（放线菌酮）后信号不再出现，排除非分泌途径。以上结果一致即可证明该分泌途径。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【变式】为什么线粒体和叶绿体的蛋白质不通过膜泡运输？它们进入细胞器需要满足哪些条件？","a":"答案：线粒体与叶绿体不是内膜系统的成员，与细胞质之间没有膜泡来往途径，因此只能采用翻译后转运：①蛋白在胞质核糖体上合成完成；②必须保持未折叠（解折叠）状态，由分子伴侣（Hsp70 等）维持，否则无法穿过窄小的易位通道；③依靠 N 端的基质导入信号被细胞器膜上的受体识别，在 TOM/TIM 或 TOC/TIC 复合物协助下穿越外膜与内膜；④进入基质后信号肽被切除，由分子伴侣帮助折叠成有功能的构象；⑤全过程消耗 ATP（部分步骤还依赖膜电位）。","src":"灵活运用 · 概念辨析"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["为什么说“信号决定蛋白质的去向”？举出三类分选信号并说明其作用。",false]]},{"kind":"num","runs":[["共翻译转运有什么意义？描述 SRP、SRP 受体与易位子的分工。",false]]},{"kind":"num","runs":[["膜泡运输中 COPⅠ、COPⅡ、Rab、SNARE 各自的职责是什么？",false]]},{"kind":"num","runs":[["什么是膜循环？为什么说胞吐与胞吞必须耦联？",false]]}]}]},{"n":"T5","special":true,"title":"原理四：能量转换的膜原理——化学渗透与光合作用","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["细胞如何把食物或光能变成 ATP？中间形式是什么？",false]]},{"kind":"bullet","runs":[["为什么能量转换必须发生在膜上，而不能在溶液中进行？",false]]},{"kind":"bullet","runs":[["线粒体与叶绿体的结构如何与能量转换功能对应？",false]]},{"kind":"bullet","runs":[["什么是半自主性？有哪些证据？",false]]},{"kind":"bullet","runs":[["解偶联、褐色脂肪产热、光呼吸这些“例外”说明了什么？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 7 章：线粒体与叶绿体的形态结构、呼吸链复合物、氧化磷酸化、化学渗透学说、光合作用光反应与暗反应、半自主性与内共生起源。",false]]},{"kind":"bullet","runs":[["第 4 章：质子泵与膜运输；第 3 章：膜的结构与流动性；T2/T3：膜与运输的基本原理。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 13、Day 14、Day 48。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["一、化学渗透原理：质子梯度是能量的“中间货币”",true]]},{"kind":"p","runs":[["电子沿呼吸链传递时释放的自由能被用来把 H⁺ 从基质泵到膜间隙，形成跨膜质子动力势（PMF = ΔpH + 膜电位 Δψ，线粒体中以 Δψ 为主）。H⁺ 再顺梯度经 ATP 合酶回流，驱动 ATP 合酶旋转催化 ADP 与 Pi 合成 ATP。能量的转换顺序是：化学能（NADH/FADH₂）→ 电子传递的自由能 → 质子梯度（势能）→ ATP 的化学能。",false]]},{"kind":"p","runs":[["推论：能量转换必须发生在膜上，因为膜一方面提供不可渗透的绝缘层，使质子梯度能被“存住”；另一方面提供固定的电子载体与 ATP 合酶的组装平台，使电子传递与质子泵定向耦联。若没有封闭的膜，梯度会立即消散，无法储存能量。",false]]},{"kind":"p","runs":[["二、解偶联与抑制：两种不同的“破坏方式”",true]]},{"kind":"p","runs":[["呼吸链抑制剂（如氰化物、抗霉素 A、鱼藤酮）阻断电子的传递，耗氧量与 ATP 生成同时下降；解偶联剂（如 2,4-二硝基苯酚）把质子直接“带回”膜间隙，破坏梯度，此时电子仍可传递、耗氧量不减甚至升高，但 ATP 生成减少，能量以热的形式释放。褐色脂肪组织就是利用解偶联蛋白（UCP1）产热，这是生理性的解偶联。",false]]},{"kind":"p","runs":[["三、光合作用：同样是化学渗透，方向与来源不同",true]]},{"kind":"p","runs":[["光反应发生在类囊体膜上：光系统Ⅱ（PSⅡ）吸收光能，裂解水（放氧复合体，含 Mn 簇）释放 O₂、H⁺ 与电子；电子经质体醌、细胞色素 b6f 复合物、质体蓝素传到光系统Ⅰ（PSⅠ），再经铁氧还蛋白与 FNR 使 NADP⁺ 还原为 NADPH；电子传递过程中 H⁺ 被泵入类囊体腔，形成质子梯度，经 ATP 合酶生成 ATP（光合磷酸化）。暗反应（卡尔文循环）在基质中进行，用 ATP 与 NADPH 固定 CO₂ 生成三碳糖。C4 与 CAM 植物通过预先固定 CO₂ 降低光呼吸损失，适应高温干旱环境。",false]]},{"kind":"p","runs":[["四、结构与功能对应、半自主性",true]]},{"kind":"p","runs":[["线粒体内膜向内折叠形成嵴，叶绿体类囊体堆叠成基粒，都是为了在有限体积内增加膜的绝对面积，从而容纳更多呼吸链与光反应复合物——这是“结构与功能相适应”的经典例证。线粒体与叶绿体有自身的环状 DNA、核糖体与 tRNA，能合成部分自身蛋白质并分裂增殖；但它们的大部分蛋白质由核基因编码、在胞质中合成后运入，因此只是半自主性细胞器，其起源可用内共生学说解释（证据：双层膜、环状 DNA、70S 核糖体、对抗生素的敏感性、二分裂方式）。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["化学渗透 → 细菌视紫红质（光驱动质子泵）→ 光门控通道（T1 诺奖专题）：膜上能量与信息转换的两种极端形式",false]]},{"kind":"bullet","runs":[["线粒体通透性改变 → 细胞色素 c 释放 → 凋亡（T10）→ 癌症治疗靶点（T13）",false]]},{"kind":"bullet","runs":[["线粒体与叶绿体 → 半自主性 → 细胞质遗传 → 母性遗传与线粒体病",false]]},{"kind":"bullet","runs":[["呼吸链副产物 → 活性氧（ROS）→ 细胞衰老与抗氧化系统（SOD、过氧化氢酶、T10）",false]]},{"kind":"bullet","runs":[["内膜折叠增加膜面积 ↔ 膜原理（T2）：结构决定容量，容量决定速率",false]]}]},{"key":"apply","title":"灵活运用","blocks":[{"kind":"qa","q":"【情境】某种药物处理后，线粒体的耗氧量明显增加，但细胞内 ATP 含量下降、温度升高。请判断该药物的作用类型并解释原因；若换成氰化物，结果会有什么不同？","a":"答案：①耗氧量增加而 ATP 减少、产热增加，说明电子传递仍在进行但其释放的能量没有用于合成 ATP，符合解偶联剂（如 2,4-二硝基苯酚）的特征——它把 H⁺ 直接带回基质，破坏质子梯度，ATP 合酶失去驱动力，能量全部以热的形式散失；②若换成氰化物，它抑制细胞色素氧化酶，阻断电子传递，此时耗氧量下降，ATP 生成也下降（同步下降），但它同时会导致细胞因缺氧能量而死亡，与解偶联的“耗氧升高、产热升高”明显不同；③两者的共同点是都降低 ATP 产量，区别在于作用位点与耗氧量的变化方向。","src":"灵活运用 · 情境"},{"kind":"qa","q":"【比较】比较线粒体和叶绿体的能量转换过程（电子供体、末端电子受体、质子梯度所在部位、ATP 合酶朝向、净产物）。","a":"答案：①电子供体：线粒体为 NADH（和 FADH₂，来自糖与脂肪的氧化）；叶绿体为水（光系统Ⅱ 裂解水提供电子）；②末端电子受体：线粒体为 O₂，生成水；叶绿体为 NADP⁺，生成 NADPH；③质子梯度：线粒体把 H⁺ 泵到膜间隙，基质中 H⁺ 浓度低，ATP 合酶朝向基质合成 ATP（向内）；叶绿体把 H⁺ 泵入类囊体腔，ATP 合酶朝向基质一侧，ATP 释放到基质中；④能量来源：线粒体来自化学能（食物），叶绿体来自光能；⑤净产物：线粒体产生 ATP、H₂O，并生成 CO₂；叶绿体产生 ATP、NADPH 与 O₂，并在卡尔文循环中固定 CO₂ 生成糖。二者共同点是都使用化学渗透机制、都由 ATP 合酶催化，体现“同一原理、不同方向”的统一性。","src":"灵活运用 · 比较"},{"kind":"qa","q":"【实验设计】请设计实验证明光合作用释放的 O₂ 来自水而不是 CO₂，并说明如何进一步证明光反应与暗反应的分工。","a":"答案：①同位素标记法：分别用 H₂¹⁸O 与 C¹⁸O₂ 培养小球藻，检测释放的 O₂ 中的同位素组成，若只在使用 H₂¹⁸O 时检测到 ¹⁸O₂，即证明 O₂ 来自水；②光反应与暗反应的分工：把叶绿体置于只含光、不含 CO₂ 的条件下短暂照光，可测得 ATP 与 NADPH 的生成（光反应独立完成），但不产生糖；再在黑暗中加入 ATP 与 NADPH 与 CO₂，可检测到糖的生成（暗反应不直接需要光，但需要光反应的产物）；③对照：暗处或加入 DCMU（阻断 PSⅡ 的电子传递）后，ATP、NADPH 与 O₂ 的生成均消失，说明光反应是暗反应的前提。以上结果共同证明：水的裂解与电子传递发生在光反应阶段，CO₂ 的固定发生在暗反应阶段。","src":"灵活运用 · 实验设计"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["什么是化学渗透学说？为什么能量转换必须发生在膜上？",false]]},{"kind":"num","runs":[["呼吸链抑制剂与解偶联剂的作用结果有什么本质区别？",false]]},{"kind":"num","runs":[["写出光合作用光反应中电子从水到 NADPH 的传递顺序，并说明质子梯度的形成与用途。",false]]},{"kind":"num","runs":[["什么是半自主性？列出支持内共生学说的三条证据。",false]]}]}]},{"n":"T6","special":true,"title":"原理五：自组装与力的产生——细胞骨架与分子马达","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["细胞骨架为什么能自己装起来、又能随时拆掉？",false]]},{"kind":"bullet","runs":[["微管、微丝、中间纤维的组装原理有什么不同？",false]]},{"kind":"bullet","runs":[["马达蛋白怎样把 ATP 的化学能变成定向的机械运动？",false]]},{"kind":"bullet","runs":[["骨架如何与膜、与细胞连接协作，承担支撑、运输与分裂？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 8 章：微丝、微管、中间纤维的组成与组装、微管组织中心、分子马达、细胞骨架结合蛋白与药物、细胞骨架的功能。",false]]},{"kind":"bullet","runs":[["第 3 章：红细胞膜骨架。第 12 章：细胞连接与细胞外基质。第 13 章：纺锤体与胞质分裂。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 15、Day 16、Day 22。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["一、自组装原理：可逆聚合与临界浓度",true]]},{"kind":"p","runs":[["微管蛋白与肌动蛋白在溶液中可自发聚合成纤维，这一过程是熵驱动的可逆反应，存在临界浓度（C_c）：当游离亚基浓度高于 C_c 时聚合占优势，低于 C_c 时解聚占优势。聚合的限速步骤是成核（几个亚基先形成核心），因此成核一旦完成，延伸很快。细胞用成核位点（微管组织中心、微丝成核蛋白）控制“在哪里装、装多少”，从而控制骨架的空间布局。",false]]},{"kind":"p","runs":[["二、动态性原理：踏车与动态不稳定",true]]},{"kind":"p","runs":[["微丝表现为踏车行为：正极加亚基、负极失亚基，纤维净长度不变而亚基不断流动，这与细胞迁移、胞质分裂中的快速重塑相适应。微管表现为动态不稳定：正极的 GTP-微管蛋白帽一旦水解丢失，纤维会迅速解聚（灾变），再重新生长（救援），使微管在短时间内探索空间、快速重排。中间纤维没有极性、不依赖马达，也不表现上述动态，而是在磷酸化/去磷酸化控制下发生组装与解组装，主要承担机械强度。",false]]},{"kind":"p","runs":[["三、极性决定方向，马达产生力",true]]},{"kind":"p","runs":[["微管与微丝都有极性（正极、负极），马达蛋白按固定方向移动：驱动蛋白（kinesin）沿微管走向正极（一般向细胞外周），动力蛋白（dynein）走向负极（一般向细胞中心），肌球蛋白（myosin）沿微丝走向正极。马达蛋白以 ATP 水解驱动构象循环，每水解一个 ATP 移动一步（驱动蛋白约 8nm），把化学能转化为机械功。骨架与马达的组合构成了细胞内定向运输、纤毛摆动、肌肉收缩与胞质分裂的共同机制。",false]]},{"kind":"p","runs":[["四、组织中心与调控：药物证据",true]]},{"kind":"p","runs":[["微管由中心的 γ-微管蛋白环成核（动物细胞以中心体为微管组织中心），微丝由 Arp2/3 与形成素成核，并受加帽、切断、交联蛋白调控。药物是常用实验工具：秋水仙素抑制微管聚合、紫杉醇（泰素）稳定微管使无法解聚、细胞松弛素破坏微丝、鬼笔环肽稳定微丝、诺考达唑可逆解聚微管。它们说明骨架的“动态”而不是“静态”才是其功能基础。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["自组装 + 极性 + 马达 → 胞内定向运输 → 神经轴突运输与色素颗粒分布（第 8、11 章）",false]]},{"kind":"bullet","runs":[["微管 → 纺锤体 → 染色体分离与有丝分裂（T7）→ 非整倍体与肿瘤（T13）",false]]},{"kind":"bullet","runs":[["微丝 → 收缩环 → 胞质分裂（T7）；微丝与膜 → 微绒毛、胞吞与细胞迁移（T2、T4）",false]]},{"kind":"bullet","runs":[["中间纤维 → 桥粒与半桥粒 → 组织机械强度 → 大疱性表皮松解症（角蛋白突变）；骨架重排 → 上皮-间质转化与肿瘤转移（T13）",false]]},{"kind":"bullet","runs":[["骨架与膜相互作用 → 红细胞膜骨架（T2）→ 膜的力学稳定性与溶血性疾病",false]]}]},{"key":"apply","title":"灵活运用","blocks":[{"kind":"qa","q":"【情境】用秋水仙素处理培养细胞后，细胞停留在分裂中期、细胞内的囊泡运输与细胞迁移也受到抑制。请解释原因，并说明秋水仙素与紫杉醇作用的区别。","a":"答案：①秋水仙素与微管蛋白二聚体结合，阻止其聚合成微管，导致纺锤体无法形成，染色体不能排列到赤道板，细胞停滞在分裂期（同时微管依赖的细胞内运输、纤毛摆动与细胞迁移受阻）；②两者都作用于微管，但机制相反：秋水仙素抑制微管的聚合（使微管减少），紫杉醇则结合并稳定已形成的微管，使其不能解聚（使微管异常稳定），同样阻断纺锤体的动态重排，因此细胞也停在分裂期；③可见骨架的功能不取决于“有或没有”，而取决于聚合与解聚的动态平衡，这也正是两类药物都能作为抗肿瘤药的原因。","src":"灵活运用 · 情境"},{"kind":"qa","q":"【实验设计】请设计体外实验证明驱动蛋白沿微管向正极移动。","a":"答案：①把纯化的微管用非特异吸附固定在载玻片表面，并标出极性（可用成核实验或已知极性的微管段判断）；②加入纯化的驱动蛋白与荧光标记的货物（如微珠或囊泡）；③加入 ATP 后，在荧光显微镜下连续观察货物的位移方向：若货物持续向微管的正极移动且速度均匀（约几百纳米每秒至 1 微米每秒），即支持驱动蛋白是正向马达；④对照：不加 ATP 或加入不可水解的 ATP 类似物（如 AMP-PNP），货物停止移动；加入动力蛋白时货物应反向（向负极）移动，作为方向特异性对照；⑤可进一步用光镊或激光陷阱测量步长（约 8nm/ATP）与力的大小。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较】从组成、直径、极性、动态性、结合蛋白、主要功能六个方面比较三种细胞骨架纤维。","a":"答案：①微管：由 α、β 微管蛋白二聚体组成，直径约 25nm，有极性，表现动态不稳定，结合蛋白包括 γ-微管蛋白、加帽蛋白、切壁蛋白、马达蛋白，主要功能是维持形态、参与细胞内运输、形成纺锤体与纤毛；②微丝：由肌动蛋白组成，直径约 7nm，有极性，表现踏车行为，结合蛋白包括成核蛋白、加帽蛋白、切断蛋白、交联蛋白与肌球蛋白，主要功能是维持细胞形态、参与细胞运动、胞质分裂与肌肉收缩，构成微绒毛与收缩环；③中间纤维：由角蛋白、波形蛋白、层粘连蛋白等组成，直径约 10nm，无极性，无马达，动态性低，主要通过桥粒与半桥粒连接细胞并抵抗机械张力，是三者中机械强度最高的一类。三者的共性都是自组装、可调控、与膜和连接结构协作。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["为什么说细胞骨架是“动态”的？踏车与动态不稳定有什么区别？",false]]},{"kind":"num","runs":[["马达蛋白如何把化学能变成定向运动？三种马达的方向各是怎样确定的？",false]]},{"kind":"num","runs":[["中间纤维与其他两种骨架纤维在结构与功能上的关键差别是什么？",false]]},{"kind":"num","runs":[["举出四种作用于细胞骨架的药物并说明其作用机制。",false]]}]}]},{"n":"T7","special":true,"title":"原理六：遗传信息的压缩、复制与均分","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["DNA 如何在细胞核内被压缩上千倍，还能被随时读取？",false]]},{"kind":"bullet","runs":[["核孔复合体如何实现“选择性通行”？",false]]},{"kind":"bullet","runs":[["染色质与染色体的关系是什么，为什么需要这两种状态？",false]]},{"kind":"bullet","runs":[["有丝分裂与减数分裂的底层差别在哪里？",false]]},{"kind":"bullet","runs":[["染色体如何被精确均分，错误会导致什么后果？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 9 章：核被膜与核孔复合体、染色质与染色体、核仁、核基质。第 12 章：有丝分裂与减数分裂、联会复合体、纺锤体与检查点。",false]]},{"kind":"bullet","runs":[["第 10 章：核糖体与翻译、核仁功能；第 14 章：基因表达调控与表观遗传；T13：非整倍体与癌变。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 17、Day 18。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["一、压缩原理：分级螺旋与“可开可关”的折中",true]]},{"kind":"p","runs":[["染色质由核小体（H2A、H2B、H3、H4 各两分子构成八聚体，DNA 绕 1.75 圈）串成“串珠”，再经 30nm 螺线管、环状结构域、超螺旋等多级折叠压缩成染色体。压缩的目的不仅是装进细胞核，还要保证在需要时能被解折叠、被转录与复制。因此染色质有两种存在形式：常染色质（松散、转录活跃）与异染色质（浓缩、转录不活跃），两者可随细胞状态互相转变。",false]]},{"kind":"p","runs":[["推论：凡涉及“为什么能压缩又能表达”的题目，答题要点都是“多级压缩 + 可逆 + 组蛋白修饰与染色质重塑共同调节”。",false]]},{"kind":"p","runs":[["二、选择性通行原理：核孔复合体与核质运输",true]]},{"kind":"p","runs":[["核孔复合体由 30 多种核孔蛋白构成八重对称的通道，允许小分子自由扩散，而大分子（蛋白质、RNA、核糖体亚基）必须凭信号进出：带核定位信号（NLS）的蛋白由 importin 识别并携带进入核内，带核输出信号（NES）的蛋白由 exportin 携带出核，过程都依赖 Ran-GTP 的浓度梯度（核内 Ran-GTP 高、胞质 Ran-GDP 高）。mRNA、tRNA、核糖体亚基各有专门的输出途径。",false]]},{"kind":"p","runs":[["三、染色体构建原理：写好在绳上的“密码”",true]]},{"kind":"p","runs":[["染色体的形态结构与其功能直接对应：着丝粒（含 CENP-A 与卫星 DNA 序列）是纺锤丝附着位点，与动粒共同承担“被抓住”；端粒（TTAGGG 重复序列与端粒酶）保护染色体末端、防止末端被误认为断裂，与细胞衰老直接相关；复制起点保证 DNA 能高效复制；臂区的常染色质与异染色质分布决定基因表达状态。凡是染色体结构题，都应从着丝粒、端粒、复制起点三要素展开。",false]]},{"kind":"p","runs":[["四、均分原理：纺锤体的“抓、排、拉”与检查点",true]]},{"kind":"p","runs":[["有丝分裂保证遗传物质的等量分配：前期染色体凝集、纺锤体形成，中期染色体在赤道板排列（关键是被两侧纺锤丝同时抓住），后期动粒微管缩短与极性微管延长共同把姐妹染色单体拉向两极，末期重建核膜与去凝集。核心是“两侧张力对称”，纺锤体组装检查点只在张力与连接正确时才允许进入分裂后期。减数分裂的差别在于：一次 DNA 复制后进行两次分裂，第一次分裂时同源染色体配对（联会复合体）并发生交叉重组，实现基因重组；第二次分裂类似有丝分裂，分离的是姐妹染色单体，最终产生单倍体的配子。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["核小体 → 染色质 → 染色体 → 有丝分裂/减数分裂（第 9、12 章）",false]]},{"kind":"bullet","runs":[["端粒 → 端粒酶 → Hayflick 界限 → 细胞衰老与肿瘤永生化（T10、T13）",false]]},{"kind":"bullet","runs":[["组蛋白修饰与 DNA 甲基化 → 表观遗传 → 细胞分化与基因表达调控（T11）",false]]},{"kind":"bullet","runs":[["核孔运输 → 转录因子进核 → 信号转导的终点（T8）；mRNA 输出 → 核糖体（第 10 章）",false]]},{"kind":"bullet","runs":[["纺锤体检查点失效 → 非整倍体 → 肿瘤的发生与耐药（T13）",false]]}]},{"key":"apply","title":"灵活运用","blocks":[{"kind":"qa","q":"【情境】某实验室发现一种突变细胞在分裂中期染色体排列基本正常，但仍有两个染色体未被纺锤丝正确抓住，细胞仍进入后期并产生非整倍体子细胞。请解释这种表型可能的分子基础及其后果。","a":"答案：①正常情况下，纺锤体组装检查点会持续产生“等待”信号，直到每一个动粒都被两侧纺锤丝正确连接并形成适当张力，才解除抑制并允许进入后期；②该突变细胞在动粒未被抓住时仍进入后期，说明检查点蛋白（如 Mad、Bub 家族或动粒相关激酶）功能缺失，或动粒-微管的纠错机制失效；③后果是染色体随机分配，产生非整倍体子细胞，引起基因剂量失衡、基因组不稳定，长期积累可导致细胞增殖失控与肿瘤发生；④实验上可用免疫荧光观察动粒与微管的连接、用活细胞成像记录后期发生的时间，并用染色体计数法检测非整倍体，从而验证这一机制。","src":"灵活运用 · 情境"},{"kind":"qa","q":"【比较】从 DNA 复制次数、分裂次数、同源染色体与姐妹染色单体的行为、是否发生重组四个方面比较有丝分裂与减数分裂。","a":"答案：①DNA 复制次数：有丝分裂复制一次、分裂一次，减数分裂复制一次、连续分裂两次；②同源染色体行为：有丝分裂中同源染色体不发生配对与分离，减数分裂第一次分裂时同源染色体配对（联会）、形成四分体并在后期Ⅰ分离；③姐妹染色单体行为：有丝分裂后期姐妹染色单体分离并分别移向两极，减数分裂中期Ⅱ后姐妹染色单体分离；④重组：减数分裂第一次分裂前期发生非姐妹染色单体的交叉互换（交换），有丝分裂一般不发生。结果上，有丝分裂产生两个遗传组成相同的二倍体细胞，减数分裂产生四个遗传组成各异的单倍体细胞，是遗传多样性的来源。","src":"灵活运用 · 比较"},{"kind":"qa","q":"【变式】为什么端粒缩短会引起细胞衰老，而端粒酶活化又常常出现在肿瘤细胞中？","a":"答案：①端粒是染色体末端的重复序列，DNA 聚合酶无法复制线性 DNA 的最末端，因此端粒随每次分裂缩短；当端粒缩短到临界长度，会被识别为 DNA 损伤，激活 p53 通路，引起细胞周期停滞、衰老或凋亡，这就是 Hayflick 界限的分子基础；②生殖细胞、干细胞中有端粒酶活性，可将端粒延长，维持分裂能力；③约 90% 的肿瘤细胞重新激活端粒酶（或采用替代性延长机制 ALT），突破 Hayflick 界限获得无限增殖能力，这是肿瘤细胞的重要特征，也使端粒酶成为抗肿瘤治疗的靶点之一。","src":"灵活运用 · 变式"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["DNA 的压缩分几级？常染色质与异染色质的功能差别是什么？",false]]},{"kind":"num","runs":[["核孔复合体如何实现选择性运输？NLS、NES 与 Ran 梯度各起什么作用？",false]]},{"kind":"num","runs":[["染色体有哪三个功能要素？各自的分子基础是什么？",false]]},{"kind":"num","runs":[["纺锤体组装检查点如何保证染色体精确分配？失效会导致什么后果？",false]]}]}]},{"n":"T8","special":true,"title":"原理七：信号转导——信号如何被放大、整合与关闭","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["激素在血液中浓度极低，细胞凭什么能对这么弱的信号作出强烈反应？",false]]},{"kind":"bullet","runs":[["同一种信号分子，为什么在不同细胞里效果不同，甚至相反？",false]]},{"kind":"bullet","runs":[["信号为什么必须能被及时关闭？“关掉”在信号转导里有多大分量？",false]]},{"kind":"bullet","runs":[["细胞表面受体主要有哪几类，它们各自的开关原理是什么？",false]]},{"kind":"bullet","runs":[["脂溶性信号分子为什么走另一条通路，代价是什么？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 11 章 细胞信号转导：三类膜受体的结构与信号传递方式、G 蛋白循环、第二信使、蛋白激酶级联、受体酪氨酸激酶、核受体。",false]]},{"kind":"bullet","runs":[["交叉：第 3 章与第 6 章（受体的膜拓扑与分选）、第 13 章（生长因子启动增殖）、第 16 章（信号决定细胞命运）、肿瘤与免疫中的通路异常。",false]]},{"kind":"bullet","runs":[["对应主干复习日：Day 20、Day 21、Day 45。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"flow","title":"先看全图：GPCR 与 RTK 怎样分流","blocks":[{"kind":"diagram","type":"gpcr","title":"图解：GPCR 怎样把一条信号分成两条支路","caption":"配体只负责开启受体；Gs/Gi 与 Gq 才决定下游走 cAMP 还是 IP₃/DAG。"},{"kind":"diagram","type":"rtk","title":"图解：RTK 怎样从质膜把信号送进细胞核","caption":"关键开关是二聚化与酪氨酸自磷酸化；磷酸酪氨酸成为胞内蛋白的停靠位点。"}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["第一层原理：信号的本质是构象变化，而不是物质的转移。",true]]},{"kind":"p","runs":[["水溶性信号分子（肾上腺素、肽类激素、生长因子）并不进入细胞，它们只与细胞表面的受体结合，改变受体的构象。构象改变就是信息的载体：受体被“点亮”之后，才把信息交给膜内侧的下游分子。由此得到信号转导的第一个特征——特异性由信号分子与受体的分子形状互补决定；也得到第二个特征——信号分子在传递过程中不被消耗，因此纳摩尔级的激素浓度就足以引起全身性反应。",false]]},{"kind":"p","runs":[["第二层原理：受体分三类，受体类型决定信号的速度与路线。",true]]},{"kind":"bullet","runs":[["离子通道偶联受体：受体本身就是离子通道，配体结合后通道开放、离子顺电化学梯度流过。神经肌肉接头处的乙酰胆碱受体使肌细胞膜去极化，反应时间是毫秒级，适合神经信号。",false]]},{"kind":"bullet","runs":[["G 蛋白偶联受体：七次跨膜，配体结合后激活三聚体 G 蛋白，再由 G 蛋白激活效应器酶产生第二信使，经蛋白激酶级联引起反应，反应时间是秒到分钟级。肾上腺素受体、胰高血糖素受体均属此类。",false]]},{"kind":"bullet","runs":[["酶联受体：多为受体酪氨酸激酶，配体结合使受体二聚化并自身磷酸化，通过 SH2 结构域招募下游蛋白，如 Ras-MAPK 通路；反应时间数分钟到数小时，多与细胞增殖、分化有关。",false]]},{"kind":"p","runs":[["第三层原理：G 蛋白是分子开关，靠 GTP 与 GDP 的交换自动计时。",true]]},{"kind":"p","runs":[["G 蛋白α亚基结合 GTP 时活化、结合 GDP 时失活。受体被配体激活后作为鸟苷酸交换因子，促使α亚基释放 GDP 并换上 GTP；而α亚基本身具有 GTP 酶活性，能把 GTP 水解成 GDP 从而自动关闭。所以只要刺激不再来，G 蛋白会在几秒到几十秒内自行失活，细胞不会被一次刺激永久“粘住”。霍乱毒素破坏的正是这个自动关闭装置：它把 Gs 的α亚基 ADP-核糖基化，使其 GTP 酶活性丧失，G 蛋白被永久打开，cAMP 持续升高。",false]]},{"kind":"p","runs":[["第四层原理：第二信使负责放大。",true]]},{"kind":"p","runs":[["一个受体可以激活多个 G 蛋白，一个 G 蛋白激活一个效应器酶，一个酶催化生成成千上万个 cAMP 分子，一个蛋白激酶 A 又能磷酸化大量底物，级联反应每过一层就放大一次，总放大倍数可达 10⁶～10⁸。肾上腺素引起肝细胞糖原分解就是这样：一个肾上腺素分子最终可促使上万个葡萄糖分子释放入血，这是激素能以极低浓度发挥作用的根本原因。",false]]},{"kind":"p","runs":[["第五层原理：磷酸化是可逆开关，激酶与磷酸酶成对工作。",true]]},{"kind":"p","runs":[["蛋白激酶把 ATP 的磷酸基团转移到丝氨酸、苏氨酸或酪氨酸残基上，改变底物的电荷与构象，使酶激活或失活；蛋白磷酸酶负责去磷酸化，把开关复位。同一个底物可以被不同激酶在多个位点磷酸化，于是多条通路的信息能整合到同一个分子上，这是“信号整合”的分子基础。",false]]},{"kind":"p","runs":[["第六层原理：信号的关闭本身就是调控环节。",true]]},{"kind":"bullet","runs":[["配体被降解，或被细胞摄取清除；",false]]},{"kind":"bullet","runs":[["受体内吞、降解或数量下调，细胞对持续刺激变得不敏感，表现为适应；",false]]},{"kind":"bullet","runs":[["GTP 被水解，G 蛋白自动回到失活状态；",false]]},{"kind":"bullet","runs":[["cAMP 被磷酸二酯酶降解为 5′-AMP；",false]]},{"kind":"bullet","runs":[["底物被蛋白磷酸酶去磷酸化。",false]]},{"kind":"p","runs":[["由此可见，通路的输出并不由刺激的绝对强度决定，而由激活速率与关闭速率的平衡决定。药物西地那非抑制 cGMP 磷酸二酯酶 5 型，就是通过阻断“关闭”环节来延长血管平滑肌的舒张信号。",false]]},{"kind":"p","runs":[["第七层原理：同一条通路在不同细胞里可以给出不同结果。",true]]},{"kind":"p","runs":[["肾上腺素作用于心肌细胞使心率加快、收缩加强，作用于肝细胞促进糖原分解，作用于血管平滑肌则使其舒张：信号分子相同，而受体亚型、G 蛋白种类、效应器酶与下游蛋白质不同，最终反应就不同。激动剂与拮抗剂的差别、Gs 与 Gi 的相互拮抗也建立在这一原理之上。支架蛋白把通路元件固定在特定位置，保证信号专一、互不干扰，这是信号传递具有空间特异性的原因。",false]]},{"kind":"p","runs":[["第八层原理：脂溶性信号走核受体通路，慢而持久。",true]]},{"kind":"p","runs":[["类固醇激素、甲状腺素等脂溶性分子可以穿过质膜，与细胞质或细胞核内的受体结合。受体活化后作为转录因子直接调节基因表达，因此起效慢（数小时到数天）、作用持久，也不需要第二信使。一氧化氮走的是第三条路：它作为气体信号分子扩散进入邻近细胞，激活可溶性鸟苷酸环化酶生成 cGMP，再经蛋白激酶 G 使血管平滑肌舒张，硝酸甘油缓解心绞痛正是通过释放一氧化氮起作用。",false]]},{"kind":"p","runs":[["第九层原理：通路异常是疾病与药物的入口。",true]]},{"kind":"bullet","runs":[["通路过强：霍乱毒素使 Gs 持续活化，Ras 或受体酪氨酸激酶突变使增殖信号不再依赖生长因子，均属此类；",false]]},{"kind":"bullet","runs":[["通路过弱：胰岛素受体信号缺陷引起 2 型糖尿病，受体功能丧失引起先天性甲状腺功能减退；",false]]},{"kind":"bullet","runs":[["靶向药物针对的正是通路上某一个具体开关：伊马替尼抑制 BCR-ABL 的酪氨酸激酶活性，曲妥珠单抗阻断 HER2 的信号，帕博西尼抑制 CDK4/6。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["质膜与膜蛋白方向性（第 3 章，T2）：受体的跨膜拓扑决定配体结合位点必须朝向细胞外，这是受体能在膜上工作的前提。",false]]},{"kind":"bullet","runs":[["蛋白质分选与膜泡运输（第 6 章，T4）：受体在粗面内质网合成并插入膜，经高尔基体运输到质膜，糖链始终朝向细胞外。",false]]},{"kind":"bullet","runs":[["细胞骨架（第 8 章，T6）：支架蛋白与细胞骨架把通路元件固定在特定区域，决定信号的专一性与空间分布。",false]]},{"kind":"bullet","runs":[["细胞周期（第 13 章，T9）：生长因子经 Ras-MAPK 与 PI3K 通路促进 cyclin D 表达，把胞外信号翻译成细胞分裂。",false]]},{"kind":"bullet","runs":[["细胞分化与肿瘤（第 16 章，T11 与 T13）：信号组合决定细胞命运，通路持续活化或失活是肿瘤发生的基本机制。",false]]}]},{"key":"apply","title":"灵活运用（模拟题）","blocks":[{"kind":"qa","q":"【情境·必做】某患者因剧烈腹泻、严重脱水就诊，粪便呈米泔水样，诊断为霍乱。请解释霍乱毒素引起水样腹泻的分子机制，并说明为什么治疗的关键是补液而不是止泻。","a":"答案：①霍乱弧菌产生的霍乱毒素进入肠道上皮细胞后，使 Gs 蛋白的α亚基发生 ADP-核糖基化，其 GTP 酶活性被抑制，Gs 无法水解 GTP 而持续活化；②持续活化的 Gs 不断激活腺苷酸环化酶，细胞内 cAMP 浓度异常升高，进而激活蛋白激酶 A；③蛋白激酶 A 磷酸化并开放肠上皮细胞顶膜上的 CFTR 氯通道，Cl⁻ 大量分泌到肠腔，Na⁺ 与水随渗透梯度进入肠腔，分泌量远远超过结肠的重吸收能力，于是形成大量水样腹泻；④因此腹泻的本质是分泌亢进，而不是肠蠕动异常，止泻药并不能恢复被毒素持续激活的通路，反而可能延缓毒素与细菌的排出；⑤治疗的关键是及时、足量地补充水与电解质，维持有效循环血量与电解质平衡，防止低血容量休克和低钾血症，同时使用抗生素缩短排菌与病程。","src":"灵活运用 · 情境分析"},{"kind":"qa","q":"【实验设计·必做】请设计实验证明某种激素通过 cAMP-PKA 通路调节靶细胞的糖原分解，并说明如何验证 cAMP 是必要的中间环节。","a":"答案：①加入该激素后测定细胞内 cAMP 含量与糖原磷酸化酶活性，若 cAMP 迅速升高、磷酸化酶随之活化、糖原含量下降，说明该激素的作用与 cAMP 有关；②用膜通透性 cAMP 类似物（如二丁酰 cAMP、8-溴 cAMP）直接处理细胞，若不经激素也能引起同样的糖原分解，说明 cAMP 位于激素与效应酶之间；③用磷酸二酯酶抑制剂（如 IBMX 或茶碱）预处理使 cAMP 不被降解，再加入激素，若反应明显增强，说明 cAMP 的浓度决定反应的强度；④用蛋白激酶 A 抑制剂（如 H89 或 Rp-cAMPS）处理后再给激素，若糖原分解被阻断，说明 PKA 是必需的中间环节；⑤用霍乱毒素或 Gs 的直接激活剂处理，若同样出现 cAMP 升高与糖原分解，说明上游为 Gs 蛋白；⑥把以上结果串起来即可确认通路顺序为：激素—受体—Gs—腺苷酸环化酶—cAMP—PKA—磷酸化酶激酶—糖原磷酸化酶—糖原分解，各步骤均以对照组排除非特异效应。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较·选做】为什么同一种激素作用在不同靶细胞上会产生不同的效应？请结合受体、G 蛋白与下游蛋白质说明；并解释信号通路为什么必须能够被关闭。","a":"答案：①受体亚型不同：不同靶细胞表达不同的受体亚型（如 β₁、β₂ 与 α 受体），它们与同一激素的亲和力不同，偶联的 G 蛋白也不同；②偶联的 G 蛋白与效应器酶不同：与 Gs 偶联使 cAMP 升高，与 Gi 偶联使 cAMP 降低，与 Gq 偶联则生成 IP₃ 与 DAG，激活的是完全不同的下游通路；③下游蛋白质谱不同：心肌细胞富含受 cAMP-PKA 调控的钙通道与收缩蛋白，肝细胞富含糖原代谢酶，血管平滑肌以钙调蛋白依赖的舒张机制为主，因此同一个第二信使在不同细胞里改变的反应各不相同；④激素只负责发布指令，具体执行由靶细胞自身的蛋白质组成决定，这正是激素作用具有靶细胞专一性的原因。信号必须能被关闭，因为细胞需要分辨信号的先后与强弱：通路若长期处于活化状态，细胞就失去时间分辨能力，表现为功能紊乱或异常增殖，霍乱毒素使 Gs 持续活化、Ras 的持续活化突变都是典型例证。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["简述细胞表面受体的三种类型，并说明各自典型的信号传递方式。",false]]},{"kind":"num","runs":[["G 蛋白为什么被称为分子开关？GTP 与 GDP 的交换在信号转导中有什么意义？",false]]},{"kind":"num","runs":[["cAMP 是如何产生的，又是如何被清除的？蛋白激酶 A 在其中起什么作用？",false]]},{"kind":"num","runs":[["为什么受体酪氨酸激酶通路特别适合调控细胞的增殖与分化？",false]]}]}]},{"n":"T9","special":true,"title":"原理八：细胞周期的油门与刹车——细胞凭什么知道该分裂了","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["细胞周期各时相的事件为什么必须严格按顺序发生？这个顺序由什么保证？",false]]},{"kind":"bullet","runs":[["细胞凭什么知道 DNA 复制完了没有、染色体是否都接上了纺锤丝？",false]]},{"kind":"bullet","runs":[["为什么一个蛋白质被降解，细胞就再也没有回头路？",false]]},{"kind":"bullet","runs":[["生长因子待在细胞外面，它如何推动细胞越过限制点开始复制 DNA？",false]]},{"kind":"bullet","runs":[["癌基因与抑癌基因为什么要成对来看？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 13 章 细胞周期：时相划分、限制点、周期时间的测定与同步化、流式细胞术分析。",false]]},{"kind":"bullet","runs":[["第 14 章 细胞增殖调控与癌细胞：cyclin、CDK、CKI、MPF、Rb-E2F、p53、检查点、原癌基因与抑癌基因。",false]]},{"kind":"bullet","runs":[["交叉：第 11 章（生长因子通路）、第 7 章与第 9 章（DNA 复制、核膜解体）、第 8 章（纺锤体与收缩环）、第 15 章（凋亡）。",false]]},{"kind":"bullet","runs":[["对应主干复习日：Day 22、Day 24、Day 71。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["第一层原理：细胞周期的顺序性，一半靠检查点拦截，一半靠不可逆降解。",true]]},{"kind":"p","runs":[["细胞周期划分为 G1、S、G2、M 四个时相，事件的先后不能颠倒：DNA 必须在进入 M 期前复制完成，而且只能复制一次；染色体必须正确连接在纺锤体上才能分离。顺序性由两种机制保证：一是检查点发出抑制信号，阻止下一步骤开始；二是把已完成步骤的关键调控蛋白不可逆地降解掉，使细胞只能单向前进。",false]]},{"kind":"p","runs":[["第二层原理：cyclin-CDK 复合物是细胞周期的发动机。",true]]},{"kind":"p","runs":[["CDK 是催化亚基，在细胞中浓度相对恒定；cyclin 是调节亚基，在周期中周期性合成与降解；只有两者结合，CDK 才具有蛋白激酶活性。cyclin 的周期性变化就是细胞周期的时钟：G1 期 cyclin D 与 CDK4/6 结合，为 DNA 复制做准备；G1/S 交界处 cyclin E-CDK2 推动细胞越过限制点进入 S 期；S 期 cyclin A-CDK2 维持复制进行；M 期 cyclin B-CDK1 组成成熟促进因子，触发核膜解体、染色体凝集与纺锤体组装。",false]]},{"kind":"p","runs":[["第三层原理：MPF 的活化是磷酸化与去磷酸化的双保险。",true]]},{"kind":"p","runs":[["cyclin B-CDK1 只有在 CDK1 的 Thr161 被磷酸化（由 CDK 活化激酶完成），同时 Thr14 与 Tyr15 上的抑制性磷酸被 Cdc25 磷酸酶去除之后才有活性；Weel 激酶则把抑制性磷酸加到 Tyr15 上使其失活。因此 MPF 的活化是一个开关而不是渐变，Cdc25 被激活后进一步激活更多 Cdc25 的正反馈使细胞在极短时间内整体进入 M 期。",false]]},{"kind":"p","runs":[["第四层原理：刹车系统由 CKI、Rb 与 p53 组成。",true]]},{"kind":"p","runs":[["CKI 直接抑制 cyclin-CDK：p21 与 p27 抑制作用广谱，p16 特异抑制 CDK4/6。Rb 蛋白在低磷酸化状态下结合 E2F 转录因子，抑制 S 期基因的转录；cyclin D-CDK4/6 把 Rb 磷酸化后释放 E2F，DNA 复制所需的基因才被打开。p53 是基因组的守卫：DNA 损伤时 p53 被稳定，作为转录因子诱导 p21 使细胞停滞在 G1 期以便修复，损伤过重时则启动凋亡。",false]]},{"kind":"p","runs":[["第五层原理：检查点不产生动力，只发放通行的许可。",true]]},{"kind":"p","runs":[["G1/S 检查点监控 DNA 是否完整、营养与生长条件是否具备；G2/M 检查点确认 DNA 复制完成且没有损伤；纺锤体组装检查点监控每一条染色体的动粒是否被来自两极的纺锤丝双向连接并产生适当张力。未连接的动粒会激活 Mad 与 Bub 等蛋白，抑制 APC/C，细胞因而停在中期货期，直到全部染色体连接正确才放行。检查点相当于质量检验站，它本身不推动周期前进，只决定是否通行。",false]]},{"kind":"p","runs":[["第六层原理：泛素化降解使周期单向推进。",true]]},{"kind":"p","runs":[["SCF 与 APC/C 是两类泛素连接酶：SCF 在 G1/S 过渡期降解 p27 等抑制因子，APC/C 在中期向后期的过渡中降解 securin 与 cyclin B。securin 被降解后分离酶被释放，切割连接姐妹染色单体的黏连蛋白，染色体才能分开；cyclin B 被降解则使 MPF 失活，细胞退出分裂期。因为关键蛋白已经被销毁，细胞不可能回到前一个时相，这就是不可逆性的分子基础。",false]]},{"kind":"p","runs":[["第七层原理：周期的油门来自胞外信号，刹车来自细胞自身的状态监测。",true]]},{"kind":"p","runs":[["生长因子通过 Ras-MAPK 与 PI3K 通路促进 cyclin D 表达，是外部油门；Rb-E2F、p53-p21 与 CKI 是内部刹车；接触抑制与锚定依赖保证细胞只在合适的位置、合适的密度下分裂，这是多细胞生物调控增殖的基本方式，也是正常细胞与肿瘤细胞的重要差别。",false]]},{"kind":"p","runs":[["第八层原理：研究细胞周期必须能测定时相并使细胞同步。",true]]},{"kind":"p","runs":[["DNA 含量测定：用碘化丙啶染色后做流式细胞术分析，G1 期细胞为 2C，S 期介于 2C 与 4C 之间，G2 与 M 期为 4C；S 期细胞还可用 BrdU 或 EdU 掺入标记。同步化：TdR 双阻断把细胞积累在 G1/S 边界，诺考达唑使微管解聚把细胞阻滞在 M 期，血清饥饿使细胞进入 G0/G1；撤除阻断剂后细胞同步进入下一个时相，这是研究周期事件的常用手段。",false]]},{"kind":"p","runs":[["第九层原理：失控只有两种方式——油门卡住与刹车失效。",true]]},{"kind":"p","runs":[["原癌基因编码促进增殖的蛋白（Ras、Myc、cyclin D、CDK4），激活突变以后以显性方式获得功能；抑癌基因编码抑制增殖、修复损伤或促进凋亡的蛋白（Rb、p53、p16、APC、BRCA1），通常需要两个等位基因都失活才表现为功能缺失，属隐性。多数肿瘤同时存在两类改变：cyclin D 扩增、CDK4 突变或 p16 沉默使 Rb 通路过度磷酸化，p53 失活使受损的细胞不能被清除，再叠加上端粒酶活化与凋亡逃逸，细胞便获得无限增殖能力。",false]]},{"kind":"p","runs":[["第十层原理：周期机器是抗肿瘤药物的重要靶点。",true]]},{"kind":"p","runs":[["紫杉醇稳定微管使其不能解聚、长春新碱抑制微管聚合、诺考达唑使微管解聚，都会破坏纺锤体的形成，使纺锤体组装检查点持续激活，细胞阻滞在 M 期后发生凋亡；CDK4/6 抑制剂帕博西尼用于激素受体阳性的乳腺癌，原理是阻断 Rb 的磷酸化，把细胞挡在 G1 期。这两类药物作用于周期的不同环节，临床上也据此设计联合方案。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["信号转导（T8）：生长因子—受体酪氨酸激酶—Ras-MAPK—cyclin D，是胞外信号进入细胞周期的接口。",false]]},{"kind":"bullet","runs":[["细胞核与染色质（T7）：S 期完成 DNA 复制与组蛋白合成，MPF 磷酸化核纤层蛋白引起核膜解体。",false]]},{"kind":"bullet","runs":[["细胞骨架（T6）：纺锤体与动粒构成检查点的监控对象，胞质分裂的收缩环由肌动蛋白与肌球蛋白组成。",false]]},{"kind":"bullet","runs":[["细胞死亡与衰老（T10）：p53 决定细胞是停滞修复、进入衰老还是凋亡，检查点与凋亡共同构成基因组防线。",false]]},{"kind":"bullet","runs":[["肿瘤与靶向治疗（T13）：cyclin D 扩增、CDK4/6 抑制剂、微管类药物与抗耐药策略。",false]]}]},{"key":"apply","title":"灵活运用（模拟题）","blocks":[{"kind":"qa","q":"【情境·必做】研究者在肿瘤细胞中加入一种新化合物，细胞群体的 DNA 含量测定显示 G1 期比例明显升高、S 期比例下降，同时 Rb 蛋白磷酸化水平降低。请判断该化合物最可能的作用靶点，并说明它与紫杉醇在作用机制与流式结果上的区别。","a":"答案：①G1 期细胞比例升高、S 期比例下降，说明细胞被阻滞在越过限制点之前，DNA 复制不能启动；②Rb 蛋白磷酸化水平降低，说明磷酸化 Rb 的激酶活性被抑制，最可能的靶点是 CDK4/6，也可能通过降低 cyclin D 表达或升高 CKI 实现；③Rb 处于低磷酸化状态时结合并抑制 E2F，S 期基因不能转录，细胞无法进入 S 期；④紫杉醇的作用靶点是微管，它稳定微管使纺锤体不能正常解聚，纺锤体组装检查点持续激活，细胞阻滞在 M 期而不是 G1 期；⑤在流式细胞术结果上二者明显不同：本化合物使细胞累积在 2C 的 G1 期，紫杉醇使细胞累积在 4C 的 G2/M 期，可用碘化丙啶染色结合磷酸化组蛋白 H3 标记进一步确认；⑥临床上帕博西尼是 CDK4/6 抑制剂，与紫杉醇分属不同作用环节，可在不同治疗阶段使用。","src":"灵活运用 · 情境分析"},{"kind":"qa","q":"【实验设计·必做】请设计实验判断一种化合物是否通过干扰纺锤体组装把细胞阻滞在 M 期，并说明如何把 M 期阻滞与 G2 期阻滞区分开。","a":"答案：①取对数生长期的细胞分为对照组与处理组，处理一定时间后用碘化丙啶染色、流式细胞术测定 DNA 含量，若 4C 细胞比例显著升高，说明细胞阻滞在 G2 期或 M 期；②做形态与免疫荧光检查区分二者：M 期细胞核膜已解体、染色体高度凝集、可见纺锤体与动粒，G2 期细胞核膜完整、染色质未凝集；用 DAPI 标记染色质、抗 α-微管蛋白抗体标记微管、抗磷酸化组蛋白 H3 抗体标记 M 期染色质，即可判断细胞所处的时相；③直接观察微管状态：若处理组微管解聚、或异常稳定、纺锤体不能形成双极结构，说明作用靶点在微管；④检测纺锤体组装检查点是否激活：免疫荧光观察 Mad2 或 BubR1 是否滞留在动粒上，免疫印迹检测 cyclin B 与 securin 是否稳定不降解，若检查点持续激活则支持 M 期阻滞；⑤撤除药物后继续培养并观察：若阻滞细胞恢复分裂但出现多核或非整倍体，说明药物只影响纺锤体功能而没有损伤 DNA；⑥结论需同时满足阻滞时相、微管形态与检查点激活三项证据，并用已知药物（如诺考达唑）作阳性对照。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较·选做】比较原癌基因与抑癌基因在遗传方式、作用性质、典型突变类型与代表基因上的差别，并说明为什么 p53 被称为基因组的守卫。","a":"答案：①遗传方式：原癌基因的激活突变是显性的，一个等位基因改变即可获得功能；抑癌基因的失活突变是隐性的，通常需要两个等位基因都失活才表现出功能缺失。②作用性质：原癌基因编码促进增殖的信号分子，突变后功能增强或不再受调控；抑癌基因编码抑制增殖、修复损伤或促进凋亡的蛋白，突变后功能丧失。③典型突变类型：原癌基因以点突变、基因扩增与染色体易位为主，如 Ras 点突变、cyclin D 与 MYC 扩增、BCR-ABL 易位；抑癌基因以缺失、点突变与启动子甲基化沉默为主，如 Rb 缺失、p16 甲基化沉默、p53 点突变。④p53 被称为基因组的守卫，是因为在 DNA 损伤、癌基因异常激活或端粒过度缩短时，p53 被稳定并作为转录因子诱导 p21 使细胞停滞在 G1 期以便修复，修复失败时则诱导 Bax 等促凋亡基因使细胞凋亡，从而阻止损伤细胞继续分裂并积累突变；⑤超过半数的人类肿瘤存在 p53 突变，缺失 p53 的细胞对 DNA 损伤药物与放疗的敏感性下降，这也解释了 p53 突变肿瘤治疗难度更大的原因。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["细胞周期的顺序性由哪些机制保证？为什么说泛素化降解使周期不可逆？",false]]},{"kind":"num","runs":[["成熟促进因子由什么组成？它被如何激活，又触发哪些 M 期事件？",false]]},{"kind":"num","runs":[["纺锤体组装检查点如何工作？它失效会导致什么后果？",false]]},{"kind":"num","runs":[["原癌基因与抑癌基因在遗传方式和作用性质上有什么不同？各举两例。",false]]}]}]},{"n":"T10","special":true,"title":"原理九：细胞死亡与衰老——主动了断与时间的代价","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["细胞为什么会主动自杀？凋亡与坏死在机制和后果上有什么区别？",false]]},{"kind":"bullet","runs":[["线粒体为什么既是能量工厂，又是死亡的开关？",false]]},{"kind":"bullet","runs":[["凋亡为什么不引起炎症？“不留痕迹”靠什么实现？",false]]},{"kind":"bullet","runs":[["自噬是在自救还是在自杀？",false]]},{"kind":"bullet","runs":[["衰老是基因写好的程序，还是损伤累积的结果？端粒为什么能当计时器？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 15 章 细胞死亡与细胞衰老：凋亡的形态与生化特征、Caspase 级联、死亡受体途径与线粒体途径、Bcl-2 家族、自噬及其调控、Hayflick 界限、端粒与端粒酶、衰老相关分泌表型。",false]]},{"kind":"bullet","runs":[["交叉：第 5 章（溶酶体）、第 8 章（细胞骨架在凋亡中的变化）、第 12 章（免疫细胞的杀伤机制）、第 14 章（p53 与凋亡）。",false]]},{"kind":"bullet","runs":[["对应主干复习日：Day 27、Day 71。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["第一层原理：凋亡是程序化、被精确切割的死亡。",true]]},{"kind":"p","runs":[["凋亡的形态特征是细胞皱缩、染色质凝集并边缘化、核碎裂、形成凋亡小体，质膜始终保持完整，随后被巨噬细胞或邻近细胞识别并吞噬，细胞内容物不外泄，所以不引起炎症。生化特征是 DNA 被剪切成 180～200 bp 整数倍的片段，电泳呈梯状条带；凋亡早期磷脂酰丝氨酸从膜内侧翻到外侧，成为被吞噬细胞识别的信号；Caspase 家族被顺序激活。",false]]},{"kind":"p","runs":[["第二层原理：死亡由 Caspase 级联执行。",true]]},{"kind":"p","runs":[["Caspase 以无活性的酶原形式存在，被切割后形成活性异二聚体。启动型 Caspase（8、9、10）负责接收死亡信号，执行型 Caspase（3、6、7）负责切割底物：切割核纤层蛋白使核膜解体，切割 ICAD 释放 CAD 使 DNA 断裂成梯状条带，还切割多聚 ADP 核糖聚合酶等维持细胞结构的蛋白。级联反应层层放大，因此很少的初始信号就足以完成死亡。",false]]},{"kind":"p","runs":[["第三层原理：外源途径由死亡受体接收命令。",true]]},{"kind":"p","runs":[["FasL 或肿瘤坏死因子与死亡受体结合后受体三聚化，通过死亡结构域招募接头蛋白 FADD，FADD 聚集 pro-caspase-8 形成死亡诱导信号复合物，pro-caspase-8 自我激活，再激活执行型 Caspase。细胞毒性 T 细胞杀伤靶细胞、免疫系统清除自身反应性淋巴细胞都依赖这条途径。",false]]},{"kind":"p","runs":[["第四层原理：内源途径以线粒体为决策中心。",true]]},{"kind":"p","runs":[["Bcl-2 家族的促凋亡成员 Bax 与 Bak 被 BH3-only 蛋白（Bad、Bid、Puma、Noxa）激活后，在线粒体外膜形成孔道，细胞色素 c 释放到胞质，与 Apaf-1 结合形成凋亡体，募集并激活 caspase-9；抗凋亡成员 Bcl-2、Bcl-xL 则抑制这一过程。细胞色素 c 一旦进入胞质，细胞就已跨过死亡点，因此线粒体是凋亡的决策中心。此外，凋亡抑制蛋白抑制已激活的 Caspase，而线粒体释放的 Smac/DIABLO 能拮抗凋亡抑制蛋白。两条途径可以沟通：caspase-8 切割 Bid 生成 tBid，把外源信号放大到线粒体途径。",false]]},{"kind":"p","runs":[["第五层原理：凋亡的“度”决定疾病的方向。",true]]},{"kind":"p","runs":[["凋亡不足会导致肿瘤与自身免疫病；凋亡过度则引起神经退行性疾病与心肌损伤。胚胎发育中手指与趾间蹼的消失、免疫应答结束时效应细胞的清除，都是凋亡的正常生理功能。这说明细胞社会的秩序需要死亡，死亡与增殖、分化一样是受调控的主动过程。",false]]},{"kind":"p","runs":[["第六层原理：自噬是回收利用与质量控制。",true]]},{"kind":"p","runs":[["自噬是细胞形成双层膜自噬体，包裹受损细胞器或长寿命蛋白，再与溶酶体融合降解的过程。营养缺乏时 mTORC1 被抑制、AMPK 被激活，启动 ULK1 复合物，ATG 蛋白介导 LC3 脂化（LC3-I 转变为 LC3-II）并参与自噬体形成；降解产物（氨基酸、脂肪酸）返回胞质，提供能量与合成原料。选择性自噬可清除受损线粒体与蛋白聚集体，是细胞的生存机制而不是自杀机制。",false]]},{"kind":"p","runs":[["第七层原理：不同类型的细胞死亡可以互相转换。",true]]},{"kind":"p","runs":[["当 Caspase 被抑制或 ATP 耗竭时，同一刺激可以转向坏死性凋亡（RIPK1-RIPK3-MLKL 通路，膜穿孔并释放损伤相关分子模式，引起炎症）或焦亡（炎症小体激活 caspase-1，切割 GSDMD 形成膜孔并释放白介素 1β）。这两种死亡方式都会引起强烈炎症反应，是机体对抗感染的手段，也说明死亡方式取决于细胞的分子状态，而不只取决于刺激本身。",false]]},{"kind":"p","runs":[["第八层原理：衰老既受遗传程序约束，也是损伤累积的结果。",true]]},{"kind":"p","runs":[["Hayflick 界限说明正常人体细胞在体外分裂的次数是有限的。复制性衰老由端粒缩短引起：DNA 聚合酶无法复制线性 DNA 的最末端，端粒随每次分裂缩短，缩短到临界长度时被识别为 DNA 损伤，激活 p53-p21 通路，细胞进入不可逆的停滞状态。端粒酶可以延长端粒，在生殖细胞与干细胞中保持活性，在约 90% 的肿瘤细胞中被重新激活，使肿瘤细胞突破 Hayflick 界限获得无限增殖能力。除复制性衰老外，氧化应激、癌基因激活与 DNA 损伤药物还会引起应激诱导的早熟衰老。",false]]},{"kind":"p","runs":[["第九层原理：衰老细胞通过分泌改变周围环境。",true]]},{"kind":"p","runs":[["衰老细胞体积增大、形态扁平，β-半乳糖苷酶染色阳性，p16 与 p21 表达升高，出现衰老相关异染色质灶，并持续分泌白介素 6、白介素 8、基质金属蛋白酶等因子，即衰老相关分泌表型。这使衰老从单个细胞的状态变成影响组织微环境的炎症性因素，与老年性疾病以及肿瘤的发生发展相关，清除衰老细胞的药物是相关疾病研究的方向之一。",false]]},{"kind":"p","runs":[["第十层原理：死亡与衰老的研究直接对应临床药物。",true]]},{"kind":"p","runs":[["Bcl-2 过量表达（如滤泡性淋巴瘤中的 t(14;18) 易位）使肿瘤细胞抵抗凋亡，Bcl-2 抑制剂维奈托克能重新启动凋亡；多数化疗药物的细胞毒作用通过线粒体内源途径诱导凋亡，大量肿瘤细胞同步死亡后细胞内含物释放入血，就是肿瘤溶解综合征；自噬抑制剂与化疗、放疗联合则是针对肿瘤细胞保护性自噬的策略。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["质膜与内膜系统（T2、T4）：磷脂酰丝氨酸外翻成为吞噬信号，凋亡小体被吞噬后由溶酶体降解，溶酶体也是自噬的终点。",false]]},{"kind":"bullet","runs":[["线粒体（T5）：细胞色素 c 的释放与 Bcl-2 家族的调控，把能量转换细胞器变成死亡开关。",false]]},{"kind":"bullet","runs":[["细胞周期（T9）：p53 在损伤后决定细胞停滞、衰老还是凋亡，检查点与死亡通路共同守护基因组的稳定。",false]]},{"kind":"bullet","runs":[["免疫（T12）：细胞毒性 T 细胞通过 Fas-FasL 系统与颗粒酶诱导靶细胞凋亡，凋亡缺陷会导致自身免疫病。",false]]},{"kind":"bullet","runs":[["肿瘤（T13）：逃逸凋亡是肿瘤的重要特征，维奈托克与自噬相关药物是靶向策略的实例。",false]]}]},{"key":"apply","title":"灵活运用（模拟题）","blocks":[{"kind":"qa","q":"【情境·必做】一位滤泡性淋巴瘤患者的肿瘤细胞中存在 t(14;18) 易位，导致 Bcl-2 蛋白过量表达。请解释这种改变为什么有利于肿瘤发生，以及 Bcl-2 抑制剂维奈托克为什么能诱导肿瘤细胞死亡。","a":"答案：①t(14;18) 易位把 BCL2 基因置于免疫球蛋白重链基因的强启动子控制之下，使 Bcl-2 蛋白持续过量表达；②Bcl-2 是抗凋亡蛋白，它结合并抑制 Bax 与 Bak，阻止线粒体外膜形成孔道，细胞色素 c 不能释放，caspase-9 无法被激活，因此肿瘤细胞即使携带损伤也能逃避凋亡，存活时间延长并不断积累突变；③维奈托克是 Bcl-2 的选择性抑制剂，它与 Bcl-2 的疏水沟结合，把 Bax 与 Bak 从抑制状态释放出来，线粒体途径重新启动，caspase-9 与 caspase-3 被激活，肿瘤细胞发生凋亡；④用药后大量肿瘤细胞同步死亡，细胞内含物短时间内释放入血，可引起肿瘤溶解综合征，表现为高钾、高磷、高尿酸与低钙，因此治疗时需要充分水化并监测电解质与尿酸，这也是凋亡效应在临床上可以直接观察到的后果。","src":"灵活运用 · 情境分析"},{"kind":"qa","q":"【实验设计·必做】请设计实验区分细胞的死亡方式以凋亡为主还是以坏死为主，并说明每种方法所依据的原理。","a":"答案：①形态学方法：用透射电镜观察，凋亡细胞染色质凝集边缘化、细胞皱缩、形成凋亡小体且质膜完整，坏死细胞肿胀、细胞器崩解、质膜破裂、内容物外泄；②生化方法：提取 DNA 做琼脂糖凝胶电泳，凋亡出现 180～200 bp 整数倍的梯状条带，坏死表现为弥漫拖尾的条带；③流式细胞术：用 Annexin V 与碘化丙啶双染，凋亡早期为 Annexin V 阳性、碘化丙啶阴性（磷脂酰丝氨酸外翻而膜完整），凋亡晚期为双阳性，坏死以碘化丙啶阳性为主；④Caspase 活性检测：用荧光底物或免疫印迹检测 caspase-3 与 caspase-9 的活化片段，凋亡细胞显著升高，坏死细胞不依赖 Caspase；⑤功能判据：加入广谱 Caspase 抑制剂 z-VAD-fmk，若死亡被阻断说明是凋亡，若死亡不被阻断甚至转为坏死性凋亡，说明细胞走上了备用死亡通路；⑥综合三类以上证据才能判断死亡方式，同时应设置正常对照与阳性对照（如地塞米松诱导凋亡、冻融诱导坏死）。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较·选做】比较凋亡与自噬在形态、分子机制与生理意义上的差别，并解释为什么自噬在肿瘤中既可能抑制肿瘤也可能促进肿瘤。","a":"答案：①形态差别：凋亡表现为细胞皱缩、染色质凝集、核碎裂与凋亡小体形成，自噬表现为胞质中出现大量双层膜自噬体，细胞成分被逐步降解而质膜保持完整；②分子机制差别：凋亡由 Caspase 级联执行，外源途径经死亡受体与 caspase-8，内源途径经线粒体释放细胞色素 c 与 caspase-9；自噬由 ULK1 复合物与 ATG 蛋白介导，LC3 脂化为 LC3-II 是自噬体形成的标志，mTORC1 抑制与 AMPK 激活促进自噬；③生理意义差别：凋亡负责清除多余、受损和危险的细胞，是细胞社会的清退机制；自噬负责回收细胞成分、提供应急营养、清除受损细胞器与蛋白聚集体，是细胞的生存机制；④自噬在肿瘤的早期起抑制作用：它清除受损细胞器与活性氧、维持基因组稳定、抑制慢性炎症，自噬相关基因缺失的小鼠更易发生肿瘤；⑤在已形成的肿瘤中自噬起促进作用：肿瘤内部缺血缺氧时自噬为肿瘤细胞提供营养与能量，并帮助其耐受化疗与放疗；⑥因此自噬的作用具有阶段依赖性，临床上需根据肿瘤所处阶段选择自噬抑制剂或激活剂，这也是自噬相关药物研发的难点。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["凋亡在形态学和生物化学上有哪些标志性特征？为什么凋亡不引起炎症？",false]]},{"kind":"num","runs":[["凋亡的内源途径与外源途径分别由什么触发？两条途径在哪里交汇？",false]]},{"kind":"num","runs":[["自噬体是如何形成的？mTOR 与 AMPK 在其中起什么作用？",false]]},{"kind":"num","runs":[["端粒为什么会随分裂而缩短？端粒酶与细胞衰老、肿瘤各是什么关系？",false]]}]}]},{"n":"T11","special":true,"title":"原理十：从同一基因组到不同细胞——分化、干细胞与表观遗传","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["同一个基因组为什么能产生几百种形态功能完全不同的细胞？",false]]},{"kind":"bullet","runs":[["分化是基因丢失的结果吗？用什么实验可以推翻这一说法？",false]]},{"kind":"bullet","runs":[["少数几个转录因子为什么就能决定一个细胞的命运？",false]]},{"kind":"bullet","runs":[["表观遗传修饰为什么能稳定地传给子细胞，却不改变碱基序列？",false]]},{"kind":"bullet","runs":[["干细胞的“干”体现在哪里？诱导多能干细胞为什么是里程碑？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 16 章 细胞分化与干细胞：基因组等同性、差别基因表达、管家基因与组织特异性基因、组合调控、决定因子、干细胞类型、壁龛与不对称分裂、诱导多能干细胞、细胞重编程。",false]]},{"kind":"bullet","runs":[["相关章节：第 9 章（染色质与基因表达调控）、第 12 章（发育与形态发生中的细胞行为）、第 15 章（干细胞衰老）。",false]]},{"kind":"bullet","runs":[["对应主干复习日：Day 25、Day 39、Day 43、Day 44。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["第一层原理：分化不是基因的得失，而是基因的选择性表达。",true]]},{"kind":"p","runs":[["基因组等同性由三类实验证明：爪蟾蝌蚪肠上皮细胞的核移植可以发育成完整个体；哺乳动物体细胞核移植得到多莉羊；植物单个已分化的体细胞经组织培养可以长成完整植株。这些结果说明已分化细胞的核中仍然保留完整的基因组，分化只是不同基因被开启或关闭。这一结论是克隆技术、细胞重编程与再生医学的共同基础。",false]]},{"kind":"p","runs":[["第二层原理：差别基因表达由顺式元件与反式因子的组合决定。",true]]},{"kind":"p","runs":[["管家基因在所有细胞中都表达，负责维持基本生命活动；组织特异性基因只在特定细胞中表达，编码该细胞的特征性蛋白，如红细胞的血红蛋白、胰岛 B 细胞的胰岛素、肌细胞的肌动蛋白与肌球蛋白。一个基因是否表达，取决于启动子与增强子上的顺式元件和细胞中实际存在的转录因子组合之间的相互作用。",false]]},{"kind":"p","runs":[["第三层原理：少数转录因子可以启动整个分化程序，即组合调控。",true]]},{"kind":"p","runs":[["把 MyoD 导入成纤维细胞即可使其转变为肌细胞，说明存在决定分化方向的“主控基因”或决定因子。细胞命运由少数关键转录因子的特定组合决定，这一原理既是发育生物学解释细胞决定的核心，也是诱导分化与细胞重编程技术的理论基础：改变几个关键因子的组合，就能改变整个基因表达网络的状态。",false]]},{"kind":"p","runs":[["第四层原理：表观遗传把表达状态变成可遗传的细胞记忆。",true]]},{"kind":"p","runs":[["DNA 甲基化（CpG 位点上的 5-甲基胞嘧啶）通常抑制转录；组蛋白乙酰化使染色质松散、促进转录，H3K9 与 H3K27 的三甲基化与基因沉默相关；染色质重塑复合物改变核小体的位置与组成；非编码 RNA 参与基因沉默。正因为有这些修饰，细胞分裂产生的子细胞才能记住自己是谁，而不必重新经历一次发育过程，这就是细胞记忆的分子基础。",false]]},{"kind":"p","runs":[["第五层原理：X 失活与基因组印记说明表观修饰可以决定等位基因的表达。",true]]},{"kind":"p","runs":[["雌性哺乳动物两条 X 染色体中的一条被随机失活，由 Xist 长链非编码 RNA 覆盖该染色体并招募沉默复合物完成，形成巴氏小体，使 X 染色体基因的表达剂量与雄性相当。基因组印记则使某些基因只表达来自父方或母方的等位基因，如 Igf2 与 H19 的表达差异，这种亲本来源特异的表达状态同样由甲基化维持，印记异常会导致 Prader-Willi 综合征与 Angelman 综合征。",false]]},{"kind":"p","runs":[["第六层原理：干细胞的两个标志是自我更新与多向分化潜能。",true]]},{"kind":"p","runs":[["按潜能大小可分为：全能干细胞（受精卵与早期卵裂球，能形成完整个体及胎盘等胚外组织）、多能干细胞（胚胎干细胞与诱导多能干细胞，能形成三个胚层的各种细胞但不能形成完整个体）、单能或寡能干细胞（造血干细胞、肠干细胞等组织前体细胞）。干细胞所在的组织微环境称为壁龛，壁龛信号与细胞自身的状态共同决定干细胞是自我更新还是走向分化。",false]]},{"kind":"p","runs":[["第七层原理：不对称分裂与对称分裂的取舍决定组织的规模。",true]]},{"kind":"p","runs":[["干细胞通过不对称分裂产生一个干细胞和一个祖细胞，既维持干细胞数量稳定，又持续补充分化细胞；当组织需要扩大干细胞池时则进行对称分裂。肠隐窝底部的 Lgr5 阳性干细胞与骨髓造血干细胞是研究这一原理的经典模型，它们的分裂方式受壁龛信号与周围细胞反馈的调控。",false]]},{"kind":"p","runs":[["第八层原理：诱导多能干细胞证明分化是可逆的。",true]]},{"kind":"p","runs":[["导入 Oct4、Sox2、Klf4 与 c-Myc 四个因子（山中因子）可以把小鼠成纤维细胞重编程为多能干细胞，说明已经关闭的基因可以被重新打开，限制细胞命运的不是基因序列本身，而是表观遗传状态。由于重编程避开了使用胚胎的伦理障碍，诱导多能干细胞成为疾病建模、药物筛选与细胞治疗的平台，也是理解细胞命运决定机制的重要工具。",false]]},{"kind":"p","runs":[["第九层原理：分化程序可以在体外借助自组织能力重建。",true]]},{"kind":"p","runs":[["干细胞在三维基质中培养时，可以在没有外部模板的条件下自组织形成具有器官特征的类器官，如肠类器官、肝类器官与脑类器官。类器官不仅用于发育研究和疾病建模，也是药物筛选与个体化治疗的平台，同时说明分化是一个由细胞黏附、信号梯度与基因调控网络共同驱动的自组织过程。",false]]},{"kind":"p","runs":[["第十层原理：分化异常是疾病的重要机制，也是治疗的机会。",true]]},{"kind":"p","runs":[["肿瘤可以被理解为分化受阻或去分化的结果。急性早幼粒细胞白血病由 t(15;17) 易位产生的 PML-RARα 融合蛋白引起，该蛋白持续抑制粒细胞分化所需的基因，使细胞停在早幼粒细胞阶段；全反式维甲酸与三氧化二砷能促进融合蛋白降解、恢复分化程序，使患者获得缓解。这说明治疗不一定要杀死细胞，也可以纠正它的命运决定程序。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["细胞核与染色质（T7）：染色质的压缩状态决定基因的可及性，表观遗传修饰改变的正是这一状态。",false]]},{"kind":"bullet","runs":[["信号转导（T8）：胞外信号最终改变转录因子的活性与组合，这是分化指令的传递路线。",false]]},{"kind":"bullet","runs":[["细胞周期（T9）：终末分化的细胞退出细胞周期进入 G0 期，细胞必须在增殖与分化之间作出取舍。",false]]},{"kind":"bullet","runs":[["死亡与衰老（T10）：干细胞依赖端粒酶维持自我更新，成体干细胞的数目与功能随年龄下降。",false]]},{"kind":"bullet","runs":[["肿瘤（T13）：去分化与分化受阻是肿瘤的重要特征，分化诱导治疗与细胞治疗是应用出口。",false]]}]},{"key":"apply","title":"灵活运用（模拟题）","blocks":[{"kind":"qa","q":"【情境·必做】一位急性早幼粒细胞白血病患者使用全反式维甲酸治疗后，骨髓中异常的早幼粒细胞逐渐成熟为粒细胞，病情获得缓解。请解释该治疗的分子机制，并说明它与传统化疗在治疗思路上的区别。","a":"答案：①该病的分子基础是 t(15;17) 易位形成的 PML-RARα 融合蛋白；RARα 是维甲酸受体，融合蛋白在生理浓度的维甲酸下仍持续结合靶基因的启动子，并招募共抑制物与组蛋白去乙酰化酶，使粒细胞分化所需的基因被关闭，细胞停滞在早幼粒细胞阶段并持续增殖；②全反式维甲酸以药理浓度与 PML-RARα 结合，使共抑制物解离、共激活物与组蛋白乙酰转移酶被招募，靶基因重新开放，同时促进融合蛋白降解，早幼粒细胞恢复正常的成熟程序，最终成为有功能的粒细胞；③因此该治疗不是杀死肿瘤细胞，而是纠正表观遗传异常、恢复分化程序，属于分化诱导治疗；④与传统化疗的区别在于：细胞毒药物主要杀伤快速分裂的细胞，对骨髓等正常增殖组织也有损伤，容易引起骨髓抑制，且肿瘤细胞可通过凋亡逃逸与耐药突变存活；分化诱导治疗利用细胞自身的分化潜能，不引起严重骨髓抑制，主要不良反应是分化综合征，即大量细胞同时成熟引起的发热、水肿与呼吸困难，需要及时处理，与化疗联合可以显著提高缓解率。","src":"灵活运用 · 情境分析"},{"kind":"qa","q":"【实验设计·必做】请设计实验证明诱导多能干细胞确实具有多能性，而不是普通体细胞或部分重编程的中间状态。","a":"答案：①形态与标志物检测：观察细胞是否形成边界清晰的紧密克隆，用免疫荧光或流式细胞术检测多能性标志 Oct4、Sox2、Nanog、SSEA-4 与 TRA-1-60 是否表达；②基因表达与表观遗传检测：用实时定量 PCR 或转录组测序比较其与胚胎干细胞的相似程度，并检测 Oct4 与 Nanog 启动子区域是否已去甲基化，说明内源多能性网络被激活；③体外分化实验：用悬滴法形成拟胚体，或加入定向诱导条件，检测三个胚层的标志基因，外胚层检测 Nestin，中胚层检测 Brachyury 与α-平滑肌肌动蛋白，内胚层检测 Sox17 与 FoxA2；④体内分化实验：把细胞注射到免疫缺陷小鼠皮下，若形成同时含有三个胚层组织的畸胎瘤，即证明其具有多能性；⑤最严格的判据是嵌合体实验：把细胞注入囊胚，若其能参与形成包括生殖细胞在内的各种组织并可遗传给后代，说明具有体内多能性；⑥必须设置对照，包括起始体细胞与真正的胚胎干细胞，避免把部分重编程或自发分化误判为多能性。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较·选做】比较分化、去分化、转分化与重编程的概念差别，并说明这些过程在医学上的意义。","a":"答案：①分化是细胞在形态、结构与功能上产生稳定差异、由幼稚走向成熟的过程，本质是基因的选择性表达，分化后的细胞通常不再具有多向分化潜能，如造血干细胞分化为红细胞；②去分化是已分化的细胞失去原有特征、回到较幼稚状态的过程，是肿瘤发生与组织再生的常见现象，如肝细胞在损伤刺激下重新表达更早期的标志物；③转分化是一种已分化细胞直接转变为另一种已分化细胞，如虹膜色素上皮细胞转变为晶状体纤维细胞；④重编程是通过导入特定因子或使用小分子改变细胞的表观遗传状态，使细胞回到多能状态或改变命运，诱导多能干细胞是最典型的例子；⑤医学意义：转分化与重编程为再生医学提供了自体细胞来源，可用于替代受损的心肌、神经与胰岛细胞，也可用于患者特异的疾病建模与药物筛选；去分化提示肿瘤的发生机制与治疗靶点；分化诱导治疗则把异常的分化程序重新纠正过来，急性早幼粒细胞白血病是成功的临床范例。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["用什么实验可以证明分化不是基因丢失？请举出两个例子并说明其意义。",false]]},{"kind":"num","runs":[["表观遗传修饰主要有哪些类型？它们如何形成细胞的记忆？",false]]},{"kind":"num","runs":[["全能、多能与单能干细胞有什么差别？干细胞壁龛起什么作用？",false]]},{"kind":"num","runs":[["诱导多能干细胞技术的基本原理是什么？它为什么被认为具有里程碑意义？",false]]}]}]},{"n":"T12","special":true,"title":"原理十一：识别与防御——免疫系统如何判定自我与非我","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["免疫系统凭什么区分“自己”和“非己”？识别的分子基础是什么？",false]]},{"kind":"bullet","runs":[["人体为什么能对付从未见过的病原体？抗体与 T 细胞受体的多样性从哪里来？",false]]},{"kind":"bullet","runs":[["先天免疫与适应性免疫怎样衔接？为什么说先天免疫决定了后天应答的强度？",false]]},{"kind":"bullet","runs":[["免疫记忆为什么能维持几十年？疫苗的原理是什么？",false]]},{"kind":"bullet","runs":[["免疫系统“打错人”会发生什么？超敏反应为什么分四型？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 12 章（811 大纲免疫部分）：免疫器官与免疫细胞、抗原与抗体、MHC 与抗原提呈、B 细胞与 T 细胞应答、补体系统、超敏反应四型、自身免疫与免疫缺陷、免疫治疗。",false]]},{"kind":"bullet","runs":[["交叉：第 3 章（膜受体与识别）、第 11 章（信号转导与细胞因子）、第 15 章（细胞毒性 T 细胞诱导凋亡）、第 16 章（免疫细胞的谱系与分化）。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 30、Day 31、Day 32、Day 34、Day 72。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["第一层原理：免疫识别是分子形状的配对，走两条不同的路线。",true]]},{"kind":"p","runs":[["先天免疫用胚系基因直接编码的模式识别受体识别病原相关分子模式，比如脂多糖、肽聚糖、双链 RNA 与细菌 DNA。这些分子是病原体共有的、又不存在于人体细胞上的“通用标志”，因此识别快（数分钟到数小时）、范围广，但没有记忆。适应性免疫用基因重排产生的 B 细胞受体与 T 细胞受体识别特定的抗原表位，特异性高，但初次应答需要 3～7 天，代价换来的是记忆与精准。",false]]},{"kind":"p","runs":[["第二层原理：受体的多样性来自基因重排与随机组合。",true]]},{"kind":"p","runs":[["B 细胞受体的重链与轻链、T 细胞受体的αβ或γδ链，都由 V、D、J 基因片段经重排连接而成，再加上连接处的随机插入与删除、轻重链的随机配对，使受体多样性可达 10⁷～10¹¹ 量级。这意味着在遇到抗原之前，体内已经存在针对各种可能表位的淋巴细胞克隆，抗原的作用是“选择”而不是“教出来”的。多样性带来的风险是可能产生自身反应性克隆，因此免疫系统必须同时建立耐受机制。",false]]},{"kind":"p","runs":[["第三层原理：抗原提呈是把细胞内部的情况摆到表面。",true]]},{"kind":"p","runs":[["MHC Ⅰ 类分子存在于几乎所有有核细胞表面，提呈的是细胞内产生的内源性抗原肽（包括病毒蛋白与肿瘤抗原），被 CD8⁺ 细胞毒性 T 细胞识别，相当于向全身报告“我内部有异常”。MHC Ⅱ 类分子只在专职抗原提呈细胞（树突状细胞、巨噬细胞、B 细胞）上表达，提呈的是被吞噬降解的外源性抗原肽，被 CD4⁺ 辅助 T 细胞识别，相当于报告“外面来了什么”。MHC 基因的高度多态性是人群层面抗感染能力差异的重要来源，也是器官移植配型困难的原因。",false]]},{"kind":"p","runs":[["第四层原理：三类淋巴细胞的识别方式决定它们的分工。",true]]},{"kind":"bullet","runs":[["CD8⁺ 细胞毒性 T 细胞识别 MHC Ⅰ 类分子提呈的抗原肽，通过释放穿孔素与颗粒酶、以及 Fas-FasL 相互作用诱导靶细胞凋亡；",false]]},{"kind":"bullet","runs":[["CD4⁺ 辅助 T 细胞识别 MHC Ⅱ 类分子提呈的抗原肽，活化后分泌白细胞介素 2 等细胞因子，帮助 B 细胞与细胞毒性 T 细胞活化，是整个应答的“指挥部”；",false]]},{"kind":"bullet","runs":[["B 细胞通过 B 细胞受体直接识别天然的、未加工的抗原，在辅助 T 细胞协助下分化为浆细胞分泌抗体；",false]]},{"kind":"bullet","runs":[["自然杀伤细胞不依赖 MHC 提呈，通过识别“缺少 MHC Ⅰ 类分子”的细胞与抗体结合后的 Fc 段来杀伤靶细胞。",false]]},{"kind":"p","runs":[["第五层原理：抗体通过四种方式清除抗原。",true]]},{"kind":"bullet","runs":[["中和：抗体结合病毒表面或毒素的活性位点，阻断其与宿主细胞结合；",false]]},{"kind":"bullet","runs":[["调理：抗体 Fc 段被巨噬细胞与中性粒细胞的 Fc 受体识别，显著提高吞噬效率；",false]]},{"kind":"bullet","runs":[["激活补体：抗体与抗原结合后启动补体经典途径，形成膜攻击复合物直接溶解靶细胞；",false]]},{"kind":"bullet","runs":[["介导抗体依赖性细胞毒作用：自然杀伤细胞通过 Fc 受体识别已被抗体包被的靶细胞并将其杀伤。",false]]},{"kind":"p","runs":[["第六层原理：克隆选择与免疫记忆构成疫苗的原理。",true]]},{"kind":"p","runs":[["抗原选择出预先存在的特异克隆，使其大量扩增并分化为效应细胞与记忆细胞。在淋巴结的生发中心中，B 细胞经历体细胞高频突变与亲和力成熟，抗体类型从 IgM 转换为 IgG、IgA 或 IgE。再次遇到同一抗原时，记忆细胞使应答更快、更强、更持久，这就是二次应答；疫苗正是通过人为制造一次安全的初次应答来获得记忆。免疫记忆的维持依赖长寿浆细胞与记忆淋巴细胞，可以持续数十年。",false]]},{"kind":"p","runs":[["第七层原理：补体是先天免疫与适应性免疫共用的效应系统。",true]]},{"kind":"p","runs":[["补体由三十多种血浆蛋白组成，可通过经典途径（抗体-抗原复合物启动）、旁路途径（病原表面直接启动）与凝集素途径（甘露糖结合凝集素识别病原表面糖基）被激活。三条途径最终都汇聚到 C3 的裂解，生成 C3b（发挥调理作用）与 C3a、C5a（作为过敏毒素与趋化因子招募吞噬细胞），并在膜上组装成膜攻击复合物直接裂解靶细胞。",false]]},{"kind":"p","runs":[["第八层原理：免疫系统必须有刹车，否则会攻击自身。",true]]},{"kind":"p","runs":[["中枢耐受在胸腺中通过阴性选择清除对自身抗原反应强烈的 T 细胞克隆；外周耐受由调节性 T 细胞、缺乏共刺激信号导致的无能以及抑制性受体共同维持。细胞毒性 T 细胞相关蛋白 4 与程序性死亡受体 1 是生理性的免疫刹车：它们防止 T 细胞被持续过度激活。肿瘤会利用这一机制，通过表达程序性死亡配体 1 与 T 细胞的程序性死亡受体 1 结合来抑制 T 细胞；免疫检查点抑制剂正是松开这一刹车来恢复抗肿瘤免疫。",false]]},{"kind":"p","runs":[["第九层原理：超敏反应是免疫应答的过度或错位。",true]]},{"kind":"bullet","runs":[["Ⅰ 型（速发型）：IgE 结合肥大细胞，再次接触抗原后数分钟至 30 分钟内释放组胺等介质，引起过敏性鼻炎、哮喘与过敏性休克；",false]]},{"kind":"bullet","runs":[["Ⅱ 型（细胞毒型）：IgG 或 IgM 直接针对细胞表面抗原，引起输血反应、新生儿溶血病与 Graves 病；",false]]},{"kind":"bullet","runs":[["Ⅲ 型（免疫复合物型）：中等大小可溶性免疫复合物沉积于血管壁与肾小球，激活补体引起炎症，如血清病与链球菌感染后肾小球肾炎；",false]]},{"kind":"bullet","runs":[["Ⅳ 型（迟发型）：由 T 细胞介导，出现较慢（48～72 小时），如结核菌素试验、接触性皮炎与移植排斥反应。",false]]},{"kind":"p","runs":[["第十层原理：免疫失衡的临床出口。",true]]},{"kind":"p","runs":[["免疫缺陷使机体对感染的防御下降：DiGeorge 综合征因胸腺发育不全导致 T 细胞缺陷；重症联合免疫缺陷同时影响 T 细胞与 B 细胞功能，患儿必须生活在无菌环境中。人类免疫缺陷病毒专门感染 CD4⁺ T 细胞并在其中复制，使 CD4⁺ T 细胞数量持续下降，最终因机会性感染与肿瘤而死亡，这既是免疫缺陷导致感染的原理，也是抗病毒治疗的关键靶点。免疫治疗的另外两条路线是免疫检查点抑制剂与嵌合抗原受体 T 细胞疗法，它们把免疫系统重新纳入抗肿瘤与抗感染的战场。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["质膜与受体（T2、T3）：抗原与受体的结合、Fc 受体与补体受体的信号转导，本质仍是膜蛋白的识别与构象变化。",false]]},{"kind":"bullet","runs":[["细胞信号转导（T8）：T 细胞受体与 B 细胞受体的活化信号、细胞因子受体经 JAK-STAT 通路传递，与 G 蛋白、酪氨酸激酶级联同属一类原理。",false]]},{"kind":"bullet","runs":[["细胞死亡（T10）：细胞毒性 T 细胞经穿孔素-颗粒酶与 Fas-FasL 两条路线诱导靶细胞凋亡，是凋亡外源途径最典型的生理场景。",false]]},{"kind":"bullet","runs":[["细胞周期（T9、T11）：淋巴细胞受抗原刺激后必须进入细胞周期完成克隆扩增，免疫应答的规模是细胞增殖调控的宏观表现。",false]]},{"kind":"bullet","runs":[["肿瘤（T13）：免疫监视与免疫逃逸、免疫检查点抑制剂与嵌合抗原受体 T 细胞治疗。",false]]}]},{"key":"apply","title":"灵活运用（模拟题）","blocks":[{"kind":"qa","q":"【情境·必做】同种异体器官移植后常发生排斥反应。请解释排斥反应的免疫学基础，并说明环孢素 A 为什么能抑制排斥反应，同时又增加感染与肿瘤的发生风险。","a":"答案：①排斥反应的根本原因是供者与受者的主要组织相容性复合体分子不同，受者的 T 细胞把供者的 MHC 分子及其所提呈的抗原肽识别为非己抗原，从而启动免疫应答；②细胞免疫与体液免疫同时参与：CD8⁺ 细胞毒性 T 细胞识别供者 MHC Ⅰ 类分子提呈的抗原肽后直接杀伤移植物细胞，CD4⁺ 辅助 T 细胞识别 MHC Ⅱ 类分子后被激活并分泌白细胞介素 2 等细胞因子，放大应答并辅助 B 细胞产生抗体，抗体可通过补体与抗体依赖性细胞毒作用进一步损伤移植物；③环孢素 A 进入 T 细胞后与亲环素结合形成复合体，抑制钙调磷酸酶活性，使活化 T 细胞核因子不能去磷酸化入核，白细胞介素 2 的转录被阻断，T 细胞无法完成活化与克隆扩增，排斥反应因此减轻；④但白细胞介素 2 依赖的活化是所有 T 细胞应答的公共环节，用药后机体对病毒、真菌与胞内菌的防御能力下降，感染风险升高；同时免疫监视作用被削弱，病毒相关的肿瘤与淋巴瘤发生率上升；⑤因此临床上需要在抑制排斥与保留抗感染、抗肿瘤能力之间平衡，通常采用多种药物小剂量联合并定期监测血药浓度。","src":"灵活运用 · 情境分析"},{"kind":"qa","q":"【实验设计·必做】请设计实验证明某种抗原能引起小鼠的二次免疫应答，并说明如何证明免疫记忆是随记忆细胞转移的。","a":"答案：①分组：取同品系小鼠随机分为初次免疫组与对照组，初次免疫组注射抗原加佐剂，对照组注射等量生理盐水加佐剂；②二次攻击：间隔 2～4 周后两组都注射相同抗原，在不同时间点采血，用酶联免疫吸附试验测定抗体效价，若初次免疫组抗体出现更快、峰值更高、持续时间更长，并出现由 IgM 为主转为以 IgG 为主的变化，说明发生了二次应答与免疫记忆；③细胞学证据：再次免疫后取脾脏，用流式细胞术检测抗原特异性 B 细胞的频率，或将脾细胞在体外用抗原刺激后测定抗体分泌量，若均明显高于对照组，说明抗原特异性克隆发生了扩增；④过继转移实验：取初次免疫小鼠的脾细胞或分选后的 B 细胞与 T 细胞，静脉输注给同品系未免疫小鼠，再用抗原攻击，若受体小鼠出现快速高滴度的抗体应答，说明免疫记忆随记忆细胞转移，而不是抗体本身残留所致；⑤对照与特异性：设置无关抗原组排除佐剂与非特异效应，设置同品系对照排除个体差异，并对同一抗原重复攻击以确认记忆的特异性；⑥结论需要同时具备二次应答的动力学特征、特异性克隆扩增与过继转移三项证据。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较·选做】比较先天免疫与适应性免疫在识别方式、反应速度、特异性、记忆与组成上的差别，并说明先天免疫为什么是适应性免疫的启动者与放大器。","a":"答案：①识别方式：先天免疫由胚系基因编码的模式识别受体识别病原相关分子模式，识别的是病原体共有的固定结构；适应性免疫由基因重排产生的 B 细胞受体与 T 细胞受体识别特定抗原表位，识别的是高度特异的分子形状。②反应速度：先天免疫在数分钟到数小时内启动；适应性免疫的初次应答需要 3～7 天。③特异性与记忆：先天免疫特异性低、没有记忆；适应性免疫特异性高、具有记忆。④组成：先天免疫包括皮肤黏膜屏障、吞噬细胞与树突状细胞、自然杀伤细胞、补体与炎症反应、干扰素；适应性免疫包括 B 细胞介导的体液免疫与 T 细胞介导的细胞免疫。⑤先天免疫是启动者：树突状细胞摄取抗原后成熟并迁移到淋巴结，把抗原提呈给 T 细胞，同时提供共刺激信号，缺少这一环节 T 细胞不能有效活化，免疫应答无法启动。⑥先天免疫是放大器：补体成分 C3d 与抗原结合后可经 B 细胞表面受体增强活化信号，细胞因子与趋化因子招募更多免疫细胞到达炎症部位，形成放大环路。⑦因此先天免疫的作用不只是“先打一阵”，它决定了适应性免疫是否启动、启动多强以及走向哪一类应答。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["先天免疫识别与适应性免疫识别在分子基础上有什么差别？",false]]},{"kind":"num","runs":[["MHC Ⅰ 类与 MHC Ⅱ 类分子在提呈来源、提呈对象与效应细胞上有什么不同？",false]]},{"kind":"num","runs":[["抗体通过哪几种方式清除抗原？单克隆抗体有什么优点？",false]]},{"kind":"num","runs":[["超敏反应分为哪四型？各举一个例子并说明其发生机制。",false]]}]}]},{"n":"T13","special":true,"title":"原理十二：失控的增殖——肿瘤的发生逻辑与治疗靶点","sections":[{"key":"frame","title":"本专题要解决的问题","blocks":[{"kind":"p","runs":[["先看清这一层原理要回答什么，再往下读。",true]]},{"kind":"bullet","runs":[["正常细胞变成肿瘤细胞要跨过哪几道关？",false]]},{"kind":"bullet","runs":[["为什么说肿瘤是多步突变累积的结果，而不是一次事件？",false]]},{"kind":"bullet","runs":[["实体瘤为什么必须血管化？肿瘤如何获得无限增殖能力？",false]]},{"kind":"bullet","runs":[["靶向药一开始有效、后来为什么耐药？",false]]},{"kind":"bullet","runs":[["免疫系统本来能杀肿瘤，肿瘤是怎么逃掉的？",false]]},{"kind":"p","runs":[["覆盖考点",true]]},{"kind":"bullet","runs":[["第 14 章 癌细胞：肿瘤细胞的特征、原癌基因与抑癌基因、多步突变与基因组不稳定、无限增殖、血管生成、侵袭与转移、代谢重编程、靶向治疗与耐药。",false]]},{"kind":"bullet","runs":[["交叉：第 11 章（生长因子与通路）、第 13 章（细胞周期失控）、第 15 章（凋亡逃逸与自噬）、第 16 章（去分化与肿瘤干细胞）、免疫部分（免疫监视与免疫治疗）。",false]]},{"kind":"p","runs":[["对应主干复习日：Day 37、Day 38、Day 69、Day 70。",false]]},{"kind":"p","runs":[["建议用时 60～90 分钟：原理精读 30 分钟，必做题 30 分钟（先自己写再看答案），自测 15 分钟；时间紧时只做带【必做】标记的题目，选做题留到机动复习日。",false]]}]},{"key":"must","title":"原理精讲","blocks":[{"kind":"p","runs":[["第一层原理：肿瘤的本质是获得功能的突变与失去功能的突变不断累积。",true]]},{"kind":"p","runs":[["一次基因改变不足以形成肿瘤。结肠癌的经典模型显示，从正常上皮到腺瘤再到癌，需要依次发生 APC 失活（Wnt 通路持续活化）、KRAS 激活、p53 失活等多个改变，每一步都使细胞获得一点生存或增殖优势。DNA 修复缺陷（如错配修复基因缺失、BRCA 突变）会显著加快突变累积速度，因此这类患者肿瘤发生更早、更易出现多种原发灶。",false]]},{"kind":"p","runs":[["第二层原理：生长信号自主化。",true]]},{"kind":"p","runs":[["正常细胞的增殖依赖外源生长因子，肿瘤细胞通过 Ras 点突变、受体酪氨酸激酶扩增、生长因子自分泌或下游分子持续活化，把油门踩死而不再需要外部指令；与此同时，抑制性信号通路（如转化生长因子β通路）的失效使刹车也被拆除。这两方面共同构成“信号自主化”。",false]]},{"kind":"p","runs":[["第三层原理：刹车与自毁系统同时失效。",true]]},{"kind":"p","runs":[["Rb 通路失活（cyclin D 扩增、CDK4 突变、p16 沉默）使细胞不受限制地越过 G1/S 限制点；p53 突变使 DNA 损伤不能被察觉，细胞既不停止修复也不进入凋亡，于是损伤继续传递，出现非整倍体、染色体易位与基因扩增，基因组不稳定反过来加速新的突变，形成恶性循环。",false]]},{"kind":"p","runs":[["第四层原理：突破分裂次数上限并逃逸死亡。",true]]},{"kind":"p","runs":[["正常体细胞缺少端粒酶活性，端粒随分裂缩短，最终进入复制性衰老；约 90% 的肿瘤细胞重新激活端粒酶（少数使用替代性延长机制），获得无限增殖能力。同时凋亡通路被破坏：Bcl-2 家族抗凋亡蛋白过表达、Bax 突变或 p53 失活，使细胞在化疗与放疗损伤下仍能存活，这也是耐药的重要基础。",false]]},{"kind":"p","runs":[["第五层原理：血管生成是实体瘤继续生长的前提。",true]]},{"kind":"p","runs":[["肿瘤体积超过 1～2 毫米后，单纯依靠扩散已不能满足氧与营养需求，缺氧使缺氧诱导因子稳定，上调血管内皮生长因子等促血管生成因子，诱导新生血管形成。这些血管结构异常、通透性高、灌注不均，既造成肿瘤内部的缺氧与酸性环境，也影响药物递送。抗血管生成药物（如抗血管内皮生长因子的单克隆抗体）与血管正常化策略正是针对这一环节。",false]]},{"kind":"p","runs":[["第六层原理：侵袭与转移是恶性肿瘤最本质的标志。",true]]},{"kind":"p","runs":[["转移包括几个连续步骤：上皮-间质转化使细胞失去上皮钙黏蛋白、获得迁移能力；基质金属蛋白酶降解细胞外基质；细胞穿过血管壁进入循环并在循环中存活；在靶器官外渗并定植形成新病灶。转移灶是肿瘤致死的主要原因，因此抑制转移相关机制是药物研发的重要方向。",false]]},{"kind":"p","runs":[["第七层原理：代谢重编程为快速增殖提供原料。",true]]},{"kind":"p","runs":[["即使在有氧条件下，肿瘤细胞也以糖酵解为主要方式分解葡萄糖并生成大量乳酸，这一现象称为 Warburg 效应。糖酵解产生 ATP 的速度快，中间产物可转入核苷酸、氨基酸与脂质的合成，乳酸还酸化微环境、抑制免疫细胞功能。临床上利用肿瘤葡萄糖摄取增加的特性，用氟代脱氧葡萄糖进行正电子发射断层扫描显像，就是这一原理的直接应用。",false]]},{"kind":"p","runs":[["第八层原理：免疫监视与免疫逃逸的博弈。",true]]},{"kind":"p","runs":[["细胞毒性 T 细胞能识别肿瘤抗原并杀伤肿瘤细胞，是机体天然的防线；肿瘤则通过下调 MHC Ⅰ 类分子、表达程序性死亡配体 1 与 T 细胞的程序性死亡受体 1 结合、募集调节性 T 细胞与抑制型巨噬细胞、营造免疫抑制微环境来逃逸。免疫检查点抑制剂通过阻断抑制信号恢复 T 细胞功能，嵌合抗原受体 T 细胞疗法通过基因工程改造 T 细胞的特异性，两者都把免疫监视重新推回有利一侧。",false]]},{"kind":"p","runs":[["第九层原理：靶向治疗的依据是癌基因成瘾，耐药的根源是异质性与旁路激活。",true]]},{"kind":"p","runs":[["当肿瘤的生长高度依赖某一个驱动基因时，抑制该靶点就能显著抑制肿瘤，这称为癌基因成瘾：慢性粒细胞白血病依赖 BCR-ABL 融合激酶，部分肺癌依赖突变的表皮生长因子受体，部分乳腺癌依赖 HER2 扩增，治疗分别使用伊马替尼、酪氨酸激酶抑制剂与曲妥珠单抗。耐药可分为三类：靶点内耐药（靶基因二次突变，如 T790M）、靶点外耐药（旁路通路激活，如 MET 扩增）、表型耐药（肿瘤异质性与肿瘤干细胞、药物外排增加）。对应的策略是联合用药、开发新一代抑制剂以及按分子分型选择方案。",false]]},{"kind":"p","runs":[["第十层原理：肿瘤不是一种病，而是许多种病的集合。",true]]},{"kind":"p","runs":[["不同组织来源、不同驱动基因与不同突变负荷的肿瘤，对同一治疗的反应差别很大，因此分子分型与个体化治疗成为现代肿瘤治疗的基本原则。肿瘤干细胞假说进一步指出，一小群具有自我更新与多向分化能力的细胞是复发与耐药的根源，这也把肿瘤治疗与干细胞生物学、分化诱导治疗联系起来。",false]]}]},{"key":"link","title":"跨章串联","blocks":[{"kind":"bullet","runs":[["细胞信号转导（T8）：Ras-MAPK 与 PI3K-AKT 通路的持续活化是大多数实体瘤的共同基础。",false]]},{"kind":"bullet","runs":[["细胞周期（T9）：cyclin D 扩增、CDK4/6 抑制剂、p53 与 Rb 通路失活，是周期调控原理在疾病中的体现。",false]]},{"kind":"bullet","runs":[["细胞死亡与衰老（T10）：逃逸凋亡、Bcl-2 抑制剂与自噬相关的耐药机制。",false]]},{"kind":"bullet","runs":[["分化与干细胞（T11）：去分化、肿瘤干细胞与分化诱导治疗，急性早幼粒细胞白血病是成功的范例。",false]]},{"kind":"bullet","runs":[["免疫（T12）：免疫监视与免疫逃逸、免疫检查点抑制剂与嵌合抗原受体 T 细胞治疗。",false]]},{"kind":"bullet","runs":[["先进技术与类器官：用类器官做药物敏感性检测，用单细胞测序研究肿瘤异质性。",false]]}]},{"key":"apply","title":"灵活运用（模拟题）","blocks":[{"kind":"qa","q":"【情境·必做】慢性粒细胞白血病由 BCR-ABL 融合基因引起，而结肠癌的发生涉及 APC、KRAS 与 p53 等多个基因的改变。请从驱动基因与治疗靶点的角度说明，为什么前者更适合单一靶向治疗，而后者更需要联合方案。","a":"答案：①慢性粒细胞白血病中，9 号与 22 号染色体易位形成 BCR-ABL 融合基因，其编码的融合蛋白具有持续活化的酪氨酸激酶活性，是驱动肿瘤增殖的核心因素，肿瘤细胞对这条通路存在高度依赖，即癌基因成瘾；②伊马替尼竞争性结合 ABL 激酶的 ATP 结合位点，抑制其磷酸化下游底物的能力，增殖信号被阻断，肿瘤细胞因而停滞并凋亡，所以单药即可获得很高的缓解率，且对正常细胞的副作用相对较小；③结肠癌的发生是多个通路依次改变的结果：APC 失活使 Wnt 通路持续活化，KRAS 突变使 Ras-MAPK 通路不依赖上游信号，p53 失活使检查点与凋亡失效，抑制其中任意一个靶点都可能被其他通路的活化补偿，单一靶向治疗效果有限；④因此结肠癌主要采用化疗联合抗血管生成药物等组合策略，只有高度微卫星不稳定型因突变负荷高、免疫原性强，对免疫检查点抑制剂反应较好；⑤结论：靶向治疗的疗效取决于肿瘤是否对该靶点存在依赖，单驱动肿瘤与多驱动肿瘤的治疗策略不同，分子分型因此成为临床决策的前提。","src":"灵活运用 · 情境分析"},{"kind":"qa","q":"【实验设计·必做】请设计一套实验方案，筛选能选择性杀伤肿瘤细胞而不明显损伤正常细胞的化合物，并说明如何判断其作用机制是诱导凋亡。","a":"答案：①细胞水平筛选：选取若干肿瘤细胞系与对应的正常细胞（如正常成纤维细胞或原代上皮细胞），设置浓度梯度处理 24～72 小时，用 CCK-8 或 MTT 法测定细胞存活率，计算半数抑制浓度并比较选择性指数，初步判断是否具有选择性；②形态学观察：用倒置显微镜与荧光显微镜观察细胞形态，凋亡细胞表现为皱缩、染色质凝集与核碎裂，可用 DAPI 或 Hoechst 染色确认；③凋亡的流式检测：用 Annexin V 与碘化丙啶双染，若 Annexin V 阳性而碘化丙啶阴性的早期凋亡细胞比例显著升高，支持凋亡而非坏死；④生化验证：免疫印迹检测 caspase-3、caspase-8 与 caspase-9 的活化片段以及 PARP 的剪切产物，若 caspase-9 与 caspase-3 明显活化而 caspase-8 变化不大，提示走线粒体内源途径；⑤线粒体功能检测：用 JC-1 染色观察线粒体膜电位下降，用免疫荧光或免疫印迹检测细胞色素 c 由线粒体释放到胞质，并检测 Bcl-2 家族蛋白的表达变化；⑥机制依赖性验证：加入广谱 Caspase 抑制剂观察凋亡是否被阻断，并用 p53 野生型与缺失型细胞比较敏感性，判断该化合物是否依赖 p53 通路；⑦体内验证与安全性评价：建立小鼠移植瘤模型，比较处理组与对照组的肿瘤体积与重量，同时观察体重变化并取心、肝、脾、肺、肾做病理检查，评估毒性；⑧结论需要同时具备对肿瘤细胞的选择性杀伤、凋亡标志物的活化以及体内可重复三项证据。","src":"灵活运用 · 实验设计"},{"kind":"qa","q":"【比较·选做】从增殖信号依赖、接触抑制与锚定依赖、端粒维持、凋亡倾向、代谢方式与基因组稳定性六个方面比较正常细胞与肿瘤细胞的差别。","a":"答案：①增殖信号依赖：正常细胞需要生长因子与黏附信号才能分裂，肿瘤细胞通过 Ras 突变、受体酪氨酸激酶扩增或自分泌生长因子实现信号自主化，不再依赖外部指令。②接触抑制与锚定依赖：正常细胞长满单层并接触邻近细胞后停止分裂，且必须附着于基质才能生长；肿瘤细胞失去接触抑制与锚定依赖，可以堆叠生长，并能在软琼脂中形成克隆，这是体外判断恶性表型的经典指标。③端粒维持：正常体细胞端粒酶活性很低，端粒随分裂缩短并最终导致复制性衰老；约 90% 的肿瘤细胞重新激活端粒酶，从而突破 Hayflick 界限获得无限增殖能力。④凋亡倾向：正常细胞在 DNA 损伤时经 p53 通路停滞修复或启动凋亡；肿瘤细胞常因 p53 突变或 Bcl-2 过表达而逃避凋亡，对化疗与放疗不敏感。⑤代谢方式：正常细胞以氧化磷酸化为主，肿瘤细胞在有氧条件下也以糖酵解为主，产生大量乳酸，即 Warburg 效应，临床上可用氟代脱氧葡萄糖正电子发射断层扫描检测。⑥基因组稳定性：正常细胞具备完整的 DNA 损伤修复与检查点；肿瘤细胞常有错配修复缺陷或同源重组缺陷，表现为大量突变、非整倍体与染色体易位，这既推动肿瘤进展，也造成治疗过程中的耐药克隆产生，同时也是免疫检查点抑制剂在高突变负荷肿瘤中更有效的原因。","src":"灵活运用 · 比较"}]},{"key":"quiz","title":"本专题自测","blocks":[{"kind":"num","runs":[["肿瘤细胞在无限增殖、生长信号自主化与凋亡逃逸三方面各有哪些分子改变？",false]]},{"kind":"num","runs":[["什么是癌基因成瘾？它如何解释靶向治疗的疗效与耐药的产生？",false]]},{"kind":"num","runs":[["Warburg 效应指什么？它在诊断与治疗上有什么应用？",false]]},{"kind":"num","runs":[["肿瘤如何逃避免疫攻击？免疫检查点抑制剂为什么能恢复免疫杀伤？",false]]}]}]}]};

function fibId(b){
  const s = String(b.stem || "");
  let x = 0;
  for(let i = 0; i < s.length; i++){ x = (x * 31 + s.charCodeAt(i)) % 2147483647; }
  return "f" + x;
}
function fibRec(b){
  const rec = store["fib:" + fibId(b)];
  const n = rec ? (rec.n || 0) : 0;
  const c = rec ? (rec.c || 0) : 0;
  return { n: n, c: c, rate: n ? Math.round(c / n * 100) : 0, cls: (n && c >= n) ? "ok" : "no" };
}
function fibStat(){
  let n = 0, c = 0;
  for(const k in store){
    if(k.indexOf("fib:") === 0 && store[k] && store[k].n){ n += store[k].n; c += (store[k].c || 0); }
  }
  return { n: n, c: c, bad: n - c, rate: n ? Math.round(c / n * 100) : 0 };
}
function fibNorm(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248))
    .toLowerCase()
    .replace(/[\s\u3000]/g, "")
    .replace(/[，,。.；;：:、（）()【】\[\]“”"'’‘·`~!！?？\-—_／/\\]/g, "");
}
function fibLooseNorm(s){
  /* “的”是结构助词，漏写或位置微调不改变专业含义，单独作为轻微差异处理。 */
  return fibNorm(s).replace(/的/g, "");
}
function fibSynNorm(s){
  /* 翻译过程的常用同义写法：多肽链=肽链，起始=开始=启动，延伸=延长，终止=结束=完成。 */
  return fibLooseNorm(s)
    .replace(/多肽链/g, "肽链")
    .replace(/肽链(?:的)?合成/g, "肽链")
    .replace(/^肽链/, "")
    .replace(/开始|启动/g, "起始")
    .replace(/延长/g, "延伸")
    .replace(/结束|完成/g, "终止");
}
function fibCands(v){
  const raw = String(v === null || v === undefined ? "" : v);
  const out = [];
  const add = x => { const n = fibNorm(x); if(n && out.indexOf(n) < 0) out.push(n); };
  add(raw);
  add(raw.replace(/[（(【][^（）()【】]*[)）】]/g, ""));
  const re = /[（(【]([^（）()【】]*)[)）】]/g;
  let m;
  while((m = re.exec(raw)) !== null){ add(m[1]); }
  return out;
}
function fibCompare(input, variants){
  const v = fibNorm(input);
  if(!v) return "none";
  const loose = fibLooseNorm(v);
  const syn = fibSynNorm(v);
  let minor = false;
  for(const cand of (variants || [])){
    for(const c of fibCands(cand)){
      if(!c) continue;
      if(v === c) return "exact";
      const cSyn = fibSynNorm(c);
      if(syn && syn === cSyn) return "synonym";
      const cLoose = fibLooseNorm(c);
      /* 只差“的”时按轻微差异通过；至少保留 2 个实义字符，避免把“目”误判为“目的”。 */
      if(loose.length >= 2 && loose === cLoose) minor = true;
      if(v.length >= 4 && c.indexOf(v) >= 0 && v.length >= Math.ceil(c.length * 0.6)) return "exact";
      if(loose.length >= 4 && cLoose.indexOf(loose) >= 0 && loose.length >= Math.ceil(cLoose.length * 0.6)) minor = true;
      if(syn.length >= 4 && cSyn.indexOf(syn) >= 0 && syn.length >= Math.ceil(cSyn.length * 0.6)) return "synonym";
    }
  }
  return minor ? "minor" : "none";
}
function fibMatch(input, variants){
  return fibCompare(input, variants) !== "none";
}
/* 顺序不限：题干里的几个空是并列关系时，允许答案互换位置 */
function fibOrderSpec(card){
  const raw = card && card.getAttribute ? card.getAttribute("data-order") : null;
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function matchBlanks(blanks, inputs, ans){
  const adj = {};
  blanks.forEach(bi => {
    adj[bi] = inputs.filter(inp => fibMatch(inp.value, ans[bi] || []));
  });
  const inputToBlank = new Map();
  const blankToInput = {};
  function augment(bi, seen){
    for(const inp of adj[bi] || []){
      if(seen.has(inp)) continue;
      seen.add(inp);
      const other = inputToBlank.get(inp);
      if(other === undefined || augment(other, seen)){
        inputToBlank.set(inp, bi);
        blankToInput[bi] = inp;
        return true;
      }
    }
    return false;
  }
  blanks.forEach(bi => augment(bi, new Set()));
  return blankToInput;
}
function fibStemHtml(b){
  const s = String(b.stem || "");
  const re = /\[\[(\d+)\]\]/g;
  let out = "", last = 0, m;
  while((m = re.exec(s)) !== null){
    out += esc(s.slice(last, m.index));
    out += `<input class="fib-in" type="text" data-b="${m[1]}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="填这里"><span class="fib-fb" data-b="${m[1]}"></span>`;
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  return out;
}

    <div class="fib-ans hidden"><b>答案：</b>${ansList}${orderNote}${ex}</div>
  </div>`;
}
function judgeFib(card){
  if(!card) return null;
  let ans = [];
  try{ ans = JSON.parse(card.getAttribute("data-ans") || "[]"); }catch(e){ ans = []; }
  const inputs = Array.prototype.slice.call(card.querySelectorAll(".fib-in"));
  const total = inputs.length;
  const order = fibOrderSpec(card);
  const blankOf = inp => +inp.getAttribute("data-b");
  const inputOf = bi => inputs.filter(x => blankOf(x) === bi)[0];
  const state = new Map();
  inputs.forEach(inp => {
    const match = fibCompare(inp.value, ans[blankOf(inp)] || []);
    state.set(inp, {
      ok: match !== "none",
      minor: match === "minor",
      synonym: match === "synonym",
      note: match === "minor" ? "仅“的”字差异，不扣分"
        : (match === "synonym" ? "同义表述，不扣分" : "")
    });
  });
  const groups = order === true ? [inputs.map(blankOf)]
    : (Array.isArray(order) ? order.filter(g => Array.isArray(g) && g.length > 1) : null);
  if(groups){
    groups.forEach(g => {
      const rest = g.filter(bi => {
        const inp = inputOf(bi);
        return inp && !state.get(inp).ok;
      });
      if(rest.length < 2) return;
      const pair = matchBlanks(rest, rest.map(inputOf).filter(Boolean), ans);
      rest.forEach(bi => {
        const inp = pair[bi];
        if(!inp) return;
        const match = fibCompare(inp.value, ans[bi] || []);
        const minor = match === "minor";
        const notes = [];
        if(blankOf(inp) !== bi) notes.push("顺序不限");
        if(match === "synonym") notes.push("同义表述，不扣分");
        if(minor) notes.push("仅“的”字差异，不扣分");
        state.set(inp, { ok: true, minor: minor, synonym: match === "synonym", note: notes.join("，") });
      });
    });
  }
  let okCount = 0;
  let minorCount = 0;
  let synonymCount = 0;
  for(let i = 0; i < inputs.length; i++){
    const inp = inputs[i];
    const bi = blankOf(inp);
    const variants = ans[bi] || [];
    const st = state.get(inp) || { ok: false, note: "" };
    const ok = st.ok;
    if(ok) okCount++;
    if(ok && st.minor) minorCount++;
    if(ok && st.synonym) synonymCount++;
    inp.classList.remove("ok", "no");
    inp.classList.add(ok ? "ok" : "no");
    const fb = inp.nextElementSibling;
    if(fb && fb.classList && fb.classList.contains("fib-fb")){
      fb.className = "fib-fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? (st.note ? " ✓ " + st.note : " ✓") : (" ✗ 正确：" + (variants[0] || ""));
    }
  }
  const box = card.querySelector(".fib-ans");
  if(box) box.classList.remove("hidden");
  const allOk = total > 0 && okCount === total;
  const result = card.querySelector(".fib-result");
  if(result){
    result.className = "fib-result " + (allOk ? "ok" : "no");
    result.textContent = "本次 " + okCount + "/" + total + " 空正确 —— 判为" + (allOk ? "正确" : "错误") +
      (allOk && synonymCount && minorCount ? "（已忽略同义表述与“的”字差异）"
        : (allOk && synonymCount ? "（已认可同义表述）"
        : (allOk && minorCount ? "（已忽略“的”字差异）" : "")));
  }
  const qid = card.getAttribute("data-id") || "";
  const now = new Date();
  const stamp = (now.getMonth() + 1) + "-" + String(now.getDate()).padStart(2, "0");
  const prev = store["fib:" + qid] || {};
  const nn = (prev.n || 0) + 1;
  const nc = (prev.c || 0) + (allOk ? 1 : 0);
  store["fib:" + qid] = { r: allOk ? "ok" : "no", d: stamp, n: nn, c: nc };
  save();
  let badge = card.querySelector(".fib-rec");
  if(!badge){
    badge = document.createElement("span");
    badge.className = "mcq-rec fib-rec";
    const head = card.querySelector(".mcq-head");
    if(head) head.appendChild(badge); else card.appendChild(badge);
  }
  badge.className = "mcq-rec fib-rec " + (allOk ? "ok" : "no");
  badge.textContent = "作答 " + nn + " 次 · 正确率 " + Math.round(nc / nn * 100) + "%（本次" + (allOk ? "对" : "错") + "）";
  renderSide();
  return { ok: allOk, okCount: okCount, total: total };
}

  } else {

      '</div></div>';
    body += '<div class="path-lane gq"><div class="path-lane-label"><b>Gq 支路</b><small>生成两种第二信使</small></div><div class="path-splitflow">' +
      '<div class="path-flow">' + n('Gq','激活','switch') + a + n('PLC','磷脂酶 C','enzyme') + a + n('PIP₂','膜脂前体','messenger') + '</div>' +
      '<div class="path-flow"><span class="path-continue">PIP₂ 水解为</span>' + a +
      '<span class="path-mini-stack"><span class="path-mini-row"><b>IP₃</b> → 内质网释放 <b>Ca²⁺</b></span><span class="path-mini-row"><b>DAG</b> → 留在质膜内侧</span></span>' + a +

function richBlocksHtml(blocks){
  let out = "";
  let i = 0;
  let qn = 0;
  let fn = 0;
  while(i < blocks.length){
    const b = blocks[i];
    if(b.kind === "bullet"){
      const items = [];
      while(i < blocks.length && blocks[i].kind === "bullet"){ items.push(blocks[i]); i++; }
      out += `<ul class="clean">` + items.map(x => `<li>${runsHtml(x.runs)}</li>`).join("") + `</ul>`;
    } else if(b.kind === "num"){
      const items = [];
      while(i < blocks.length && blocks[i].kind === "num"){ items.push(blocks[i]); i++; }
      out += `<ol class="clean">` + items.map(x => `<li>${runsHtml(x.runs)}</li>`).join("") + `</ol>`;
    } else if(b.kind === "fib"){
      fn++;
      out += fibHtml(b, fn);
      i++;
    } else if(b.kind === "mcq"){
      qn++;
      out += mcqHtml(b, qn);
      i++;
    } else if(b.kind === "qa"){
      out += qaHtml(b);
      i++;
    } else if(b.kind === "diagram"){
      out += diagramHtml(b);
      i++;
    } else {
      out += `<p style="margin:7px 0">${runsHtml(b.runs)}</p>`;
      i++;
    }
  }
  return out;
}

function qaHtml(b){
  const tag = b.src ? `<span class="qa-tag">${esc(b.src)}</span>` : "";
  return `<details class="qa">
    <summary>${tag}<span class="qa-q">${esc(b.q)}</span></summary>
    <div class="qa-a">${esc(b.a)}</div>
  </details>`;
}

PD-1/PD-L1 免疫检查点抑制剂的作用原理。",false]]}]}],"n":38},{"title":"11月7日 · 干细胞与类器官","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["2024 单选直接考干细胞与干细胞移植。",false]]},{"kind":"bullet","runs":[["与 3D 培养、类器官连在一起复习。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、干细胞定义与分类：具有自我更新和多向分化潜能的细胞。按来源分胚胎干细胞与成体干细胞；按潜能分全能干细胞（可发育成完整个体）、多能干细胞（可分化为三胚层来源细胞）、单能干细胞（只分化为一种细胞）。",true]]},{"kind":"p","runs":[["二、诱导多能干细胞（iPS）：将已分化的体细胞导入转录因子（Oct4、Sox2、Klf4、c-Myc，即山中因子）重编程，获得类似胚胎干细胞的多能性。意义在于绕开胚胎来源的伦理争议，并可用于患者特异性细胞治疗与疾病建模。",true]]},{"kind":"p","runs":[["三、类器官：由干细胞或多能细胞在体外三维培养条件下自组织形成的、具有特定器官结构与功能的微型器官模型。特点是保留来源组织的关键结构与功能、可长期培养与传代，可用于发育研究、疾病建模、药物筛选与个性化医疗。",true]]},{"kind":"p","runs":[["四、干细胞移植：把干细胞（如造血干细胞）移植入受者体内，重建其造血与免疫系统，用于白血病、免疫缺陷病等治疗。核心问题是配型、移植物抗宿主病与移植排斥。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"以下哪种细胞的发育潜能最高？（ ）","opts":{"A":"multipotent cells","B":"pluripotent cells","C":"monopotent cells","D":"Totipotent cells"},"ans":"D","explain":"一般情况下，在整个发育过程中，细胞分化潜能逐渐受到越来越多的限制 而变窄，即由全能性细胞转化为多能和单能干细胞，因此全能干细胞 Totipotent cells 的发育潜能最高。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列哪类细胞具有分化能力？（）","opts":{"A":"肝细胞","B":"肾细胞","C":"胚胎细胞","D":"神经细胞"},"ans":"C","explain":"AB 两项，肝细胞、肾细胞都属于GO期细胞，丧失分化能力。D项，神 经细胞属于终端分化细胞，失去分化能力。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列哪种是终端分化细胞？（）","opts":{"A":"神经元","B":"骨髓干细胞","C":"肝细胞","D":"表皮细胞"},"ans":"A","explain":"终端分化细胞的结构和功能发生高度分化，已经丧失增殖能力，终生处于 GO期，直到衰老死亡。如：人的红细胞、神经元细胞和骨骼肌细胞等。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"对于干细胞，下面说法正确的是（）。［中科院-中科大 2004年研］","opts":{"A":"动物胚胎干细胞具有全能性 （totipotency）","B":"动物多能造血干细胞也具有全能性 96","C":"在动物细胞发育过程中，细胞核的分化全能性会逐步减弱变窄","D":"从多莉羊试验看出，动物的体细胞可以独立分化诱导成一个完整的新个体 E. 以上答案都不对"},"ans":"C","explain":"AB 两项，动物的胚胎干细胞和多能造血干细胞，不具有发育成完整个体 的潜能，因此不具有全能性。D项，多莉羊试验中，经过核移植的细胞需要转入母羊内， 在体内特定的生理条件下进行诱导发育，因此，动物体细胞不能独立分化诱导成一个完 整新个体。","src":"考点笔记·考研例题"},{"kind":"p","runs":[["什么是肿瘤干细胞？",true]]},{"kind":"p","runs":[["答案：肿瘤干细胞是一群存在于某些肿瘤组织中的干细胞样细胞，具有自我更新、无限增殖、转移和抗化学毒物损伤的能力。与一般的肿瘤细胞相比，肿瘤干细胞具有以下特性：（1）高致瘤性。很少量的肿瘤干细胞在体外培养，就能生成集落；将很少量的肿瘤干细胞注入实验动物体内，即可形成肿瘤。（2）强耐药性。多数肿瘤干细胞的细胞膜上表达 ATP 结合盒（ABC）家族膜转运蛋白，可运输并外排代谢产物、药物、毒性物质、内源性脂质、多肽、核苷酸及固醇类等多种物质，使之对许多化疗药物产生耐药性。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：干细胞、诱导多能干细胞、类器官、细胞全能性。",false]]},{"kind":"num","runs":[["简答：iPS 的制备原理与意义。",false]]},{"kind":"num","runs":[["简答：类器官的定义、特点与应用。",false]]},{"kind":"num","runs":[["论述：干细胞研究在再生医学中的应用前景与面临的问题。",false]]}]}],"n":39},{"title":"休息日","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["今天休息，不安排新内容。如果还有余力，可以花 10 分钟翻一遍昨天学的内容。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["（休息日无背诵任务，好好放松。）",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["——",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"p","runs":[["——",false]]}]}],"n":40},{"title":"11月9日 · 先进技术（一）：显微与动态","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["2024 单选大量考荧光、FRAP、细胞培养等实验技术。",false]]},{"kind":"bullet","runs":[["2025 几乎没考，2026 直接两道大论述：3D 培养、类器官——波动大但权重明显抬升。",false]]},{"kind":"bullet","runs":[["811 的选择题考的是实验原理理解，不是背步骤。要多问：这个实验为什么这么做、数据说明了什么。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、荧光技术群：荧光显微镜用于定位特定蛋白、核酸、离子；激发光波长决定激发能量，荧光基团吸收激发光后发射更长波长的发射光（斯托克斯位移）。免疫荧光用抗体做特异性定位；FISH 用核酸探针定位特定序列；荧光蛋白（GFP）融合用于活细胞实时定位。",true]]},{"kind":"p","runs":[["二、FRAP（荧光漂白恢复）：用激光把某一区域荧光漂白，因分子运动该区域荧光逐渐恢复；恢复速度反映分子运动／扩散能力。用于研究膜的流动性、蛋白质动力学。判读要点：恢复快说明运动快、流动性强。",true]]},{"kind":"p","runs":[["三、FRET（荧光共振能量转移）：两个荧光基团距离极近（1—10 nm）且供体发射光谱与受体吸收光谱重叠时，能量从供体非辐射转移给受体。用于检测分子间相互作用、构象变化与分子间距离。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"与荧光蛋白发出的光相比，激发光的能量与波长分别是","opts":{"A":"能量更高、波长更短","B":"能量更高、波长更长","C":"能量更低、波长更短","D":"能量更低、波长更长"},"ans":"A","explain":"激发光波长更短、能量更高，发射光因斯托克斯位移波长更长、能量更低。","src":"811真题·2024"},{"kind":"mcq","stem":"适于观察培养瓶中活细胞的显微镜是（）。","opts":{"A":"荧光显微镜","B":"相差显微镜","C":"倒置显微镜","D":"扫描电镜"},"ans":"C","explain":"A项，荧光显微镜主要用于细胞内蛋白质、核酸、糖类等组分定性定位的 8 研究中。B 项，相差显微镜主要用于观察细胞的显微结构。C项，倒置显微镜用于观察 培养的活细胞。D项，扫描电镜用于观察样品表面的立体图像信息。","src":"考点笔记·考研例题"},{"kind":"p","runs":[["试举 1～2 例说明电子显微镜技术与细胞分子生物学技术的结合在现代细胞生 物学研究中的应用。",true]]},{"kind":"p","runs":[["答案：电子显微镜技术与细胞分子生物学技术的结合在现代细胞生物学研究中的应用举例如下：（1）利用电子显微镜，可以观察到细胞中内质网、线粒体、质体、高尔基体、中心体、溶酶体和细胞骨架系统等各种细胞器的超微结构，并可进一步研究细胞结构和功能的关系，深入探索细胞通讯与运输、分裂与分化、增殖与调控等生命活动的规律。（2）负染色技术有利于揭示病毒、细菌和支原体等超微结构，在微生物发育史研究中起重要作用。（3）冷冻蚀刻技术制备的样品在电镜下可观察膜断裂面上的蛋白质颗粒和膜表面形貌特征，图像富有立体感，样品不需包埋甚至也不需要固定。（4）扫描隧道显微镜可直接观察到 DNA、RNA 和蛋白质等生物大分子及生物膜、病毒等结构。",false]]},{"kind":"p","runs":[["光学显微镜技术有哪些新发展？它们各有哪些突出优点？为什么电子显微镜不 能完全代替光学显微镜？",true]]},{"kind":"p","runs":[["答案：（1）光学显微镜技术的新发展：在普通光学显微镜技术的基础上，又发展出了荧光显微镜技术、激光扫描共焦显微镜技术、相差和微分干涉显微镜技术、暗视野显微镜、倒置显微镜及录像增差显微镜技术等。（2）光学显微镜技术的优点：①荧光显微镜，是在光镜水平上对细胞内特异的蛋白质、核酸、糖类、脂质以及某些离子等组分进行定性定位研究的有力工具。 ②激光扫描共焦显微镜，成像清晰，分辨率高，在研究亚细胞结构与组分的定位及动态变化等方面具有重要作用。另外荧光共振能量转移技术、荧光漂白恢复技术以及单分子成像技术等都离不开激光扫描共焦显微镜。 ③相差显微镜，不需要染色就可以观察活细胞以及细胞核、线粒体等细胞器的动态变化。 ④微分干涉显微镜，在相差显微镜的基础上发展而来，增加了样品密度的明暗区别，增加了反差，成像更具立体感，更适于研究活细胞。 ⑤暗视野显微镜，在黑暗背景下利用散射光观察细胞，细胞及细胞器边缘轮廓更清晰。 ⑥倒置显微镜，照射系统和物镜颠倒位置，增加了集光器和载物台的距离，可放置培养皿观察。 ⑦录像增差显微镜，分辨率比普通光学镜提高了一个数量级，可在高分辨率下研究活细胞，可观察颗粒的运动。（3）电子显微镜不能完全代替光学显微镜的原因：虽然光学显微镜无法比拟电子显微镜分辨率高的优越性，但光学显微镜在科研中的地位是不可取代的。原因如下： 14 ①细胞生物学是在显微、亚显微和分子三个结构层次上研究细胞的，而光学显微镜和电子显微镜是从不同显微水平上观察细胞结构，前者主要用于显微水平的观察，后者更适于亚显微水平的观察。 ②普通光学显微镜样品易制备，而电子显微镜对样品要求很高，通常需要特别的制样技术，如超薄切片技术。 ③普通光学显微镜可以观察活细胞及其动态变化，而电子显微镜则不能。 ④普通光学显微镜操作简单，而电子显微镜镜筒采用高真空，对环境和设备要求较高。",false]]},{"kind":"p","runs":[["用二色荧光分别标记人和鼠细胞膜蛋白，将二细胞融合，进行荧光抗体免 疫实验，首先出现荧光扩散现象，当时间延长后，均匀分布在细胞表面的标记荧光会重 新排布，出现成斑现象。请解释为什么会出现上述两种似乎矛盾的现象。",true]]},{"kind":"p","runs":[["答案：出现上述两种似乎矛盾现象的原因如下：（1）由于细胞膜的流动性，人和鼠的细胞膜会融合，使得荧光均匀分布，即荧光扩散现象。（2）当时间延长后，已均匀分布的荧光会重新分布，聚集在细胞表面的某些部位，即成斑现象。成斑现象进一步证实了膜蛋白的流动性，其原因是二价的抗体分子交联相邻的膜蛋白分子使荧光聚集。这一现象也与膜蛋白和膜下骨架系统的相互作用以及质膜和细胞内膜系统之间的膜泡运输有关。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：FRAP、FRET、类器官、单细胞测序。",false]]},{"kind":"num","runs":[["简答：FRAP 的原理，以及如何据恢复曲线判断流动性。",false]]},{"kind":"num","runs":[["简答：FRET 的原理与用途。",false]]},{"kind":"num","runs":[["论述：与传统 2D 培养相比，3D 培养和类器官有什么优势与局限？",false]]},{"kind":"num","runs":[["简答：免疫荧光与 FISH 的原理与区别。",false]]}]}],"n":41},{"title":"11月10日 · 先进技术（二）：3D 培养与类器官","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["2026 两道大论述就出在这里。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["四、其他常用技术：流式细胞术（定量、分选细胞群体）；单细胞测序（解析细胞异质性）；CRISPR/Cas9（基因编辑，用于功能验证与疾病建模）；超分辨显微术（突破光学衍射极限）。",true]]},{"kind":"p","runs":[["五、3D 培养与类器官（2026 论述）：2D 培养使细胞贴壁生长，形态与基因表达发生改变，不能还原组织微环境；3D 培养让细胞在三维基质中自组织，更接近体内结构与功能。类器官是由干细胞在 3D 条件下自组织形成的微型器官模型，保留原组织的关键结构与功能，可用于发育研究、疾病建模、药物筛选与个性化治疗。要点：答题时先讲 2D 的局限，再讲 3D 与类器官的优势，最后写应用与局限（缺乏血管与免疫细胞、标准化困难）。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["为什么说细胞培养是细胞生物学研究的最基本的实验技术之一？",true]]},{"kind":"p","runs":[["答案：细胞培养是指利用细胞的全能性，在体外模拟体内的生理环境，培养从机体中取出的细胞，并使之生存和生长的技术。之所以说“细胞培养是细胞生物学研究的最基本的实验技术之一”，是因为：（1）细胞生物学是一门研究和揭示细胞基本生命活动规律的学科，是生命科学的基础，研究细胞结构与功能，细胞增殖、分化、代谢、运动、衰老、死亡，以及细胞信号转导，细胞基因表达与调控，细胞起源与进化等重大生命过程。细胞是生命活动的基本单位，脱离细胞就无法进行具体的研究。（2）生物学其他领域的研究，如基因工程、酶工程、蛋白质工程、细胞工程、发酵工程等均需在细胞上进行操作，因此都离不开细胞培养技术。",false]]},{"kind":"p","runs":[["什么是类器官？为什么类器官能在细胞功能成熟方面能起到重要作用？",true]]},{"kind":"p","runs":[["答案：类器官是指在三维培养体系中具有器官特性和空间结构的细胞群体。类器官在细胞功能成熟方面能起到重要作用的原因如下：（1）类器官主要来源于多潜能性干细胞和成体干细胞，只需要在体外培养条件下使用含有特定生长因子的细胞培养基就可以被定向诱导分化为多个器官特异性细胞类型。（2）部分类器官模型系统的特征是具有活性干细胞群的存在，类器官可以实现极大的扩增。（3）能够模拟体内的细胞分化和器官空间构成，与对应的器官拥有类似的空间组织并能够重现对应器官的部分功能，突破了细胞间单纯的物理接触联系，形成了更加紧密的细胞间生物通信，细胞间相互影响、诱导、反馈，协作发育成迷你器官或者组织，从而提供一个高度相关的生理系统。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["论述：3D 培养与传统 2D 培养相比的优势与局限。",false]]},{"kind":"num","runs":[["名词解释：类器官、FRAP、FRET、单细胞测序。",false]]}]}],"n":42},{"title":"11月11日 · 发育（一）：三胚层与形态发生","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["811 第 11 章明确要求胚胎发育，按框架记。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、三胚层：受精卵经卵裂、囊胚、原肠胚形成三个胚层——外胚层（表皮与神经系统）、中胚层（肌肉、骨骼、循环与泌尿生殖系统）、内胚层（消化道与呼吸道上皮、肝胰）。器官发生由三个胚层分化而来。",true]]},{"kind":"p","runs":[["二、形态发生与细胞命运决定：形态发生依靠细胞的增殖、迁移、黏附变化、凋亡与分化协同完成。细胞命运由不对称分裂、诱导信号（如形态发生素浓度梯度）和基因调控网络决定；分化本质是基因的选择性表达。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"以下哪种细胞的发育潜能最高？（ ）","opts":{"A":"multipotent cells","B":"pluripotent cells","C":"monopotent cells","D":"Totipotent cells"},"ans":"D","explain":"一般情况下，在整个发育过程中，细胞分化潜能逐渐受到越来越多的限制 而变窄，即由全能性细胞转化为多能和单能干细胞，因此全能干细胞 Totipotent cells 的发育潜能最高。","src":"考点笔记·考研例题"},{"kind":"fib","stem":"在多细胞生物发育中，细胞有四种基本的行为，即：细胞增殖、细胞分化、[[0]] 和 [[1]]。","ans":[["细胞衰老"],["细胞死亡"]],"explain":"多细胞生物发育中，细胞的四种基本行为是细胞增殖、细胞分化、细胞衰老和细胞死亡。","src":"考研真题 · 中山大学 2007 年","order":"any"},{"kind":"p","runs":[["多细胞生物中，细胞不是独立存在的，细胞与其他细胞以及细胞外基质之间相 互作用。相互制约、相互依存，对细胞的存活、发育、迁移、增殖、形态以及基因的差 异表达产生重要的调控作用。请你用你所学到的细胞生物学知识阐述你对“细胞的社会 联系”的理解。",true]]},{"kind":"p","runs":[["答案：细胞通讯和信号转导是细胞社会联系的核心，社会联系的主要功能在于提供细胞之间彼此物质、信息交流的通道。（1）细胞社会联系的方式：细胞通过细胞通讯、细胞连接、细胞黏着以及细胞与胞外基质相互作用的方式，产生社会联系，具体如下：①细胞通讯：细胞通讯和信号转导是细胞社会性联系的核心内容，细胞通讯具有3种形式：细胞通过分泌化学信号进行细胞间通讯；细胞间接触依赖性通讯；动物相邻细胞间形成间隙连接、植物细胞间通过胞间连丝使细胞间相互沟通，通过交换小分子实现代谢偶联或电偶联。 ②细胞连接：细胞连接是指在细胞质膜的特化区域，通过膜蛋白、细胞骨架蛋白或者胞外基质形成的细胞与细胞之间、细胞与胞外基质之间的连接结构。根据行使功能的不同，细胞连接可分为封闭连接、锚定连接和通讯连接。 ③细胞黏着：细胞表面的细胞黏着分子都是整合膜蛋白，主要通过3种方式介导细胞识别与黏着：相邻细胞表面的同种黏着分子间的识别与黏着（同亲型结合）；相邻细胞表面的不同黏着分子间的相互识别与黏着（异亲型结合）；相邻细胞表面的同种黏着分子借助其他衔接分子的相互识别与黏着（衔接分子依赖性结合）。 ④细胞与胞外基质的相互作用：动物细胞的胞外基质成分主要有3种：结构蛋白，包括胶原和弹性蛋白，分别赋予胞外基质强度和韧性；蛋白聚糖，由蛋白质和多糖共价形成，具有高度亲水性，从而赋予胞外基质抗压的能力；黏连糖蛋白，包括纤连蛋白和层黏连蛋白，有助于细胞黏连到胞外基质上。（2）细胞社会联系的生物学意义：①细胞的社会联系体现在细胞与细胞间、细胞与胞外环境甚至机体间的相互作用、相互制约和相互依存。 ②细胞社会联系在胚胎发育、组织构建等过程中尤为重要。在胚胎发育过程中，胚胎细胞通过细胞社会的联系彼此交流信息，以决定细胞的行为和命运，包括结构与功能分化、位置以及生死抉择等。 ③细胞社会联系是组织建成、维持及修复的最主要保障。神经细胞、免疫细胞以及内分泌细胞通过社会性联系，共同参与并维持机体的稳态平衡。细胞社会联系的破坏往往导致细胞病变甚至死亡。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["简答：三胚层各发育成哪些组织器官？",false]]},{"kind":"num","runs":[["简答：形态发生的分子机制有哪些？",false]]},{"kind":"num","runs":[["简答：细胞命运决定的机制。",false]]},{"kind":"num","runs":[["论述：从受精卵到个体，细胞增殖、分化与凋亡如何协同完成发育？",false]]}]}],"n":43},{"title":"11月12日 · 发育（二）：细胞命运与模式生物","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["重点：细胞命运决定、诱导信号、模式生物。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["三、发育与干细胞的关系：早期胚胎细胞具有全能性，随发育分化潜能逐步受限；成体组织中的干细胞维持组织更新与修复。",true]]},{"kind":"p","runs":[["四、模式生物在发育研究中的应用：果蝇（体节与信号通路）、线虫（细胞谱系与凋亡）、斑马鱼（透明胚胎、活体观察）、小鼠（哺乳动物发育与基因敲除）。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"以下哪种细胞的发育潜能最高？（ ）","opts":{"A":"multipotent cells","B":"pluripotent cells","C":"monopotent cells","D":"Totipotent cells"},"ans":"D","explain":"一般情况下，在整个发育过程中，细胞分化潜能逐渐受到越来越多的限制 而变窄，即由全能性细胞转化为多能和单能干细胞，因此全能干细胞 Totipotent cells 的发育潜能最高。","src":"考点笔记·考研例题"},{"kind":"fib","stem":"在多细胞生物发育中，细胞有四种基本的行为，即：细胞增殖、细胞分化、[[0]] 和 [[1]]。","ans":[["细胞衰老"],["细胞死亡"]],"explain":"多细胞生物发育中，细胞的四种基本行为是细胞增殖、细胞分化、细胞衰老和细胞死亡。","src":"考研真题 · 中山大学 2007 年","order":"any"},{"kind":"p","runs":[["细胞生物学研究成功的关键在于运用模式生物。试举出三种生物学上常用 的模式生物，并逐一说明该模式生物在生物学研究中的用途和优势。［中科院-中科大 2009年研］",true]]},{"kind":"p","runs":[["答案：常用的模式生物及其在生物学研究中的用途和优势举例如下：（1）大肠杆菌：①用途：常用工程改良的大肠杆菌来大量扩增质粒和表达蛋白等。 ②优势：大肠杆菌是原核生物的代表，它的基因组信息量少而全，是研究原核生物的良好模式生物。此外，大肠杆菌还是良好的生物学研究工具。（2）果蝇：果蝇是昆虫的代表。 ①用途：常用果蝇来进行基因和遗传研究。如遗传规律的分析、染色体特性研究、胚胎发育的基因调控和细胞分化机制的研究、神经退行性疾病和学习、认知等领域的研究等。 ②优势：果蝇基因组信息全面，而且现有全面的针对果蝇的系统研究工具，全世界积累了大量果蝇品系，这些都对果蝇研究提供了便利。（3）小鼠：①用途：常作为哺乳动物遗传学、组织学、胚胎学和细胞生物学等研究的材料。 ②优势：小鼠是哺乳动物的模式生物，与人的亲缘关系在各种模式生物中最近，因此小鼠的研究成果在很大程度上可以推演到人类；且小鼠繁殖速度快，易于大规模饲养。",false]]},{"kind":"p","runs":[["多细胞生物中，细胞不是独立存在的，细胞与其他细胞以及细胞外基质之间相 互作用。相互制约、相互依存，对细胞的存活、发育、迁移、增殖、形态以及基因的差 异表达产生重要的调控作用。请你用你所学到的细胞生物学知识阐述你对“细胞的社会 联系”的理解。",true]]},{"kind":"p","runs":[["答案：细胞通讯和信号转导是细胞社会联系的核心，社会联系的主要功能在于提供细胞之间彼此物质、信息交流的通道。（1）细胞社会联系的方式：细胞通过细胞通讯、细胞连接、细胞黏着以及细胞与胞外基质相互作用的方式，产生社会联系，具体如下：①细胞通讯：细胞通讯和信号转导是细胞社会性联系的核心内容，细胞通讯具有3种形式：细胞通过分泌化学信号进行细胞间通讯；细胞间接触依赖性通讯；动物相邻细胞间形成间隙连接、植物细胞间通过胞间连丝使细胞间相互沟通，通过交换小分子实现代谢偶联或电偶联。 ②细胞连接：细胞连接是指在细胞质膜的特化区域，通过膜蛋白、细胞骨架蛋白或者胞外基质形成的细胞与细胞之间、细胞与胞外基质之间的连接结构。根据行使功能的不同，细胞连接可分为封闭连接、锚定连接和通讯连接。 ③细胞黏着：细胞表面的细胞黏着分子都是整合膜蛋白，主要通过3种方式介导细胞识别与黏着：相邻细胞表面的同种黏着分子间的识别与黏着（同亲型结合）；相邻细胞表面的不同黏着分子间的相互识别与黏着（异亲型结合）；相邻细胞表面的同种黏着分子借助其他衔接分子的相互识别与黏着（衔接分子依赖性结合）。 ④细胞与胞外基质的相互作用：动物细胞的胞外基质成分主要有3种：结构蛋白，包括胶原和弹性蛋白，分别赋予胞外基质强度和韧性；蛋白聚糖，由蛋白质和多糖共价形成，具有高度亲水性，从而赋予胞外基质抗压的能力；黏连糖蛋白，包括纤连蛋白和层黏连蛋白，有助于细胞黏连到胞外基质上。（2）细胞社会联系的生物学意义：①细胞的社会联系体现在细胞与细胞间、细胞与胞外环境甚至机体间的相互作用、相互制约和相互依存。 ②细胞社会联系在胚胎发育、组织构建等过程中尤为重要。在胚胎发育过程中，胚胎细胞通过细胞社会的联系彼此交流信息，以决定细胞的行为和命运，包括结构与功能分化、位置以及生死抉择等。 ③细胞社会联系是组织建成、维持及修复的最主要保障。神经细胞、免疫细胞以及内分泌细胞通过社会性联系，共同参与并维持机体的稳态平衡。细胞社会联系的破坏往往导致细胞病变甚至死亡。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["简答：三胚层各发育成哪些组织器官？",false]]},{"kind":"num","runs":[["简答：细胞命运决定的机制。",false]]}]}],"n":44},{"title":"11月13日 · 信号通路升级（画流程图）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["第 11 章是 811 高频，也是跨考生重灾区。",false]]},{"kind":"bullet","runs":[["三条线必须会画：RTK-Ras-MAPK、JAK-STAT、PLC-IP3-DAG。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、RTK-Ras-MAPK：生长因子结合受体酪氨酸激酶（RTK，如 EGFR）→ 受体二聚化与自磷酸化 → 接头蛋白 Grb2 与 SOS → Ras 由 GDP 型转为 GTP 型而激活 → Raf → MEK → ERK（MAPK）级联放大 → 入核磷酸化转录因子 → 促进增殖与分化。该通路过度激活是多种肿瘤的驱动因素。",true]]},{"kind":"p","runs":[["二、JAK-STAT：细胞因子（如干扰素、白介素）结合细胞因子受体 → 受体招募并激活 JAK 激酶 → JAK 磷酸化受体、招募 STAT → STAT 被磷酸化后形成二聚体入核 → 调控基因转录。主要介导细胞因子信号，参与免疫应答与造血调控。",true]]},{"kind":"p","runs":[["三、PLC-IP₃-DAG：配体结合 GPCR → 活化 Gq → 激活磷脂酶 C（PLC）→ 水解 PIP₂ 生成 IP₃ 与 DAG → IP₃ 使内质网释放 Ca²⁺，DAG 激活 PKC → 两条支路协同调节细胞反应（双信使系统）。",true]]},{"kind":"p","runs":[["四、答题要点：通路按配体→受体→关键酶或小G蛋白→第二信使或激酶级联→效应展开，并写出下游表型（增殖、分化、分泌、免疫）。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"PIP₂ 水解后产生哪两种第二信使？","opts":{"A":"IP₃ 与 DAG","B":"ATP 与 ADP","C":"cAMP 与 cGMP","D":"NAD⁺ 与 FAD"},"ans":"A","explain":"磷脂酶 C（PLC）水解质膜中的 PIP₂，生成水溶性的 IP₃ 与留在膜上的 DAG。IP₃ 促使内质网释放 Ca²⁺，DAG 与 Ca²⁺ 共同激活 PKC，因此二者构成双信使系统。","src":"811真题·2025"},{"kind":"p","runs":[["如何理解细胞信号转导通路的可调控性？请举例说明。",true]]},{"kind":"p","runs":[["答案：（1）通路的基本组成：以 G 蛋白偶联受体通路为例，细胞信号转导通路由配体、受体、G 蛋白、效应酶、第二信使与蛋白激酶级联组成，信号经逐级传递并逐级放大，最终引起基因表达或代谢的改变。（2）可调控性的来源：①受体水平——受体的数量、亲和力与亚型分布可调，细胞可通过受体的上调或下调改变对信号的敏感程度；②G 蛋白水平——G 蛋白在 GTP 结合的活化态与 GDP 结合的失活态之间循环，其开关速率受 GEF 与 GAP 调控；③第二信使水平——cAMP、IP₃、Ca²⁺ 等的合成与降解速率决定信号的强度与持续时间；④磷酸化水平——蛋白激酶与蛋白磷酸酶作用相反，磷酸化与去磷酸化的平衡决定底物的活性状态；⑤反馈与限制——下游产物可反馈抑制上游组分，抑制蛋白与支架蛋白使信号具有时空特异性。（3）举例：①cAMP 通路中 Gs 与 Gi 的拮抗，Gs 激活腺苷酸环化酶使 cAMP 升高，Gi 则抑制之，同一刺激可通过不同 G 蛋白给出相反结果；②RTK 通路的 Ras-MAPK 级联，生长因子受体激活 Ras，再逐级激活 Raf、MEK、ERK，ERK 进入细胞核调节基因表达，同时通过负反馈去磷酸化限制信号强度；③霍乱毒素使 Gs 持续活化，cAMP 长期升高，肠道上皮细胞大量分泌 Cl⁻ 与水，引起剧烈腹泻，是调控失效的典型例证。（4）结论：细胞信号转导通路不是固定的单向线路，而是由受体、G 蛋白、第二信使、激酶与磷酸酶构成的可调、可放大、可整合并具有反馈调节的网络，使细胞对刺激作出适时、适度的反应。",false]]},{"kind":"mcq","stem":"下列蛋白质中，合成前期具有信号肽的是（）。","opts":{"A":"微管蛋白","B":"肌动蛋白","C":"停泊蛋白","D":"都不对"},"ans":"C","explain":"C项，停泊蛋白是位于粗面内质网膜上信号识别颗粒的受体，其合成前期 具有信号肽。ABD 三项在合成前期不具有信号肽。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"一氧化氮作用于血管平滑肌时，直接激活的受体或酶是（ ）。","opts":{"A":"G 蛋白偶联受体","B":"可溶性鸟苷酸环化酶","C":"腺苷酸环化酶","D":"受体酪氨酸激酶"},"ans":"B","explain":"NO 是脂溶性气体信号分子，可扩散进入邻近的平滑肌细胞，直接激活可溶性鸟苷酸环化酶，使 GTP 生成 cGMP；cGMP 激活 PKG，引起平滑肌舒张。硝酸甘油缓解心绞痛，本质上就是增加 NO 信号。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"动物细胞内促使内质网储存 Ca²⁺ 释放的第二信使是（ ）。","opts":{"A":"IP₃","B":"DAG","C":"cAMP","D":"cGMP"},"ans":"A","explain":"IP₃ 是水溶性第二信使，可扩散到内质网并打开 IP₃ 受体钙通道，使 Ca²⁺ 从内质网钙库释放。DAG 留在质膜上，负责与 Ca²⁺ 共同激活 PKC，不能代替 IP₃ 直接打开内质网钙通道。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["简答：画出并说明 EGFR-Ras-MAPK 通路。",false]]},{"kind":"num","runs":[["简答：JAK-STAT 通路的组成与功能。",false]]},{"kind":"num","runs":[["简答：PLC-IP₃-DAG 双信使系统的信号链。",false]]},{"kind":"num","runs":[["论述：信号通路的基本特征，并比较 cAMP 与磷脂酰肌醇通路的异同。",false]]}]}],"n":45},{"title":"11月14日 · 机动复习：背诵主线","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["把一条主线从头串到尾。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"bullet","runs":[["膜系统线：膜脂→膜蛋白→流动性→跨膜运输→胞吞胞吐→膜泡→高尔基→溶酶体→信号。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"bullet","runs":[["串的时候说出每一步的关键名词。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["口述膜系统主线，限时 5 分钟。",false]]}]}],"n":46},{"title":"休息日","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["今天休息，不安排新内容。如果还有余力，可以花 10 分钟翻一遍昨天学的内容。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["（休息日无背诵任务，好好放松。）",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["——",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"p","runs":[["——",false]]}]}],"n":47},{"title":"11月16日 · 光合作用与叶绿体","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["2022—2023 年真题的名词解释直接考了光合作用、光反应、暗反应——这是我之前判断失误的地方，这一块必须补。",false]]},{"kind":"bullet","runs":[["811 大纲第 4 章把叶绿体单列为细胞器，命题也确实覆盖。",false]]},{"kind":"bullet","runs":[["同时它常与线粒体、能量转换、半自主性放在一起比较，是很好的论述题素材。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、叶绿体的结构",true]]},{"kind":"p","runs":[["叶绿体由双层膜包被。内膜围成的基质中含有光合作用暗反应（卡尔文循环）所需的酶、叶绿体 DNA 与核糖体，因此叶绿体也是半自主性细胞器。内膜以内的类囊体（由类囊体膜形成的扁平囊）可堆叠形成基粒，类囊体膜上分布着光系统 I、光系统 II、电子传递链与 ATP 合酶，是光反应的场所。",false]]},{"kind":"p","runs":[["二、光合作用总反应",true]]},{"kind":"p","runs":[["6CO₂ + 12H₂O → C₆H₁₂O₆ + 6O₂ + 6H₂O，分为光反应与暗反应两个阶段。",false]]},{"kind":"p","runs":[["三、光反应（类囊体膜上）",true]]},{"kind":"p","runs":[["光系统 II（P680）吸收光能，光解水产生 O₂ 与电子；电子沿电子传递链传给光系统 I（P700），传递过程中把质子泵入类囊体腔形成质子动力势；质子经 ATP 合酶回流驱动 ATP 合成。光系统 I 的电子最终传递给 NADP⁺ 生成 NADPH。这一过程因电子传递路径闭合与否，分为非循环光合磷酸化（同时产生 ATP 与 NADPH，并释放 O₂）与循环光合磷酸化（只产生 ATP，不产生 NADPH 与 O₂）。",false]]},{"kind":"p","runs":[["四、暗反应（卡尔文循环，基质中）",true]]},{"kind":"p","runs":[["分三步：CO₂ 固定——CO₂ 与 RuBP 在核酮糖二磷酸羧化酶（Rubisco）催化下生成 3-磷酸甘油酸；还原——利用光反应产生的 ATP 与 NADPH 把 3-磷酸甘油酸还原为三碳糖；RuBP 再生——部分三碳糖用于再生 RuBP，使循环持续。暗反应本身不直接需要光，但依赖光反应提供的 ATP 与 NADPH。",false]]},{"kind":"p","runs":[["五、与线粒体氧化磷酸化的比较",true]]},{"kind":"p","runs":[["相同点：都利用电子传递链建立质子动力势，由 ATP 合酶合成 ATP；都有半自主性。不同点：叶绿体的电子来源是水的光解，最终电子受体是 NADP⁺，产生 NADPH 并释放 O₂；线粒体的电子来自有机物的氧化，最终电子受体是 O₂，生成水。",false]]},{"kind":"p","runs":[["写光合作用时按「场所 → 光能吸收与电子传递 → 质子动力势 → ATP／NADPH → 暗反应固碳」这条链条写，最后点明两个阶段相互依存。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"线粒体各部位都有其特异的标志酶，其中内膜的标志酶是（）。","opts":{"A":"细胞色素氧化酶","B":"单胺氧化酶","C":"腺苷酸激酶","D":"柠檬酸合成酶"},"ans":"A","explain":"B项，单胺氧化酶是线粒体外膜标志酶。C项，腺苷酸激酶是膜间隙标志 酶。D项，柠檬酸合成酶是代谢标志酶，位于线粒体基质中。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"线粒体的细胞色素c是一种（ ）。","opts":{"A":"内膜固有蛋白","B":"内膜外周蛋白","C":"基质可溶性蛋白","D":"外膜固有蛋白"},"ans":"A","explain":"电子传递链中的各组分位于线粒体内膜，是4 种膜蛋白复合物。其中细 胞色素c是复合物［的重要组分。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"叶绿体基因组平均含有（ ）单拷贝序列。","opts":{"A":"24kb","B":"120kb","C":"200kb","D":"240kb"},"ans":"B","explain":"叶绿体基因组平均含有 120kb 单拷贝序列，按照大约 1kb 相当一个基因 估计，可编码 100 个左右的基因，包括编码蛋白质的基因、tRNA 基因以及 rRNA 基因 等。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"核酮糖二磷酸羧化酶大亚基和小亚基分别由（ ）DNA 上的基因编码。","opts":{"A":"细胞核","B":"叶绿体","C":"细胞核和叶绿体","D":"叶绿体和细胞核"},"ans":"D","explain":"核酮糖二磷酸羧化酶是光合作用中一个起重要作用的酶系统，全酶由8个 大亚基和8个小亚基组成。已知酶的活性中心位于大亚基上，小亚基只有调节功能。 大亚基由叶绿体基因编码，而小亚基则是由核基因编码。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列 4 种色素中，哪个（或哪些）具有吸收聚集光能的作用而无光化学 活性？","opts":{"A":"细胞色素","B":"质体蓝素","C":"质体醌","D":"聚光色素"},"ans":"D","explain":"聚光色素吸收聚集光能并将光能转移到反应中心色素，其本身不具有光化 学活性。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：光合作用、光反应、暗反应、基粒、类囊体、半自主性细胞器。",false]]},{"kind":"num","runs":[["简答：光反应的场所、过程与产物。",false]]},{"kind":"num","runs":[["简答：卡尔文循环的三个阶段。",false]]},{"kind":"num","runs":[["论述：比较叶绿体的光合磷酸化与线粒体的氧化磷酸化。",false]]},{"kind":"num","runs":[["简答：为什么叶绿体是半自主性细胞器？",false]]}]}],"n":48},{"title":"11月17日 · 分子层面交叉考点（一）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["811 的名词解释里混入了大量分子生物学与生物化学概念，跨考生如果只按细胞生物学教材复习会直接丢分。",false]]},{"kind":"bullet","runs":[["好消息是：这些概念大多只需标准定义加一句机制，性价比很高。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["RNAi（RNA 干扰）",true]]},{"kind":"p","runs":[["双链 RNA 进入细胞后被 Dicer 切割成小干扰 RNA（siRNA），siRNA 装配进 RNA 诱导沉默复合体（RISC），引导复合体识别并降解与之互补的 mRNA，从而特异性地抑制基因表达。是研究基因功能的重要工具。",false]]},{"kind":"p","runs":[["酶的活性中心",true]]},{"kind":"p","runs":[["酶分子中直接与底物结合并催化底物发生化学反应的区域，由少数氨基酸残基构成，其空间构象决定酶的专一性与催化活性。",false]]},{"kind":"p","runs":[["分子伴侣",true]]},{"kind":"p","runs":[["一类帮助蛋白质正确折叠、组装、转运，并防止蛋白质错误聚集或降解的蛋白质，如 Hsp70、Hsp60、内质网中的 Bip。它们不改变被帮助蛋白的氨基酸序列。",false]]},{"kind":"p","runs":[["转染",true]]},{"kind":"p","runs":[["把外源核酸（DNA 或 RNA）导入真核细胞的技术，常用方法有脂质体介导、磷酸钙共沉淀、电穿孔等，用于基因表达研究、基因功能验证与基因治疗研究。",false]]},{"kind":"p","runs":[["表观遗传学",true]]},{"kind":"p","runs":[["在不改变 DNA 碱基序列的前提下，基因表达发生可遗传改变的现象与研究领域，主要机制包括 DNA 甲基化、组蛋白修饰、染色质重塑与非编码 RNA 调控。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"一个蛋白质同时带有 N 端内质网定位序列与 C 端过氧化物酶体定位序列，合成后最终定位在","opts":{"A":"内质网","B":"细胞质","C":"过氧化物酶体","D":"细胞核"},"ans":"A","explain":"共翻译转运先于后翻译转运发生，蛋白质先被引导进入内质网。","src":"811真题·2024"},{"kind":"mcq","stem":"蛋白酶在高尔基体内水解的底物不包括（）。","opts":{"A":"含不同信号序列的蛋白质","B":"没有生物活性的蛋白原","C":"含多个重复序列的多肽","D":"被泛素化的蛋白质"},"ans":"D","explain":"很多多肽激素和神经多肽转运到高尔基体的 TGN 或者 TGN 形成的分泌小 泡时，可以经过特异的水解最终形成有活性的多肽，主要包括：①没有生物活性的蛋白 原；②含有多个氨基酸序列的前体，经过加工后形成有活性的多肽；③一个蛋自质分子 的前体中含有不同的信号序列，最后加工成不同的产物。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"线粒体各部位都有其特异的标志酶，其中内膜的标志酶是（）。","opts":{"A":"细胞色素氧化酶","B":"单胺氧化酶","C":"腺苷酸激酶","D":"柠檬酸合成酶"},"ans":"A","explain":"B项，单胺氧化酶是线粒体外膜标志酶。C项，腺苷酸激酶是膜间隙标志 酶。D项，柠檬酸合成酶是代谢标志酶，位于线粒体基质中。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"核酮糖二磷酸羧化酶大亚基和小亚基分别由（ ）DNA 上的基因编码。","opts":{"A":"细胞核","B":"叶绿体","C":"细胞核和叶绿体","D":"叶绿体和细胞核"},"ans":"D","explain":"核酮糖二磷酸羧化酶是光合作用中一个起重要作用的酶系统，全酶由8个 大亚基和8个小亚基组成。已知酶的活性中心位于大亚基上，小亚基只有调节功能。 大亚基由叶绿体基因编码，而小亚基则是由核基因编码。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"有活性的 CDK1 激酶符合下列何种描述？","opts":{"A":"与周期蛋白以复合物形式存在","B":"Thr161 去磷酸化","C":"Thr14 和 Tyr15 磷酸化","D":"与之结合的周期蛋白泛素化"},"ans":"A","explain":"CDK 激酶激活的途径包括：① CDK 蛋白本身不具有蛋白激酶活性；②当 周期蛋白 B/A 含量积累到一定值时，二者相互结合形成复合体，但不表现出激酶活性； 88 周期蛋白与 CDK 的结合是 CDK 激酶活性表现的先决条件；③在 weel/mikl 和 CAK 激 酶的催化下，CDK 的 Thrl4、Tyr15、Thr161 磷酸化，形成高度磷酸化的周期蛋白 CDK 复合体，但仍不具备激酶活性：④在磷酸酶 Cdc25C 的催化下，Thr14 和 Tyr15 去磷 酸化，CDK 激酶活性才能表现出来。Thr161 位点保持磷酸化状态是 CDK1 激酶活性表 现所必需的前提。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：RNAi、酶的活性中心、分子伴侣、转染、表观遗传学、温伯格效应。",false]]},{"kind":"num","runs":[["简答：他汀类药物的作用原理。",false]]},{"kind":"num","runs":[["简答：胆固醇的合成与代谢调节（SREBP-SCAP）。",false]]},{"kind":"num","runs":[["简答：CRISPR-Cas9 的原理与应用。",false]]},{"kind":"num","runs":[["简答：非编码 RNA 的种类与功能。",false]]},{"kind":"num","runs":[["写出精氨酸、赖氨酸、天冬氨酸的英文全称、三字母与单字母缩写。",false]]}]}],"n":49},{"title":"11月18日 · 分子层面交叉考点（二）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["继续背剩下的名词：CRISPR、非编码 RNA、乒乓反应、温伯格效应、他汀类与胆固醇代谢。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["非编码 RNA",true]]},{"kind":"p","runs":[["不编码蛋白质的 RNA，包括 rRNA、tRNA、miRNA、siRNA、lncRNA 等，广泛参与基因表达调控、剪接、翻译与染色质修饰等过程。",false]]},{"kind":"p","runs":[["CRISPR-Cas9 与基因编辑",true]]},{"kind":"p","runs":[["由向导 RNA 通过碱基互补引导 Cas9 核酸酶定位到特定 DNA 序列并切割双链，从而实现在特定位点插入、删除或替换基因的编辑技术，广泛用于功能基因研究与疾病模型构建。",false]]},{"kind":"p","runs":[["乒乓反应",true]]},{"kind":"p","runs":[["双底物酶促反应的一种机制：酶先结合第一个底物并释放第一个产物，同时酶被修饰（如转氨酶接受氨基），再结合第二个底物并把修饰基团转移给它，释放第二个产物。典型例子是转氨酶催化的反应。",false]]},{"kind":"p","runs":[["温伯格效应（Warburg 效应）",true]]},{"kind":"p","runs":[["肿瘤细胞即使在氧气充足时也主要进行糖酵解、产生乳酸的代谢特征，为肿瘤快速增殖提供生物合成原料并适应缺氧微环境。",false]]},{"kind":"p","runs":[["他汀类药物与胆固醇代谢",true]]},{"kind":"p","runs":[["他汀类药物抑制 HMG-CoA 还原酶，阻断胆固醇合成的限速步骤，从而降低血液胆固醇水平。细胞内胆固醇水平受 SREBP-SCAP 系统反馈调节：胆固醇不足时 SREBP 被运入核内促进 LDL 受体与合成酶基因表达，胆固醇充足时该通路被抑制。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["组蛋白与非组蛋白如何参与表观遗传的调控？",true]]},{"kind":"p","runs":[["答案：表观遗传是指由非 DNA 序列变化引起的表型变化，主要是由 DNA 化学修饰导致的。（1）组蛋白主要参与核小体形成，形成染色质的高级结构，位于核小体上DNA 的转录活性受组蛋白和 DNA 间结合状态的影响。组蛋白通过甲基化、乙酰化和磷酸化改变与 DNA 的结合，当二者之间的结合变紧密时，基因转录活性下降或不能转录；当二者之间的结合变疏松时，基因转录活性增强或激活，从而影响表观遗传。（2）非组蛋白可以和 DNA 上的特异位点结合，引起DNA 构象变化，导致DNA 和其他非组蛋白及组蛋白的结合发生变化，最终促使 DNA 解螺旋。DNA 和组蛋白分离使染色质结构疏松：或相反，引起基因的失活或激活，从而影响表观遗传。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：RNAi、酶活性中心、分子伴侣、转染、表观遗传学。",false]]},{"kind":"num","runs":[["简答：他汀类药物的原理；胆固醇的合成与代谢调节。",false]]}]}],"n":50},{"title":"11月19日 · 选择题专项（一）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs" clinA 参与 S 期与 M 期调控；cyclin 的降解由 APC 介导的泛素化途径完成，使细胞退出分裂。",false]]},{"kind":"p","runs":[["为什么艾滋病患者常死于其他感染性疾病？",true]]},{"kind":"p","runs":[["答案：HIV 通过 gp120结合 CD4与 CCR5/CXCR4侵入并破坏 CD4⁺T 细胞，使辅助性 T 细胞大量减少；细胞免疫与体液免疫失去协调，机体对条件致病菌和肿瘤无法产生有效应答，因而常死于机会性感染。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["闭卷写出 2024 年 6 道简答的完整答案。",false]]}]}],"n":59},{"title":"11月28日 · 真题精练（六）：2024 论述","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["三道论述题各写一次三段式。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["人造细胞",true]]},{"kind":"p","runs":[["以最小基因组细胞与自下而上构建的囊泡体系为代表，通过基因组设计合成、膜系统组装与微流控技术构建具有生命特征的细胞样体系；可应用于药物递送、生物制造与疾病模型。",false]]},{"kind":"p","runs":[["镰刀型贫血与疟疾",true]]},{"kind":"p","runs":[["血红蛋白β链第6位谷氨酸变缬氨酸使红细胞镰变；杂合个体因镰状红细胞不利于疟原虫寄生而具有抗疟优势，故突变等位基因在疟疾流行区（西非）频率更高。",false]]},{"kind":"p","runs":[["信号转导通路可调控性",true]]},{"kind":"p","runs":[["通过受体数量与亲和力、G蛋白GTP/GDP开关、第二信使浓度、磷酸化去磷酸化及反馈环路调节；如Gs与Gi对cAMP的拮抗、RTK级联的负反馈去磷酸化。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["谈谈你对人造细胞的理解，包括研究现状、未来发展方向与潜在应用。",true]]},{"kind":"p","runs":[["答案：（1）内涵：人造细胞是指用人工手段构建的、具有细胞最基本生命特征的细胞或细胞样体系。细胞是生命活动的基本单位，其基本结构包括以磷脂双分子层为基础的膜系统、以 DNA 或 RNA 为载体的遗传装置、以蛋白质为主要执行者的物质与能量代谢系统，人造细胞的研究即围绕这三个基本要素展开。（2）研究现状：①自上而下的路线——通过基因组的简化与移植获得最小基因组细胞，如支原体基因组的化学合成与移植，得到能够自我复制的最小细胞，用于确定生命的必需基因；②自下而上的路线——以磷脂囊泡为框架，装入含转录、翻译与代谢所需组分的无细胞体系，构建具有基因表达、物质合成乃至简单分裂行为的原细胞模型；③关键技术包括基因组的设计与化学合成、膜系统的体外组装、无细胞表达体系与微流控技术。（3）发展方向：提高体系的自主性，使其能自主摄取营养、维持代谢稳态并实现自我复制；由单一功能走向多功能集成，能够感知外界信号并作出响应；阐明膜生长、基因表达与代谢之间的自组织与协调机制。（4）潜在应用与问题：可用于药物递送载体、生物制造平台、疾病模型与人工生命研究；面临的问题包括体系自组织的复杂性、基因组与体系的稳定性、伦理与生物安全争议。（5）结论：人造细胞是细胞生物学与合成生物学交叉的前沿方向，既是检验“细胞如何运作”这一基本问题的实验手段，也具有重要的应用价值，目前仍处于构建原型体系并逐步提高其生命特征的阶段。",false]]},{"kind":"p","runs":[["血红蛋白突变导致镰刀型贫血。携带突变等位基因的个体更容易还是更不容易感染疟原虫？西非与欧洲哪个地区的突变等位基因频率更高？",true]]},{"kind":"p","runs":[["答案：带突变等位基因的杂合个体更不容易感染恶性疟原虫，因镰状红细胞不利于疟原虫寄生，呈现杂合子优势；因此疟疾流行区（西非）的突变等位基因频率明显高于非流行区（欧洲）。",false]]},{"kind":"p","runs":[["如何理解细胞信号转导通路的可调控性？请举例说明。",true]]},{"kind":"p","runs":[["答案：（1）通路的基本组成：以 G 蛋白偶联受体通路为例，细胞信号转导通路由配体、受体、G 蛋白、效应酶、第二信使与蛋白激酶级联组成，信号经逐级传递并逐级放大，最终引起基因表达或代谢的改变。（2）可调控性的来源：①受体水平——受体的数量、亲和力与亚型分布可调，细胞可通过受体的上调或下调改变对信号的敏感程度；②G 蛋白水平——G 蛋白在 GTP 结合的活化态与 GDP 结合的失活态之间循环，其开关速率受 GEF 与 GAP 调控；③第二信使水平——cAMP、IP₃、Ca²⁺ 等的合成与降解速率决定信号的强度与持续时间；④磷酸化水平——蛋白激酶与蛋白磷酸酶作用相反，磷酸化与去磷酸化的平衡决定底物的活性状态；⑤反馈与限制——下游产物可反馈抑制上游组分，抑制蛋白与支架蛋白使信号具有时空特异性。（3）举例：①cAMP 通路中 Gs 与 Gi 的拮抗，Gs 激活腺苷酸环化酶使 cAMP 升高，Gi 则抑制之，同一刺激可通过不同 G 蛋白给出相反结果；②RTK 通路的 Ras-MAPK 级联，生长因子受体激活 Ras，再逐级激活 Raf、MEK、ERK，ERK 进入细胞核调节基因表达，同时通过负反馈去磷酸化限制信号强度；③霍乱毒素使 Gs 持续活化，cAMP 长期升高，肠道上皮细胞大量分泌 Cl⁻ 与水，引起剧烈腹泻，是调控失效的典型例证。（4）结论：细胞信号转导通路不是固定的单向线路，而是由受体、G 蛋白、第二信使、激酶与磷酸酶构成的可调、可放大、可整合并具有反馈调节的网络，使细胞对刺激作出适时、适度的反应。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["论述：谈谈你对人造细胞的理解。",false]]},{"kind":"num","runs":[["论述：镰刀型贫血的突变为什么在疟疾流行区频率更高？",false]]},{"kind":"num","runs":[["论述：如何理解信号转导通路的可调控性？",false]]}]}],"n":60},{"title":"休息日","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["今天休息，不安排新内容。如果还有余力，可以花 10 分钟翻一遍昨天学的内容。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["（休息日无背诵任务，好好放松。）",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["——",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"p","runs":[["——",false]]}]}],"n":61},{"title":"11月30日 · 真题精练（七）：2025 选择题与解答题","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["2025 回忆版缺选择题，重点吃透解答题。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["细胞的共同特征",true]]},{"kind":"p","runs":[["化学组成相似；由质膜构成的脂-蛋白体系；DNA-RNA遗传装置；核糖体合成蛋白质；以分裂方式增殖；进行物质与能量代谢。",false]]},{"kind":"p","runs":[["氨基酸缩写",true]]},{"kind":"p","runs":[["精氨酸 Arginine，Arg，R；赖氨酸 Lysine，Lys，K；天冬氨酸 Aspartic acid，Asp，D。",false]]},{"kind":"p","runs":[["网格蛋白介导的内吞泡形成",true]]},{"kind":"p","runs":[["配体与受体结合→网格蛋白在质膜内表面装配成衣被→质膜内陷出芽形成有被小泡→脱去网格蛋白→与内体融合。",false]]},{"kind":"p","runs":[["染色质种类及特点",true]]},{"kind":"p","runs":[["常染色质结构疏松、有转录活性；异染色质结构致密、基本无活性，分结构型（组成型）与兼性异染色质。",false]]},{"kind":"p","runs":[["平行转化的三种方法",true]]},{"kind":"p","runs":[["转化（感受态细胞摄取游离DNA）、接合（F质粒介导）、转导（噬菌体介导）。",false]]},{"kind":"p","runs":[["抗体结构",true]]},{"kind":"p","runs":[["抗体由两条重链和两条轻链组成，分Fab段（抗原结合）与Fc段（介导效应）；Fab含可变区，决定抗原特异性。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"PIP₂ 水解后产生哪两种第二信使？","opts":{"A":"IP₃ 与 DAG","B":"ATP 与 ADP","C":"cAMP 与 cGMP","D":"NAD⁺ 与 FAD"},"ans":"A","explain":"磷脂酶 C（PLC）水解质膜中的 PIP₂，生成水溶性的 IP₃ 与留在膜上的 DAG。IP₃ 促使内质网释放 Ca²⁺，DAG 与 Ca²⁺ 共同激活 PKC，因此二者构成双信使系统。","src":"811真题·2025"},{"kind":"mcq","stem":"伪足和片足主要由什么构成","opts":{"A":"微丝","B":"微管","C":"中间丝","D":"胶原纤维"},"ans":"A","explain":"片状伪足与丝状伪足由肌动蛋白微丝聚合形成。","src":"811真题·2025"},{"kind":"mcq","stem":"p53 与 KRAS 的突变类型分别是","opts":{"A":"都属抑癌基因突变","B":"p53 为抑癌基因失活型，KRAS 为原癌基因激活型","C":"p53 为激活型，KRAS 为失活型","D":"都属原癌基因激活型"},"ans":"B","explain":"p53 是抑癌基因，失活后丧失监视功能；KRAS 是原癌基因，激活突变后持续传递增殖信号。","src":"811真题·2025"},{"kind":"p","runs":[["蛋白质结构与功能的关系，并举例说明其在细胞内的作用。",true]]},{"kind":"p","runs":[["答案：蛋白质的功能由其结构决定，结构又由一级结构决定。（1）一级结构决定高级结构与功能：氨基酸序列经折叠形成特定的二级、三级和四级结构，序列一旦改变就可能改变功能。例如血红蛋白 β 链第6位谷氨酸被缬氨酸取代后成为镰状细胞血红蛋白，红细胞在低氧时变为镰刀状并易破裂，引起镰状细胞贫血。（2）空间构象与结构域决定功能：蛋白质的功能由其空间构象和特定区域决定，酶的活性中心决定催化的专一性，跨膜结构域决定蛋白质能否镶嵌于膜内并形成通道，马达结构域决定其水解 ATP 并产生机械运动。（3）组装与构象变化实现功能：微丝蛋白与微管蛋白组装成细胞骨架，承担支撑与物质运输；钠钾泵通过磷酸化与去磷酸化引起的构象变化实现逆浓度梯度的离子转运；血红蛋白通过构象变化实现氧的结合与释放。（4）结论：结构是功能的物质基础，结构改变或破坏（变性）时功能随之改变或丧失。",false]]},{"kind":"p","runs":[["细胞膜的结构与功能，以及它在维持细胞内环境稳定中的作用。",true]]},{"kind":"p","runs":[["答案：结构——磷脂双分子层为骨架、膜蛋白镶嵌分布、具流动性、不对称性与选择透过性；功能——物质运输、信息传递、细胞识别、连接与酶结合位点；内环境稳定——通过选择性运输控制离子与代谢物进出、钠钾泵维持膜电位与渗透平衡、膜受体接收信号调节代谢，使细胞内环境保持相对稳定。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["写出精氨酸、赖氨酸、天冬氨酸的英文全称、三字母与单字母缩写。",false]]},{"kind":"num","runs":[["简答：染色质的种类及其特点。",false]]}]}],"n":62},{"title":"12月1日 · 真题精练（八）：2025 大题 + 真题复盘","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["把三年真题的考点标到章节框架上，重复出现的即为必考。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind" 胞PD-1抑制免疫杀伤，PD-1/PD-L1抑制剂恢复T细胞活性。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"PIP₂ 水解后产生哪两种第二信使？","opts":{"A":"IP₃ 与 DAG","B":"ATP 与 ADP","C":"cAMP 与 cGMP","D":"NAD⁺ 与 FAD"},"ans":"A","explain":"磷脂酶 C（PLC）水解质膜中的 PIP₂，生成水溶性的 IP₃ 与留在膜上的 DAG。IP₃ 促使内质网释放 Ca²⁺，DAG 与 Ca²⁺ 共同激活 PKC，因此二者构成双信使系统。","src":"811真题·2025"},{"kind":"p","runs":[["如何理解细胞信号转导通路的可调控性？请举例说明。",true]]},{"kind":"p","runs":[["答案：（1）通路的基本组成：以 G 蛋白偶联受体通路为例，细胞信号转导通路由配体、受体、G 蛋白、效应酶、第二信使与蛋白激酶级联组成，信号经逐级传递并逐级放大，最终引起基因表达或代谢的改变。（2）可调控性的来源：①受体水平——受体的数量、亲和力与亚型分布可调，细胞可通过受体的上调或下调改变对信号的敏感程度；②G 蛋白水平——G 蛋白在 GTP 结合的活化态与 GDP 结合的失活态之间循环，其开关速率受 GEF 与 GAP 调控；③第二信使水平——cAMP、IP₃、Ca²⁺ 等的合成与降解速率决定信号的强度与持续时间；④磷酸化水平——蛋白激酶与蛋白磷酸酶作用相反，磷酸化与去磷酸化的平衡决定底物的活性状态；⑤反馈与限制——下游产物可反馈抑制上游组分，抑制蛋白与支架蛋白使信号具有时空特异性。（3）举例：①cAMP 通路中 Gs 与 Gi 的拮抗，Gs 激活腺苷酸环化酶使 cAMP 升高，Gi 则抑制之，同一刺激可通过不同 G 蛋白给出相反结果；②RTK 通路的 Ras-MAPK 级联，生长因子受体激活 Ras，再逐级激活 Raf、MEK、ERK，ERK 进入细胞核调节基因表达，同时通过负反馈去磷酸化限制信号强度；③霍乱毒素使 Gs 持续活化，cAMP 长期升高，肠道上皮细胞大量分泌 Cl⁻ 与水，引起剧烈腹泻，是调控失效的典型例证。（4）结论：细胞信号转导通路不是固定的单向线路，而是由受体、G 蛋白、第二信使、激酶与磷酸酶构成的可调、可放大、可整合并具有反馈调节的网络，使细胞对刺激作出适时、适度的反应。",false]]},{"kind":"mcq","stem":"一氧化氮作用于血管平滑肌时，直接激活的受体或酶是（ ）。","opts":{"A":"G 蛋白偶联受体","B":"可溶性鸟苷酸环化酶","C":"腺苷酸环化酶","D":"受体酪氨酸激酶"},"ans":"B","explain":"NO 是脂溶性气体信号分子，可扩散进入邻近的平滑肌细胞，直接激活可溶性鸟苷酸环化酶，使 GTP 生成 cGMP；cGMP 激活 PKG，引起平滑肌舒张。硝酸甘油缓解心绞痛，本质上就是增加 NO 信号。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"动物细胞内促使内质网储存 Ca²⁺ 释放的第二信使是（ ）。","opts":{"A":"IP₃","B":"DAG","C":"cAMP","D":"cGMP"},"ans":"A","explain":"IP₃ 是水溶性第二信使，可扩散到内质网并打开 IP₃ 受体钙通道，使 Ca²⁺ 从内质网钙库释放。DAG 留在质膜上，负责与 Ca²⁺ 共同激活 PKC，不能代替 IP₃ 直接打开内质网钙通道。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["闭卷画三条通路流程图并标注关键分子。",false]]},{"kind":"num","runs":[["论述：EGFR 突变与耐药机制。",false]]}]}],"n":69},{"title":"12月8日 · 机动复习：整卷回顾","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["把做过的整卷再翻一遍。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"bullet","runs":[["只看得分点与失分点，不做新题。",false]]}]},{"key":"exam"  和 [[1]]。","ans":[["脂质","膜脂","脂类"],["蛋白质","膜蛋白"]],"explain":"细胞质膜又称细胞膜，是包围在细胞最外层、由脂质、蛋白质和糖类组成的生物膜，其中主要包括脂质（膜脂）和蛋白质（膜蛋白）两类化学成分。","src":"考研真题 · 安徽师范大学 2017 年","order":"any"},{"kind":"fib","stem":"细胞膜的膜脂主要有三种：[[0]]、[[1]] 和 [[2]]。","ans":[["磷脂"],["鞘脂","鞘磷脂"],["固醇","胆固醇"]],"explain":"膜脂是生物膜的基本组成成分，约占膜总量的一半，主要有磷脂、鞘脂和固醇三大类。","src":"考研真题 · 中南大学 2012 年 / 中国科学院大学 2018 年","order":"any"},{"kind":"p","runs":[["第4章 物质的跨膜运输",true]]},{"kind":"fib","stem":"根据激活信号的不同，离子通道可分为[[0]]、[[1]] 和 [[2]]。","ans":[["电压门控通道","电压门通道"],["配体门控通道","配体门通道"],["应力激活通道"]],"explain":"离子通道有两个显著特征：一是具有极高的转运速率；二是并非连续开放，而是门控的。根据激活信号的不同，离子通道可分为电压门控通道、配体门控通道和应力激活通道。","src":"考研真题 · 中国科学院大学 2018 年","order":"any"},{"kind":"fib","stem":"在大分子与颗粒性物质跨膜运输中，胞饮泡的形成需要[[0]]，而吞噬泡的形成需要[[1]]。","ans":[["网格蛋白"],["微丝及其结合蛋白","微丝和微丝结合蛋白","微丝"]],"explain":"胞饮泡的形成需要网格蛋白参与形成包被；吞噬泡的形成则需要微丝及其结合蛋白的参与。","src":"考研真题 · 南京师范大学 2005 年"},{"kind":"p","runs":[["第5章 细胞质基质与内膜系统",true]]},{"kind":"fib","stem":"溶酶体的识别标志酶是[[0]]；微体的识别标志酶是[[1]]。","ans":[["酸性水解酶","酸性磷酸酶"],["过氧化氢酶","触酶"]],"explain":"溶酶体含有大量酸性水解酶，以维持其酸性环境并保证正常功能；微体即过氧化物酶体，含有过氧化氢酶。","src":"考研真题 · 湖南大学 2007 年"},{"kind":"p","runs":[["第8章 细胞骨架",true]]},{"kind":"fib","stem":"广义的细胞骨架包括[[0]]、[[1]]、[[2]] 及[[3]]，它们一起构成了高等动物的纤维网络结构。","ans":[["细胞核骨架"],["细胞质骨架"],["细胞膜骨架"],["细胞外基质"]],"explain":"广义的细胞骨架包括细胞核骨架、细胞质骨架、细胞膜骨架和细胞外基质；狭义的细胞骨架指细胞质骨架，由微丝、微管和中间纤维组成。","src":"考研真题 · 浙江师范大学 2011 年 / 安徽师范大学 2019 年","order":"any"},{"kind":"fib","stem":"纤毛具有[[0]]结构，通过微管上结合的[[1]]分解[[2]]造成微管间的[[3]]。","ans":[["“9+2”排列的平行微管","9+2排列的平行微管","9+2"],["ATP酶","ATP水解酶"],["ATP"],["二联管解聚","解聚"]],"explain":"纤毛具有“9+2”排列的平行微管结构，通过微管上结合的 ATP 酶分解 ATP，造成微管间的二联管解聚，从而使纤毛弯曲摆动。","src":"考研真题 · 南京师范大学 2008 年"},{"kind":"fib","stem":"微丝是指真核细胞中由[[0]]组成、直径为[[1]]的骨架纤维。","ans":[["肌动蛋白","球形肌动蛋白","纤维状肌动蛋白"],["7nm","7 nm","7纳米"]],"explain":"微丝又称肌动蛋白丝，是由肌动蛋白组成的、直径为 7nm 的骨架纤维，存在于所有真核细胞中。","src":"考研真题 · 郑州大学 2007 年"},{"kind":"p","runs":[["第10章 核糖体",true]]},{"kind":"fib","stem":"蛋白质合成的三大步骤是：[[0]]、[[1]] 和 [[2]]。","ans":[["肽链合成的起始","起始"],["肽链的延伸","延伸"],["肽链的终止","终止"]],"explain":"蛋白质合成分为肽链合成的起始、肽链的延伸和肽链的终止三大步骤。","src":"考研真题 · 复旦大学 2019 年","order":"any"},{"kind":"p","runs":[["第11章 细胞信号转导",true]]},{"kind":"fib","stem":"细胞分泌化学信号的通讯作用方式可分为[[0]]、[[1]] 和 [[2]]，此外还可通过化学突触传递神经信号。","ans":[["自分泌"],["内分泌"],["旁分泌"]],"explain":"细胞分泌化学信号的通讯作用方式共有 4 种：自分泌、内分泌、旁分泌和化学突触传递。","src":"考研真题 · 郑州大学 2006 年","order":"any"},{"kind":"fib","stem":"化学信号中的气体分子包括[[0]] 和 [[1]]，它们可以自由扩散进入细胞，直接激活效应酶产生第二信使 cGMP，参与体内众多生理过程，影响细胞行为。","ans":[["NO","一氧化氮"],["CO","一氧化碳"]],"explain":"NO 和 CO 是气体性化学信号分子，可自由扩散通过细胞膜进入细胞，直接激活效应酶产生第二信使 cGMP，从而参与体内众多生理过程。","src":"考研真题 · 中国科学院大学 2018 年","order":"any"},{"kind":"p","runs":[["第13章 细胞增殖调控与癌细胞",true]]},{"kind":"fib","stem":"让 M 期的细胞与间期的细胞融合，诱导间期细胞产生 PCC。G1 期的 PCC 呈单线状，S 期的呈[[0]]状，G2 期的呈[[1]]状。","ans":[["粉末"],["双线"]],"explain":"不同时相的间期细胞与 M 期细胞融合后产生的 PCC（染色体超前凝集）形态不同：G1 期为单线状，S 期为粉末状，G2 期为双线状。","src":"考研真题 · 浙江师范大学 2011 年"},{"kind":"p","runs":[["第14章 细胞分化与干细胞",true]]},{"kind":"fib","stem":"分化细胞基因组中所表达的基因大致分为两种基本类型：一类是[[0]]，另一类称为[[1]]。","ans":[["管家基因","持家基因"],["组织特异性基因","奢侈基因"]],"explain":"分化细胞基因组中表达的基因分为两类：管家基因是维持细胞基本生命活动所必需、在各种细胞中都表达的基因；组织特异性基因（奢侈基因）只在特定类型的细胞中表达。","src":"考研真题 · 安徽师范大学 2019 年","order":"any"},{"kind":"p","runs":[["第16章 细胞的社会联系",true]]},{"kind":"fib","stem":"与中间纤维有关的细胞连接方式有[[0]] 和 [[1]]，与微丝有关的细胞连接方式有[[2]] 和 [[3]]。","ans":[["桥粒"],["半桥粒"],["黏着带","黏合带"],["黏着斑","黏合斑"]],"explain":"锚定连接按参与连接的骨架纤维性质不同分为两类：与中间纤维相连的锚定连接包括桥粒和半桥粒；与肌动蛋白纤维（微丝）相连的锚定连接主要有黏着带和黏着斑。","src":"考研真题 · 浙江师范大学 2011 年","order":[[0,1],[2,3]]},{"kind":"fib","stem":"紧密连接是表皮组织细胞的主要连接方式，参与紧密连接的两个重要的蛋白质分别是[[0]] 和 [[1]]。","ans":[["闭合蛋白","occludin","Occludin"],["密封蛋白","claudin","Claudin"]],"explain":"参与紧密连接的两个重要蛋白质是闭合蛋白（occludin）和密封蛋白（claudin），它们使相邻细胞的细胞膜紧密相贴，封闭细胞间隙。","src":"考研真题 · 中山大学 2007 年","order":"any"}]},{"title":"附录四：原理串联专题怎么用（每天 1～2 小时）","kind":"set","blocks":[{"kind":"p","runs":[["这一版在 80 天计划之外加了一条“原理串联”线：把全书拆成若干层原理，一层一个专题。它的目标不是再刷一遍真题，而是让你遇到没见过的新情境题时，能从原理推出来。",true]]},{"kind":"p","runs":[["为什么需要这条线",true]]},{"kind":"bullet","runs":[["南科大 811 的真题重复

function sectionHtml(s, si, n, answerHtml, isTopic){
  const k = s.key;
  const title = s.title;
  if(k === "quiz"){
    const items = s.blocks.map((b, bi) => {
      const id = key("quiz", n, si, bi);
      const open = revealedAns.has(id);
      return `<div class="qcard">
        <button class="qhead${open?" open":""}" data-act="q-toggle" data-id="${id}">
          <span class="qnum">${bi+1}.</span>
          <span class="q">${runsHtml(b.runs)}</span>
          <span class="chev">▾</span>
        </button>
        <div class="qans${open?"":" hidden"}" data-id="${id}">
          <div class="qans-label">${isTopic ? "参考答案（本专题原理精讲，先自己写再对照）" : "参考答案（今日必须背诵）"}</div>
          ${answerHtml || '<div class="empty">本题无参考答案</div>'}
        </div>
        <div class="score-row"><span class="hint">评分：</span>${scoreButtonsHtml(id)}</div>
      </div>`;
    }).join("");
    return `<section class="sec"><h3 class="sec-title">${esc(title)} <span class="badge">默写自测 · 点击题目显示答案</span></h3>${items}</section>`;
  }
  if(k === "must" || k === "extra" || k === "template" || k === "other"){
    const id = key("recall", n, si);
    const blurred = recallMode && !revealedSet.has(id);
    const badge = (k==="must") ? "★ 重点背" : (k==="extra" ? "补充" : "");
    return `<section class="sec">
      <div class="sec-head">
        <h3 class="sec-title">${esc(title)} ${badge?`<span class="badge">${badge}</span>`:''}</h3>
        <div class="sec-score-row">${scoreButtonsHtml(id)}</div>
      </div>
      <div class="${blurred?'recall-panel blurred':'recall-panel'}" data-id="${id}">
        <div class="panel-body">${richBlocksHtml(s.blocks)}</div>
        <div class="mask">点击显示</div>
      </div>
    </section>`;
  }
  const courseHtml = k === "frame" ? courseCardHtml(n, isTopic) : "";
  return `<section class="sec"><h3 class="sec-title">${esc(title)}</h3>${richBlocksHtml(s.blocks)}${courseHtml}</section>`;
}

const revealedSet = new Set();
const revealedAns = new Set();

function renderSide(){
  const doneCount = days.filter(d => store[key("done", d.n)]).length;
  const pct = Math.round(doneCount / days.length * 100);
  let h = `<div class="prog"><b>已完成 ${doneCount}/${days.length}</b> <span>${pct}%</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const __ms = mcqStats();
  const __fs = fibStat();
  if(__ms.done > 0 || __fs.n > 0){
    let line = `<div class="stat-line">`;
    if(__ms.done > 0) line += `<span>选择题 <b>${__ms.done}</b> 题（对 ${__ms.ok} / 错 ${__ms.bad}）· 正确率 <b>${__ms.rate}%</b></span>`;
    if(__fs.n > 0) line += `<span>填空题 <b>${__fs.n}</b> 次（对 ${__fs.c} / 错 ${__fs.bad}）· 正确率 <b>${__fs.rate}%</b></span>`;
    line += `</div>`;
    h += line;
  }
  const q = query.trim().toLowerCase();
  const dayBtn = (d, isTopic, i) => {
    const on = isTopic ? (curKind === "topic" && i === cur) : (curKind === "day" && days[i] === d);
    const done = store[key("done", d.n)];
    return `<button class="day-btn ${on?'on':''}" data-act="${isTopic?'go-topic':'go'}" data-i="${i}">
        <span class="num">${d.special ? d.n : "Day " + d.n}</span>
        <span class="ttl">${esc(d.title)}</span>
        ${done?'<span class="chk">✓</span>':''}
      </button>`;
  };
  for(const [name, nums] of PHASES){
    h += `<div class="grp">${name}</div>`;
    for(const n of nums){
      if(typeof n === "number"){
        const d = days.find(x => x.n === n);
        if(!d) continue;
        if(q && !daySearchText(d).toLowerCase().includes(q)) continue;
        h += dayBtn(d, false, days.indexOf(d));
      } else {
        const ti = topics.findIndex(x => x.n === n);
        if(ti < 0) continue;
        const d = topics[ti];
        if(q && !daySearchText(d).toLowerCase().includes(q)) continue;
        h += dayBtn(d, true, ti);
      }
    }
  }
  h += `<div class="grp">附录</div>`;
  appendix.forEach((s, i) => {
    h += `<button class="day-btn" data-act="go-app" data-i="${i}">${esc(s.title)}</button>`;
  });

}

function topicForDay(d){
  const t = String((d && d.title) || "");
  const rules = [
    [/细胞质膜/, "T2"],
    [/物质的跨膜运输/, "T3"],
    [/细胞质基质与内膜系统|蛋白质分选|膜泡运输/, "T4"],
    [/线粒体|叶绿体|光合作用/, "T5"],
    [/细胞骨架/, "T6"],
    [/细胞核与染色质/, "T7"],
    [/细胞信号转导|信号通路升级/, "T8"],
    [/细胞周期与细胞分裂|细胞增殖调控/, "T9"],
    [/细胞死亡|细胞衰老/, "T10"],
    [/细胞分化|干细胞|发育/, "T11"],
    [/免疫/, "T12"],
    [/肿瘤/, "T13"]
  ];
  for(const rule of rules){ if(rule[0].test(t)) return rule[1]; }

function renderAppendix(i){
  const s = appendix[i];
  if(!s) return;
  curKind = "app";
  let h = `<div class="card"><div class="day-head"><h2>${esc(s.title)}</h2></div>`;
  if(s.kind === "fibset"){
    const items = (s.blocks || []).filter(b => b.kind === "fib");
    let n = 0, c = 0, seenQ = 0;
    items.forEach(b => {
      const r = store["fib:" + fibId(b)];
      if(r && r.n){ n += r.n; c += (r.c || 0); seenQ++; }
    });
    h += `<div class="stat-line"><span>共 <b>${items.length}</b> 题</span><span>做过 <b>${seenQ}</b> 题</span><span>累计作答 <b>${n}</b> 次</span><span>正确率 <b>${n ? Math.round(c / n * 100) : 0}%</b></span></div>`;
    h += `<div class="toolbar"><button class="btn ghost" data-act="fib-reset" data-set="${i}">清空本页作答记录</button></div>`;
  }
  h += richBlocksHtml(s.blocks || []);
  h += `</div>`;
  $main.innerHTML = h;
  if(sideIsOpen) closeSide();
}

function renderWrong(){
  const list = [];
  const seen = {};
  const all = days.concat(topics);
  for(const d of all){
    for(const s of (d.sections || [])){
      for(const b of (s.blocks || [])){
        if(b.kind === "mcq"){
          const id = mcqId(b);
          if(seen["mcq:" + id]) continue;
          const rec = store["mcq:" + id];
          if(!rec || !rec.n) continue;
          seen["mcq:" + id] = 1;
          const c = (rec.c === undefined) ? (rec.r === "ok" ? 1 : 0) : rec.c;
          if(c >= rec.n) continue;
          list.push({ kind:"mcq", b:b, n:rec.n, c:c, rate:Math.round(c / rec.n * 100), label:dayLabel(d) });
        } else if(b.kind === "fib"){
          const id = fibId(b);
          if(seen["fib:" + id]) continue;
          const rec = store["fib:" + id];
          if(!rec || !rec.n) continue;
          seen["fib:" + id] = 1;
          const c = rec.c || 0;
          if(c >= rec.n) continue;
          list.push({ kind:"fib", b:b, n:rec.n, c:c, rate:Math.round(c / rec.n * 100), label:dayLabel(d) });
        }
      }
    }
  }
  list.sort((a, b) => (a.rate - b.rate) || (b.n - a.n));
  let inner = "";
  if(!list.length){
    inner = `<div class="empty">还没有错题。做过的选择题与填空题，只要错过的都会自动汇总到这里，按正确率从低到高排列。</div>`;
  } else {
    const avg = Math.round(list.reduce((s, x) => s + x.rate, 0) / list.length);
    const nm = list.filter(x => x.kind === "mcq").length;
    const nf = list.filter(x => x.kind === "fib").length;
    inner = `<div class="stat-line"><span>错题 <b>${list.length}</b> 道（选择 ${nm} / 填空 ${nf}）</span><span>平均正确率 <b>${avg}%</b></span><span>按正确率从低到高</span></div>`;
    list.forEach((x, i) => {
      inner += `<div class="wrong-src">${esc(x.label)} · 作答 ${x.n} 次 · 正确率 ${x.rate}%</div>`;
      inner += (x.kind === "fib") ? fibHtml(x.b, i + 1) : mcqHtml(x.b, i + 1);
    });
  }
  $main.innerHTML = `<div class="card"><div class="day-head"><h2>错题本</h2><span class="tag">做错过的选择题与填空题</span></div>${inner}</div>`;
  if(sideIsOpen) closeSide();
}

function renderReview(){
  const out = [];
  for(const d of days.concat(topics)){
    const qs = [];
    (d.sections || []).forEach((s, si) => {
      if(s.key === "quiz"){
        s.blocks.forEach((b, bi) => {
          const id = key("quiz", d.n, si, bi);
          const v = store[id];
          if(v === "hard" || v === "fuzzy"){
            qs.push(`<div class="quiz"><span class="qnum">${bi+1}.</span><div class="q">${runsHtml(b.runs)}</div><span class="score ${v}">${SCORE_LABEL[v]}</span></div>`);
          }
        });
      } else if(s.key==="must" || s.key==="extra"){
        const id = key("recall", d.n, si);
        const v = store[id];
        if(v === "hard" || v === "fuzzy"){
          qs.push(`<div class="sec-head"><h3 class="sec-title">${esc(s.title)}</h3><span class="score ${v}">${SCORE_LABEL[v]}</span></div><div class="recall-panel"><div class="panel-body">${richBlocksHtml(s.blocks)}</div></div>`);
        }
      }
    });
    if(qs.length){
      out.push(`<section class="sec"><h3 class="sec-title">${esc(dayLabel(d))}</h3>${qs.join("")}</section>`);
    }
  }
  const body = out.length ? out.join("") : `<div class="empty">还没有「不会 / 模糊」的内容。在默写检测或背诵里打三档分，这里会自动汇总需要回炉的部分。</div>`;
  $main.innerHTML = `<div class="card"><div class="day-head"><h2>回炉清单</h2><span class="tag">不会 + 模糊</span></div>${body}</div>`;
  if(sideIsOpen) closeSide();
}

let sideIsOpen = false;
function closeSide(){ $side.classList.remove("open"); sideIsOpen = false; }

document.getElementById("menuBtn").addEventListener("click", () => {
  sideIsOpen = !sideIsOpen;
  $side.classList.toggle("open", sideIsOpen);
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.getAttribute("data-act");
  if(act === "go"){
    curKind = "day";
    cur = +t.getAttribute("data-i");
    renderSide(); renderDay(); window.scrollTo(0,0);
  }
  else if(act === "go-topic"){
    curKind = "topic";
    cur = +t.getAttribute("data-i");
    renderSide(); renderDay(); window.scrollTo(0,0);
  }
  else if(act === "go-topic-n"){
    const ti = topics.findIndex(x => x.n === t.getAttribute("data-t"));
    if(ti < 0) return;
    curKind = "topic";
    cur = ti;
    renderSide(); renderDay(); window.scrollTo(0,0);
  }
  else if(act === "go-app"){
    cur = +t.getAttribute("data-i");
    renderAppendix(cur);
  }
  else if(act === "done"){
    const n = t.getAttribute("data-n");
    const id = key("done", n);
    store[id] = !store[id];
    save(); renderSide(); renderDay();
  }
  else if(act === "recall-mode"){
    recallMode = !recallMode;
    revealedSet.clear();
    renderDay();
  }
  else if(act === "reveal-all" || act === "hide-all"){
    document.querySelectorAll(".recall-panel").forEach(el => {
      const id = el.getAttribute("data-id");
      if(act === "reveal-all") revealedSet.add(id); else revealedSet.delete(id);
    });
    renderDay();
  }
  else if(act === "pick"){
    const card = t.closest(".mcq");
    if(!card) return;
    const key = (card.getAttribute("data-ans") || "").trim();
    const chosen = (t.getAttribute("data-k") || "").trim();
    card.querySelectorAll(".opt").forEach(el => {
      el.classList.remove("correct", "wrong", "dim");
      const ek = (el.getAttribute("data-k") || "").trim();
      if(ek === key) el.classList.add("correct");
      else if(ek === chosen) el.classList.add("wrong");
      else el.classList.add("dim");
    });
    const box = card.querySelector(".mcq-ans");
    if(box) box.classList.remove("hidden");
    const btn = card.querySelector('[data-act="mcq-ans"]');
    if(btn) btn.textContent = "收起答案";
    const qid = card.getAttribute("data-id") || "";
    const okFlag = (chosen === key);
    const now = new Date();
    const stamp = (now.getMonth() + 1) + "-" + String(now.getDate()).padStart(2, "0");
    const prev = store["mcq:" + qid] || {};
    const pc = (prev.c === undefined) ? (prev.n ? (prev.r === "ok" ? 1 : 0) : 0) : prev.c;
    const nc = pc + (okFlag ? 1 : 0);
    const nn = (prev.n || 0) + 1;
    store["mcq:" + qid] = { r: okFlag ? "ok" : "no", d: stamp, n: nn, c: nc };
    save();
    let badge = card.querySelector(".mcq-rec");
    if(!badge){
      badge = document.createElement("span");
      const head = card.querySelector(".mcq-head");
      if(head) head.appendChild(badge); else card.appendChild(badge);
    }
    badge.className = "mcq-rec " + (okFlag ? "ok" : "no");
    badge.textContent = "作答 " + nn + " 次 · 正确率 " + Math.round(nc / nn * 100) + "%　(本次" + (okFlag ? "对" : "错") + ")";
    renderSide();
  }
  else if(act === "mcq-ans"){
    const card = t.closest(".mcq");
    const box = card ? card.querySelector(".mcq-ans") : null;
    if(box){ box.classList.toggle("hidden"); t.textContent = box.classList.contains("hidden") ? "查看答案" : "收起答案"; }
  }
  else if(act === "fib-check"){
    judgeFib(t.closest(".fib"));
  }
  else if(act === "fib-ans"){
    const card = t.closest(".fib");
    const box = card ? card.querySelector(".fib-ans") : null;
    if(box){ box.classList.toggle("hidden"); t.textContent = box.classList.contains("hidden") ? "查看答案" : "收起答案"; }
  }
  else if(act === "fib-clear"){
    const card = t.closest(".fib");
    if(!card) return;
    card.querySelectorAll(".fib-in").forEach(inp => {
      inp.value = "";
      inp.classList.remove("ok", "no");
    });
    card.querySelectorAll(".fib-fb").forEach(fb => { fb.className = "fib-fb"; fb.textContent = ""; });
    const box = card.querySelector(".fib-ans");
    if(box) box.classList.add("hidden");
    const btn = card.querySelector('[data-act="fib-ans"]');
    if(btn) btn.textContent = "查看答案";
    const result = card.querySelector(".fib-result");
    if(result){ result.className = "fib-result"; result.textContent = ""; }
  }
  else if(act === "fib-reset"){
    const set = +t.getAttribute("data-set");
    const s = appendix[set];
    if(!s) return;
    if(!window.confirm("确定清空本页填空题的作答记录吗？此操作不可撤销。")) return;
    (s.blocks || []).filter(b => b.kind === "fib").forEach(b => { delete store["fib:" + fibId(b)]; });
    save();
    renderAppendix(set);
  }
  else if(act === "score"){
    const id = t.getAttribute("data-id");
    const v = t.getAttribute("data-v");
    if(store[id] === v) delete store[id]; else store[id] = v;
    save(); renderDay();
  }
  else if(act === "q-toggle"){
    const id = t.getAttribute("data-id");
    const ans = document.querySelector(`.qans[data-id="${id}"]`);
    const head = t.closest(".qhead");
    if(revealedAns.has(id)) revealedAns.delete(id); else revealedAns.add(id);
    if(ans) ans.classList.toggle("hidden", !revealedAns.has(id));
    if(head) head.classList.toggle("open", revealedAns.has(id));
  }
  else if(act === "wrong-only"){
    renderWrong();
  }
  else if(act === "review-only"){
    renderReview();
  }
});

// 点击整张 recall 面板也能揭示（但按钮除外）
$main.addEventListener("click", (e) => {
  const rec = e.target.closest(".recall-panel");
  if(!rec) return;
  if(e.target.closest("button")) return;
  const id = rec.getAttribute("data-id");
  if(revealedSet.has(id)) revealedSet.delete(id); else revealedSet.add(id);
  rec.classList.toggle("blurred", recallMode && !revealedSet.has(id));
});

// 填空题里按回车直接核对
$main.addEventListener("keydown", (e) => {
  const el = e.target;
  if(e.key === "Enter" && el && el.classList && el.classList.contains("fib-in")){
    e.preventDefault();
    const card = el.closest(".fib");
    if(card) judgeFib(card);
  }
});

let searchTimer;
document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    query = e.target.value;
    renderSide();
  }, 120);
});

renderSide();
renderDay();

</script>

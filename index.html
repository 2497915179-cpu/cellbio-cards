<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>811 细胞生物学 · 记忆卡片</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5;
    --text:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --brand-ink:#ffffff;
    --accent:#eef2ff; --accent-text:#3730a3;
    --danger:#dc2626; --danger-bg:#fee2e2;
    --ok:#16a34a; --ok-bg:#dcfce7;
    --warn:#d97706; --warn-bg:#fef3c7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --panel:#171a1f; --panel2:#1f2329;
      --text:#e7e9ec; --muted:#9aa3ae; --line:#2a2f37;
      --brand:#3b82f6; --brand-ink:#0b1220;
      --accent:#172033; --accent-text:#c7d2fe;
      --danger:#f87171; --danger-bg:#2a1517;
      --ok:#4ade80; --ok-bg:#12251a;
      --warn:#fbbf24; --warn-bg:#2a2110;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.65;
  }
  button{font-family:inherit; cursor:pointer}
  .top{
    position:sticky; top:0; z-index:20;
    background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    flex-wrap:wrap;
  }
  .top h1{font-size:17px; margin:0; font-weight:600; letter-spacing:.3px}
  .top .sub{color:var(--muted); font-size:12px; margin-left:auto}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
  .layout{display:grid; grid-template-columns:292px minmax(0,1fr); min-height:calc(100vh - 54px)}
  .side{
    background:var(--panel); border-right:1px solid var(--line);
    padding:12px; overflow-y:auto; max-height:calc(100vh - 54px);
    position:sticky; top:54px;
  }
  .main{padding:18px 20px 80px; max-width:980px; width:100%; min-width:0}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--text);
    border-radius:9px; padding:7px 12px; font-size:13px;
  }
  .btn:hover{border-color:var(--brand)}
  .btn.active{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
  .btn.ghost{background:transparent}
  .search{flex:1; min-width:170px}
  .search input{
    width:100%; border:1px solid var(--line); background:var(--panel);
    color:var(--text); border-radius:9px; padding:8px 11px; font-size:14px;
  }
  .search input:focus{outline:2px solid var(--brand); outline-offset:0}
  .prog{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:2px 2px 12px}
  .prog b{color:var(--text); font-weight:600}
  .bar{flex:1; height:6px; background:var(--panel2); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--brand); border-radius:99px}
  .grp{font-size:11px; color:var(--muted); margin:14px 4px 5px; letter-spacing:.5px}
  .day-btn{
    width:100%; text-align:left; border:none; background:transparent; color:var(--text);
    padding:8px 10px; border-radius:9px; display:flex; align-items:center; gap:9px;
    font-size:14px;
  }
  .day-btn:hover{background:var(--panel2)}
  .day-btn.on{background:var(--accent); color:var(--accent-text)}
  .day-btn .num{color:var(--muted); font-size:12px; width:34px; flex:none}
  .day-btn .ttl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .day-btn .chk{color:var(--ok); font-size:14px; flex:none}
  .menu-btn{display:none}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:16px;
  }
  .day-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .day-head h2{margin:0; font-size:20px; font-weight:650}
  .day-head .tag{color:var(--muted); font-size:13px}
  .sec{margin-bottom:20px}
  .sec-title{
    display:flex; align-items:center; gap:8px; font-weight:650; font-size:15px;
    margin:0 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .sec-title .badge{font-size:11px; color:var(--muted); font-weight:500}
  .sec-title .star{color:var(--warn)}
  ul.clean{margin:0; padding-left:0; list-style:none}
  ul.clean li{position:relative; padding-left:18px; margin:4px 0}
  ul.clean li::before{content:""; position:absolute; left:2px; top:.72em; width:6px; height:6px; border-radius:50%; background:var(--brand); opacity:.7}
  ol.clean{margin:0; padding-left:22px}
  ol.clean li{margin:7px 0}
  .sec-head{display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .sec-head .sec-title{flex:1; margin:0; padding-bottom:6px}
  .recall-panel{
    position:relative; border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; background:var(--panel2);
  }
  .recall-panel .panel-body{transition:filter .15s}
  .recall-panel.blurred .panel-body{filter:blur(7px); user-select:none}
  .recall-panel .mask{
    display:none; position:absolute; inset:0; align-items:center; justify-content:center;
    font-size:13px; color:var(--brand); background:transparent; cursor:pointer;
  }
  .recall-panel.blurred .mask{display:flex}
  .topic-guide{
    display:flex; align-items:center; gap:14px; justify-content:space-between;
    border:1px solid var(--line); border-left:4px solid var(--brand);
    background:var(--accent); color:var(--accent-text);
    border-radius:12px; padding:11px 13px; margin:2px 0 16px;
  }
  .topic-guide .guide-text{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
  .topic-guide b{font-size:14px}
  .topic-guide span{font-size:13px; opacity:.9; line-height:1.55}
  .course-card{
    margin-top:14px; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--panel2);
  }
  .course-card-head{display:flex; align-items:flex-start; gap:12px; justify-content:space-between}
  .course-card-head>div{min-width:0}
  .course-kicker{font-size:11px; color:var(--brand); font-weight:650; letter-spacing:.35px}
  .course-name{font-size:14px; font-weight:650; line-height:1.45; margin-top:2px}
  .course-meta{font-size:11.5px; color:var(--muted); margin-top:2px}
  .course-all{font-size:12px; color:var(--brand); text-decoration:none; white-space:nowrap; padding-top:2px}
  .course-all:hover{text-decoration:underline}
  .course-links{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
  .course-link{
    display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border:1px solid var(--line);
    border-radius:8px; background:var(--panel); color:var(--text); text-decoration:none;
    font-size:12.5px; line-height:1.35;
  }
  .course-link:hover{border-color:var(--brand)}
  .course-link.core{border-color:var(--brand); background:var(--accent); color:var(--accent-text)}
  .course-no{font-size:11px; color:var(--muted)}
  .course-link.core .course-no{color:inherit; opacity:.72}
  .course-core{font-size:10.5px; font-weight:650; border:1px solid currentColor; border-radius:99px; padding:0 5px; opacity:.85}
  .course-note{font-size:12px; color:var(--muted); line-height:1.55; margin-top:9px}
  @media(max-width:720px){
    .topic-guide{align-items:flex-start; flex-direction:column}
    .topic-guide .btn{width:100%}
    .course-card-head{flex-direction:column; gap:5px}
    .course-all{align-self:flex-start}
  }
  .flag{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:8px; font-size:12px; padding:3px 8px; flex:none; white-space:nowrap;
  }
  .flag.flagged{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
  .qnum{color:var(--muted); font-size:13px; flex:none; width:22px}
  .quiz{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin:7px 0; background:var(--panel);
  }
  .quiz .q{flex:1}
  .quiz .st{
    border:1px solid var(--line); border-radius:99px; font-size:12px; padding:4px 10px;
    flex:none; color:var(--muted); background:var(--panel);
  }
  .quiz .st.review{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
  .quiz .st.ok{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
  .empty{color:var(--muted); text-align:center; padding:40px 10px}
  .qcard{border:1px solid var(--line); border-radius:12px; margin:8px 0; background:var(--panel); overflow:hidden}
  .qhead{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:none; background:transparent; color:var(--text); padding:12px 14px; font-size:15px}
  .qhead .qnum{color:var(--muted); font-size:13px; width:24px; flex:none; padding-top:1px}
  .qhead .q{flex:1}
  .qhead .chev{color:var(--muted); flex:none; transition:transform .15s}
  .qhead.open .chev{transform:rotate(180deg)}
  .qans{border-top:1px dashed var(--line); padding:12px 14px; background:var(--panel2)}
  .qans .qans-label{font-size:12px; color:var(--brand); margin-bottom:7px; font-weight:600}
  .qans.hidden{display:none}
  .score-row{display:flex; gap:8px; padding:9px 14px 13px; border-top:1px solid var(--line); flex-wrap:wrap; align-items:center}
  .score-row .hint{font-size:12px; color:var(--muted); margin-right:2px}
  .score{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:99px; font-size:12px; padding:4px 12px}
  .score.hard{background:var(--danger-bg); color:var(--danger); border-color:var(--danger)}
  .score.fuzzy{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
  .score.ok{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
  .score.on{outline:2px solid currentColor; outline-offset:1px; font-weight:600}
  .sec-score-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  @media (max-width: 840px){
    .layout{grid-template-columns:1fr}
    .side{
      display:none; position:fixed; inset:54px 0 0 0; max-height:none; z-index:15;
      border-right:none; border-bottom:1px solid var(--line);
    }
    .side.open{display:block}
    .menu-btn{display:inline-flex}
    .main{padding:14px 14px 80px}
  }
.mcq{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; background:var(--panel)}
  .mcq-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; color:var(--muted)}
  .mcq-num{min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--panel2); color:var(--text);
    display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600}
  .mcq-stem{font-size:15px; font-weight:600; line-height:1.7; margin:4px 0 10px}
  .mcq-opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .opt{border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; line-height:1.6; background:var(--panel)}
  .opt b{color:var(--brand); margin-right:4px}
  .mcq-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .mcq-ans{margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--panel2); font-size:14px; line-height:1.75}
  .mcq-ans.hidden{display:none}
  @media (max-width:640px){ .mcq-opts{grid-template-columns:1fr} }
  .opt{cursor:pointer; transition:border-color .12s, background .12s}
  .opt:hover{border-color:var(--brand)}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600}
  .opt.wrong{background:var(--danger-bg); border-color:var(--danger); color:var(--danger); font-weight:600}
  .opt.dim{opacity:.55}
  .mcq-rec{margin-left:auto; font-size:12px; padding:2px 8px; border-radius:999px; white-space:nowrap}
  .mcq-rec.ok{background:var(--ok-bg); color:var(--ok)}
  .mcq-rec.no{background:var(--danger-bg); color:var(--danger)}
  .stat-line{display:flex; gap:8px; font-size:12.5px; color:var(--muted); margin:0 2px 12px; flex-wrap:wrap}
  .stat-line b{color:var(--text); font-weight:600}
  .wrong-src{font-size:12px; color:var(--muted); margin:16px 0 4px}
  .wrong-src b{color:var(--text)}

  /* 填空题：可输入、判对错 */
  .fib{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; background:var(--panel)}
  .fib-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; color:var(--muted)}
  .fib-num{min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--panel2); color:var(--text);
    display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600}
  .fib-stem{font-size:15px; line-height:2.5; margin:4px 0 8px}
  .fib-in{border:none; border-bottom:1.5px solid var(--brand); background:transparent; color:var(--text);
    font:inherit; font-size:15px; min-width:96px; padding:1px 4px; margin:0 2px; outline:none; text-align:center}
  .fib-in::placeholder{color:var(--muted); opacity:.55; font-size:13px}
  .fib-in:focus{border-bottom-color:var(--warn); background:var(--panel2)}
  .fib-in.ok{border-bottom-color:var(--ok); color:var(--ok); font-weight:600}
  .fib-in.no{border-bottom-color:var(--danger); color:var(--danger); font-weight:600}
  .fib-fb{font-size:12.5px; margin-left:2px; white-space:nowrap}
  .fib-fb.ok{color:var(--ok)}
  .fib-fb.no{color:var(--danger)}
  .fib-actions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center}
  .fib-ans{margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--panel2); font-size:14px; line-height:1.8}
  .fib-ans.hidden{display:none}
  .fib-tip{font-size:12px; color:var(--muted)}
  .fib-result{font-size:12.5px; margin-left:2px}
  .fib-result.ok{color:var(--ok); font-weight:600}
  .fib-result.no{color:var(--danger); font-weight:600}

  /* 原理串联：灵活运用（可折叠问答） */
  .qa{border:1px solid var(--line); border-radius:11px; margin:10px 0; background:var(--panel); overflow:hidden}
  .qa>summary{cursor:pointer; padding:11px 13px; font-size:14.5px; line-height:1.75; color:var(--text);
    list-style:none; display:flex; gap:8px; align-items:flex-start}
  .qa>summary::-webkit-details-marker{display:none}
  .qa>summary::marker{content:""}
  .qa>summary:hover{background:var(--panel2)}
  .qa[open]>summary{border-bottom:1px solid var(--line)}
  .qa-tag{flex:none; font-size:12px; color:var(--brand); border:1px solid var(--brand);
    border-radius:6px; padding:1px 6px; white-space:nowrap; margin-top:2px}
  .qa-q{flex:1}
  .qa-q::after{content:"（点击展开参考答案）"; color:var(--muted); font-size:12px; margin-left:6px}
  .qa[open] .qa-q::after{content:""}
  .qa-a{padding:11px 13px; font-size:14px; line-height:1.95; white-space:pre-wrap}

  /* 填空题：顺序不限的标记 */
  .fib-tag{flex:none; font-size:11.5px; color:var(--ok); border:1px solid var(--ok); border-radius:6px;
    padding:0 6px; line-height:18px}
  .fib-order-note{margin-top:5px; font-size:12.5px; color:var(--muted)}
  /* 原理串联：灵活运用（可折叠问答） */
  /* 原理串联：灵活运用（可折叠问答） */
  .qa{border:1px solid var(--line); border-radius:11px; margin:10px 0; background:var(--panel); overflow:hidden}
  .qa>summary{cursor:pointer; padding:11px 13px; font-size:14.5px; line-height:1.75; color:var(--text);
    list-style:none; display:flex; gap:8px; align-items:flex-start}
  .qa>summary::-webkit-details-marker{display:none}
  .qa>summary::marker{content:""}
  .qa>summary:hover{background:var(--panel2)}
  .qa[open]>summary{border-bottom:1px solid var(--line)}
  .qa-tag{flex:none; font-size:12px; color:var(--brand); border:1px solid var(--brand);
    border-radius:6px; padding:1px 6px; white-space:nowrap; margin-top:2px}
  .qa-q{flex:1}
  .qa-q::after{content:"（点击展开参考答案）"; color:var(--muted); font-size:12px; margin-left:6px}
  .qa[open] .qa-q::after{content:""}
  .qa-a{padding:11px 13px; font-size:14px; line-height:1.95; white-space:pre-wrap}
  /* 信号通路图解 */
  .path-figure{
    margin:14px 0 18px; border:1px solid var(--line); border-radius:14px;
    background:var(--panel); overflow:hidden;
  }
  .path-figure figcaption{
    display:flex; flex-direction:column; gap:3px; padding:12px 14px 10px;
    background:var(--panel2); border-bottom:1px solid var(--line);
  }
  .path-figure figcaption b{font-size:15px; color:var(--text)}
  .path-figure figcaption span{font-size:13px; line-height:1.65; color:var(--muted)}
  .path-figure figcaption small{font-size:11.5px; color:var(--brand)}
  .path-scroll{overflow-x:auto; padding:12px 14px 14px; background:var(--panel)}
  .path-map{min-width:650px; display:flex; flex-direction:column; gap:9px}
  .path-topline,.path-flow,.path-close,.path-brake-row{
    display:flex; align-items:center; gap:7px; flex-wrap:nowrap;
  }
  .path-topline{padding:1px 2px 5px}
  .path-node{
    display:inline-flex; flex-direction:column; justify-content:center; align-items:center;
    min-width:68px; max-width:112px; min-height:48px; padding:6px 7px;
    border:1px solid var(--line); border-radius:10px; background:var(--panel2);
    text-align:center; flex:none; line-height:1.25;
  }
  .path-node b{font-size:12.5px; color:var(--text); white-space:normal}
  .path-node small{font-size:10.5px; color:var(--muted); margin-top:3px; white-space:normal}
  .path-node.receptor{border-color:var(--brand); background:var(--accent)}
  .path-node.switch{border-color:var(--warn); background:var(--warn-bg)}
  .path-node.enzyme{border-color:var(--ok); background:var(--ok-bg)}
  .path-node.messenger{border-color:var(--brand); background:var(--panel)}
  .path-node.result{border-color:var(--brand); background:var(--brand); color:var(--brand-ink)}
  .path-node.result b,.path-node.result small{color:var(--brand-ink)}
  .path-node.brake{border-color:var(--danger); background:var(--danger-bg)}
  .path-arrow{color:var(--brand); font-size:17px; line-height:1; font-weight:700; flex:none}
  .path-lane{
    --lane:var(--brand); display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-left:4px solid var(--lane);
    border-radius:11px; padding:8px 9px; background:var(--panel2);
  }
  .path-lane.gs{--lane:var(--ok)}
  .path-lane.gi{--lane:var(--warn)}
  .path-lane.gq{--lane:#7c3aed}
  .path-lane.mapk{--lane:var(--brand)}
  .path-lane.pi3k{--lane:#0d9488}
  .path-lane-label{width:76px; flex:none; padding-left:2px}
  .path-lane-label b{display:block; font-size:12px; color:var(--lane); font-weight:700}
  .path-lane-label small{display:block; color:var(--muted); font-size:10.5px; line-height:1.35; margin-top:2px}
  .path-flow{flex:1; min-width:0; gap:5px}
  .path-splitflow{display:flex; flex-direction:column; gap:5px; flex:1; min-width:0}
  .path-continue{border:1px dashed var(--line); border-radius:8px; background:var(--panel); padding:4px 7px; color:var(--muted); font-size:11px; white-space:nowrap; flex:none}
  .path-mini-stack{display:flex; flex-direction:column; gap:4px; min-width:150px; flex:none}
  .path-mini-row{
    border:1px dashed var(--line); border-radius:8px; background:var(--panel);
    padding:4px 7px; font-size:11px; line-height:1.4; color:var(--text);
  }
  .path-mini-row b{color:var(--brand)}
  .path-close,.path-brake-row{
    padding:8px 10px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel2); color:var(--muted); font-size:11.5px;
  }
  .path-close strong,.path-brake-row strong{color:var(--text); flex:none}
  .path-close span,.path-brake-row span{white-space:nowrap}
  .path-note{font-size:11.5px; color:var(--muted); padding:2px 2px 0}
  @media(max-width:720px){
    .path-figure figcaption{padding:10px 11px}
    .path-scroll{padding:10px 10px 12px}
    .path-map{min-width:650px}
  }

</style>

":"叶绿体","C":"细胞核和叶绿体","D":"叶绿体和细胞核"},"ans":"D","explain":"核酮糖二磷酸羧化酶是光合作用中一个起重要作用的酶系统，全酶由8个 大亚基和8个小亚基组成。已知酶的活性中心位于大亚基上，小亚基只有调节功能。 大亚基由叶绿体基因编码，而小亚基则是由核基因编码。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列 4 种色素中，哪个（或哪些）具有吸收聚集光能的作用而无光化学 活性？","opts":{"A":"细胞色素","B":"质体蓝素","C":"质体醌","D":"聚光色素"},"ans":"D","explain":"聚光色素吸收聚集光能并将光能转移到反应中心色素，其本身不具有光化 学活性。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：线粒体和叶绿体的半自主性及其起源",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":14},{"title":"10月14日 · 细胞骨架（上）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第8章 细胞骨架（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 微丝与细胞运动；考点2 微管及其功能；考点3 中间丝；考点4 微管、微丝、中间丝的比较",false]]},{"kind":"bullet","runs":[["本日精读：考点1 微丝与细胞运动；考点2 微管及其功能",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["微丝",true]]},{"kind":"p","runs":[["由肌动蛋白聚合成的实心纤维，有极性，参与肌肉收缩、胞质分裂、细胞变形运动与膜泡运输。",false]]},{"kind":"p","runs":[["微管",true]]},{"kind":"p","runs":[["由αβ-微管蛋白异二聚体聚合成的中空管，有极性，构成纺锤体、纤毛鞭毛并作为物质运输轨道。",false]]},{"kind":"p","runs":[["中间纤维",true]]},{"kind":"p","runs":[["由中间丝蛋白反向平行组装，无极性、最稳定、具组织特异性，起支撑并锚定核位置。",false]]},{"kind":"p","runs":[["分子马达",true]]},{"kind":"p","runs":[["肌球蛋白沿微丝运动，驱动蛋白与动力蛋白沿微管运动，水解ATP提供动力。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"伪足和片足主要由什么构成","opts":{"A":"微丝","B":"微管","C":"中间丝","D":"胶原纤维"},"ans":"A","explain":"片状伪足与丝状伪足由肌动蛋白微丝聚合形成。","src":"811真题·2025"},{"kind":"p","runs":[["蛋白质结构与功能的关系，并举例说明其在细胞内的作用。",true]]},{"kind":"p","runs":[["答案：蛋白质的功能由其结构决定，结构又由一级结构决定。（1）一级结构决定高级结构与功能：氨基酸序列经折叠形成特定的二级、三级和四级结构，序列一旦改变就可能改变功能。例如血红蛋白 β 链第6位谷氨酸被缬氨酸取代后成为镰状细胞血红蛋白，红细胞在低氧时变为镰刀状并易破裂，引起镰状细胞贫血。（2）空间构象与结构域决定功能：蛋白质的功能由其空间构象和特定区域决定，酶的活性中心决定催化的专一性，跨膜结构域决定蛋白质能否镶嵌于膜内并形成通道，马达结构域决定其水解 ATP 并产生机械运动。（3）组装与构象变化实现功能：微丝蛋白与微管蛋白组装成细胞骨架，承担支撑与物质运输；钠钾泵通过磷酸化与去磷酸化引起的构象变化实现逆浓度梯度的离子转运；血红蛋白通过构象变化实现氧的结合与释放。（4）结论：结构是功能的物质基础，结构改变或破坏（变性）时功能随之改变或丧失。",false]]},{"kind":"mcq","stem":"下列物质中，能抑制微丝解聚的是（）。；厦门 大学 2011 年研］","opts":{"A":"秋水仙素","B":"紫杉醇","C":"鬼笔环肽","D":"细胞松弛素 B"},"ans":"C","explain":"A项，秋水仙素能抑制微管的组装，而不影响其解聚。B 项，紫杉醇能抑 制微管的解浆，而不影响其组装。D项，细胞松弛素 B 能抑制微丝的组装，而不影响 其解聚。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"微管蛋白的异二聚体上具有哪种核苷酸的结合位点？（）","opts":{"A":"GDP","B":"ADP","C":"GTP","D":"ATP"},"ans":"C","explain":"在a/B-微管蛋白二聚体中，“-微管蛋白上有一个 GTP 结合位点，结 合在该位点上的 GTP 通常不会被水解，被称为不可交换位点；B-微管蛋白上也有一个 GTP 结合位点，该 GTP 在微管蛋白二聚体参与组装成微管后即被水解成 GDP，因此 B- 微管蛋白上的 GTP 结合位点是可交换位点。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"中间纤维之所以没有极性是因为其（）。","opts":{"A":"单体不具有极性","B":"二聚体不具有极性","C":"三聚体不具有极性","D":"四聚体不具有极性"},"ans":"D","explain":"中间纤维（中间丝）的组装大致分为 3个过程：首先是两个单体以相同 的方向组成 1 个双股螺旋的二聚体，两个二聚体以反向平行的方向组装成 1 个四聚体， 二聚体具有极性，四聚体没有极性。四聚体是中间纤维组装的基本结构单位，经首尾结 合最终组装成横截面由 32 个多肽组成的中间纤维。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：微丝与细胞运动",false]]},{"kind":"num","runs":[["名词解释或简答：微管及其功能",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":15},{"title":"10月15日 · 细胞骨架（下）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第8章 细胞骨架（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 微丝与细胞运动；考点2 微管及其功能；考点3 中间丝；考点4 微管、微丝、中间丝的比较",false]]},{"kind":"bullet","runs":[["本日精读：考点3 中间丝；考点4 微管、微丝、中间丝的比较",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["微丝",true]]},{"kind":"p","runs":[["由肌动蛋白聚合成的实心纤维，有极性，参与肌肉收缩、胞质分裂、细胞变形运动与膜泡运输。",false]]},{"kind":"p","runs":[["微管",true]]},{"kind":"p","runs":[["由αβ-微管蛋白异二聚体聚合成的中空管，有极性，构成纺锤体、纤毛鞭毛并作为物质运输轨道。",false]]},{"kind":"p","runs":[["中间纤维",true]]},{"kind":"p","runs":[["由中间丝蛋白反向平行组装，无极性、最稳定、具组织特异性，起支撑并锚定核位置。",false]]},{"kind":"p","runs":[["分子马达",true]]},{"kind":"p","runs":[["肌球蛋白沿微丝运动，驱动蛋白与动力蛋白沿微管运动，水解ATP提供动力。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"伪足和片足主要由什么构成","opts":{"A":"微丝","B":"微管","C":"中间丝","D":"胶原纤维"},"ans":"A","explain":"片状伪足与丝状伪足由肌动蛋白微丝聚合形成。","src":"811真题·2025"},{"kind":"p","runs":[["蛋白质结构与功能的关系，并举例说明其在细胞内的作用。",true]]},{"kind":"p","runs":[["答案：蛋白质的功能由其结构决定，结构又由一级结构决定。（1）一级结构决定高级结构与功能：氨基酸序列经折叠形成特定的二级、三级和四级结构，序列一旦改变就可能改变功能。例如血红蛋白 β 链第6位谷氨酸被缬氨酸取代后成为镰状细胞血红蛋白，红细胞在低氧时变为镰刀状并易破裂，引起镰状细胞贫血。（2）空间构象与结构域决定功能：蛋白质的功能由其空间构象和特定区域决定，酶的活性中心决定催化的专一性，跨膜结构域决定蛋白质能否镶嵌于膜内并形成通道，马达结构域决定其水解 ATP 并产生机械运动。（3）组装与构象变化实现功能：微丝蛋白与微管蛋白组装成细胞骨架，承担支撑与物质运输；钠钾泵通过磷酸化与去磷酸化引起的构象变化实现逆浓度梯度的离子转运；血红蛋白通过构象变化实现氧的结合与释放。（4）结论：结构是功能的物质基础，结构改变或破坏（变性）时功能随之改变或丧失。",false]]},{"kind":"mcq","stem":"下列物质中，能抑制微丝解聚的是（）。；厦门 大学 2011 年研］","opts":{"A":"秋水仙素","B":"紫杉醇","C":"鬼笔环肽","D":"细胞松弛素 B"},"ans":"C","explain":"A项，秋水仙素能抑制微管的组装，而不影响其解聚。B 项，紫杉醇能抑 制微管的解浆，而不影响其组装。D项，细胞松弛素 B 能抑制微丝的组装，而不影响 其解聚。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"微管蛋白的异二聚体上具有哪种核苷酸的结合位点？（）","opts":{"A":"GDP","B":"ADP","C":"GTP","D":"ATP"},"ans":"C","explain":"在a/B-微管蛋白二聚体中，“-微管蛋白上有一个 GTP 结合位点，结 合在该位点上的 GTP 通常不会被水解，被称为不可交换位点；B-微管蛋白上也有一个 GTP 结合位点，该 GTP 在微管蛋白二聚体参与组装成微管后即被水解成 GDP，因此 B- 微管蛋白上的 GTP 结合位点是可交换位点。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"中间纤维之所以没有极性是因为其（）。","opts":{"A":"单体不具有极性","B":"二聚体不具有极性","C":"三聚体不具有极性","D":"四聚体不具有极性"},"ans":"D","explain":"中间纤维（中间丝）的组装大致分为 3个过程：首先是两个单体以相同 的方向组成 1 个双股螺旋的二聚体，两个二聚体以反向平行的方向组装成 1 个四聚体， 二聚体具有极性，四聚体没有极性。四聚体是中间纤维组装的基本结构单位，经首尾结 合最终组装成横截面由 32 个多肽组成的中间纤维。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：中间丝",false]]},{"kind":"num","runs":[["名词解释或简答：微管、微丝、中间丝的比较",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":16},{"title":"10月16日 · 细胞核与染色质","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第9章 细胞核与染色质（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞核（nucleus）结构和功能；考点2 染色质和染色体",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞核（nucleus）结构和功能",false]]},{"kind":"p","runs":[["第9章 细胞核与染色质（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞核（nucleus）结构和功能；考点2 染色质和染色体",false]]},{"kind":"bullet","runs":[["本日精读：考点2 染色质和染色体",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["核被膜与核纤层",true]]},{"kind":"p","runs":[["核被膜由内外核膜、核间隙、核孔复合体与核纤层组成；核纤层蛋白 本日精读：考点1 核糖体及蛋白质的合成",false]]},{"kind":"p","runs":[["第10章 核糖体（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 核糖体及蛋白质的合成；考点2 原核和真核细胞核糖体的比较",false]]},{"kind":"bullet","runs":[["本日精读：考点2 原核和真核细胞核糖体的比较",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["核糖体",true]]},{"kind":"p","runs":[["由大、小亚基组成，含rRNA与蛋白质，是蛋白质合成场所；原核为70S，真核为80S。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"在核糖体中执行催化功能的生物大分子是（ ）。","opts":{"A":"蛋白质","B":"DNA","C":"RNA","D":"糖类"},"ans":"C","explain":"核糖体是核糖体 RNA（rRNA）和核糖体蛋白（r 蛋白）复合物，其关键的 部分是rRNA，宅是蛋自质合成的催化机器，具有肽酰转移酶的活性；而核糖体蛋白更 多的是作为一种骨架帮助 rRNA 维持正确的构象，以及在蛋白质合成中起微调作用。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"以下哪种 RNA 转录产物的加工方式可导致翻译后产生氨基酸序列不同的 蛋白质？（ ）","opts":{"A":"RNA 5'端加帽","B":"RNA 3'端聚腺苷酸化","C":"RNA 的可变剪切","D":"RNA 的细胞质定位 70"},"ans":"C","explain":"真核生物中有些基因的 mRNA 前体有几种不同的剪接方式，外显子按照不 同的方式剪接在一起，因而可以由同一个基因产生不同的成熟mRNA，翻译产生不同的 蛋白质。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"要探知细胞内某一蛋白质的表达水平，可通过（）实现。［武汉科技 大学 2019 年研］","opts":{"A":"Southern 杂交","B":"Northern 杂交","C":"Western 杂交","D":"免疫荧光技术"},"ans":"C","explain":"A 项，Southern 杂交是进行基因组 DNA 特定序列定位的通用方法。B 项， Northern 杂交是检测特定 RNA 序列的方法。C项，Western 杂交用于检测蛋白质的表 达量。D项，免疫荧光技术用于检测细胞内蛋白质分子的定位情况。","src":"考点笔记·考研例题"},{"kind":"fib","stem":"蛋白质合成的三大步骤是：[[0]]、[[1]] 和 [[2]]。","ans":[["肽链合成的起始","起始"],["肽链的延伸","延伸"],["肽链的终止","终止"]],"explain":"蛋白质合成分为肽链合成的起始、肽链的延伸和肽链的终止三大步骤。","src":"考研真题 · 复旦大学 2019 年","order":"any"},{"kind":"p","runs":[["简述核糖体的形态结构、化学组成及可能的功能。",true]]},{"kind":"p","runs":[["答案：（1）核糖体的形态结构：核糖体是一种不规则的颗粒状结构，没有生物膜的包裹，其直径约为25～30nm。核糖体有大小两个亚基，原核生物核糖体（70S）是50S 和30S 两个亚基，真核生物核糖体（80S）是60S 和40S 两个亚基。大亚基略呈半圆形，在一侧伸出三个突起，中央为一凹陷；小亚基呈长条形，在约1/3长度处有一细的缢痕，将小亚基分为大小两个区域。（2）核糖体的化学组成：① rRNA：构成核糖体的核心，决定核糖体形态，催化蛋白质间肽键的形成。 ② r 蛋白质：定位于核糖体的表面或者填充于 rRNA 间的缝隙，稳定rRNA。（3）核糖体的功能：①核糖体是蛋白质翻译的场所，按照 mRNA 的信息将氨基酸高效精确地合成多肽链。 ②核糖体在细胞内并不是单个独立地执行功能，而是由多个甚至几十个核糖体串联在一条 mRNA分子上，形成具有特殊功能与形态结构的核糖体与 mRNA 的聚合体，即多核糖体，高效地进行肽链的合成。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：核糖体及蛋白质的合成",false]]},{"kind":"num","runs":[["名词解释或简答：原核和真核细胞核糖体的比较",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":18},{"title":"休息日","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["今天休息，不安排新内容。如果还有余力，可以花 10 分钟翻一遍昨天学的内容。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["（休息日无背诵任务，好好放松。）",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["——",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"p","runs":[["——",false]]}]}],"n":19},{"title":"10月19日 · 细胞信号转导（上）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第11章 细胞信号转导（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞信号转导概述；考点2 G 蛋白偶联受体介导的信号转导；考点3 酶联受体介导的信号转导",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞信号转导概述；考点2 G 蛋白偶联受体介导的信号转导",false]]}]},{"key":"understand","title":"先理解：GPCR、G 蛋白与两条第二信使支路","blocks":[{"kind":"p","runs":[["先看总图：信号转导是“信息接力”，不是把信号分子搬进细胞。",true]]},{"kind":"diagram","type":"gpcr","title":"图解：GPCR 怎样把一条信号分成两条支路","caption":"配体只负责开启受体；Gs/Gi 与 Gq 才决定下游走 cAMP 还是 IP₃/DAG。"},{"kind":"p","runs":[["肾上腺素、胰高血糖素、生长因子等水溶性信号分子通常停留在细胞外，只与质膜上的受体结合。配体结合使受体发生构象改变，这个“形状变化”就是信息；受体再把信息交给膜内侧的 G 蛋白、酶或接头蛋白，最后通过第二信使和蛋白激酶改变细胞代谢、分泌、运动或基因表达。信号分子本身不必进入细胞，也不在传递过程中被消耗。",false]]},{"kind":"p","runs":[["把缩写换成中文，箭头就不会变成一串陌生字母。",true]]},{"kind":"bullet","runs":[["GPCR：G 蛋白偶联受体，是一条七次穿过质膜的受体。它的外侧结合配体，内侧激活三聚体 G 蛋白。",false]]},{"kind":"bullet","runs":[["G 蛋白：膜内侧的分子开关。α 亚基结合 GDP 时关闭，结合 GTP 时打开；它自身的 GTP 酶活性会把 GTP 水解为 GDP，使开关自动复位。",false]]},{"kind":"bullet","runs":[["AC：腺苷酸环化酶。它把 ATP 转化为 cAMP，是 cAMP 支路的效应酶。",false]]},{"kind":"bullet","runs":[["PKA：蛋白激酶 A。cAMP 与 PKA 的调节亚基结合后，释放并激活催化亚基，使靶蛋白磷酸化。",false]]},{"kind":"bullet","runs":[["PLC：磷脂酶 C。它把膜脂 PIP₂ 切成 IP₃ 与 DAG，是另一条 GPCR 支路的效应酶。",false]]},{"kind":"bullet","runs":[["IP₃：水溶性，扩散到内质网并打开钙通道，使 Ca²⁺ 从钙库释放；DAG 留在膜上，与 Ca²⁺ 一起激活 PKC。",false]]},{"kind":"p","runs":[["第一条支路：GPCR → Gs/Gi → AC → cAMP → PKA。",true]]},{"kind":"p","runs":[["配体结合 GPCR 后，受体促使 G 蛋白 α 亚基释放 GDP、结合 GTP。若活化的是 Gs，α 亚基就去激活腺苷酸环化酶，使 ATP 大量生成 cAMP；cAMP 再激活 PKA，PKA 通过磷酸化改变下游酶或离子通道的活性。若活化的是 Gi，α 亚基反而抑制腺苷酸环化酶，使 cAMP 降低。所以同一个 GPCR 家族可以给出相反结果，关键要看它偶联的是 Gs 还是 Gi。",false]]},{"kind":"p","runs":[["典型例子是肾上腺素促进肝细胞糖原分解：肾上腺素 → β 肾上腺素受体 → Gs → AC → cAMP → PKA → 磷酸化酶激酶 → 糖原磷酸化酶 → 糖原分解为葡萄糖。考试答题时不要只写“cAMP 升高”，还要写出它通过 PKA 改变了哪个执行蛋白。",false]]},{"kind":"p","runs":[["第二条支路：GPCR → Gq → PLC → PIP₂ → IP₃ + DAG → Ca²⁺ / PKC。",true]]},{"kind":"p","runs":[["Gq 激活 PLC 后，PLC 水解质膜内侧的 PIP₂，生成两种分工不同的第二信使。IP₃ 是水溶性的，进入细胞质后作用于内质网膜上的 IP₃ 受体，使 Ca²⁺ 释放；DAG 是脂溶性的，留在质膜中，与释放出来的 Ca²⁺ 共同激活 PKC。PKC 再磷酸化多种底物，参与分泌、收缩、增殖和基因表达调控。这里最容易混的是：PIP₂ 是前体，IP₃ 与 DAG 是水解产物；PIP₃ 则是 PI3K 生成的另一种膜脂，和 IP₃ 不是同一个分子。",false]]},{"kind":"p","runs":[["为什么一个激素分子能引起很大的反应？",true]]},{"kind":"p","runs":[["因为每一层都在放大：一个配体激活多个受体，一个受体激活多个 G 蛋白，一个效应酶催化生成许多第二信使，一个激酶又能磷酸化大量底物。级联越往后，参与反应的分子越多，这就是“级联放大”。但放大必须能被关闭：GTP 被水解、cAMP 被磷酸二酯酶降解、IP₃ 与 DAG 被代谢、蛋白磷酸酶去除磷酸基团、受体被内吞或降解，通路的输出才会随刺激停止而回落。",false]]},{"kind":"p","runs":[["读懂箭头后再背：箭头表示“促进或催化”，不是“变成”。",true]]},{"kind":"p","runs":[["例如“GPCR → G 蛋白 → AC”应当理解为：配体激活 GPCR；GPCR 促使 G 蛋白换上 GTP；活化 G 蛋白再激活 AC。它不是把 GPCR 变成 G 蛋白，也不是把 G 蛋白变成 AC。答题时把每个箭头补成一个动词，整条通路才算真正理解。",false]]},{"kind":"p","runs":[["易混点最后再检查一次。",true]]},{"kind":"bullet","runs":[["GPCR 是受体，G 蛋白是受体下游的开关，两者不是同一种蛋白。",false]]},{"kind":"bullet","runs":[["cAMP、IP₃、DAG、Ca²⁺ 都是第二信使或信号离子，不是最终效应蛋白。",false]]},{"kind":"bullet","runs":[["Gs 与 Gi 都作用于腺苷酸环化酶，但前者激活、后者抑制；Gq 主要走 PLC–IP₃/DAG 支路。",false]]},{"kind":"bullet","runs":[["霍乱毒素使 Gs 的 GTP 酶活性丧失，Gs 无法关闭，cAMP 持续升高，因而出现分泌性腹泻。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["GPCR 的开关",true]]},{"kind":"p","runs":[["GPCR 为七次跨膜受体；配体结合细胞外侧，受体激活膜内侧三聚体 G 蛋白。Gα 结合 GTP 时开启，水解为 GDP 后关闭。",false]]},{"kind":"p","runs":[["cAMP–PKA 支路",true]]},{"kind":"p","runs":[["配体 → GPCR → Gs → 腺苷酸环化酶（AC）→ cAMP → PKA → 磷酸化靶蛋白 → 代谢或分泌反应。Gi 抑制 AC，使 cAMP 降低。",false]]},{"kind":"p","runs":[["IP₃/DAG–PKC 支路",true]]},{"kind":"p","runs":[["配体 → GPCR → Gq → 磷脂酶 C（PLC）→ PIP₂ 水解为 IP₃ 与 DAG；IP₃ 促使内质网释放 Ca²⁺，DAG 与 Ca²⁺ 激活 PKC。",false]]},{"kind":"p","runs":[["信号转导的三个核心词",true]]},{"kind":"p","runs":[["构象改变传递信息；第二信使放大并扩散信号；激酶与磷酸酶通过可逆磷酸化开启和关闭反应。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"PIP₂ 水解后产生哪两种第二信使？","opts":{"A":"IP₃ 与 DAG","B":"ATP 与 ADP","C":"cAMP 与 cGMP","D":"NAD⁺ 与 FAD"},"ans":"A","explain":"磷脂酶 C（PLC）水解质膜中的 PIP₂，生成水溶性的 IP₃ 与留在膜上的 DAG。IP₃ 促使内质网释放 Ca²⁺，DAG 与 Ca²⁺ 共同激活 PKC，因此二者构成双信使系统。","src":"811真题·2025"},{"kind":"p","runs":[["如何理解细胞信号转导通路的可调控性？请举例说明。",true]]},{"kind":"p","runs":[["答案：（1）通路的基本组成：以 G 蛋白偶联受体通路为例，细胞信号转导通路由配体、受体、G 蛋白、效应酶、第二信使与蛋白激酶级联组成，信号经逐级传递并逐级放大，最终引起基因表达或代谢的改变。（2）可调控性的来源：①受体水平——受体的数量、亲和力与亚型分布可调，细胞可通过受体的上调或下调改变对信号的敏感程度；②G 蛋白水平——G 蛋白在 GTP 结合的活化态与 GDP 结合的失活态之间循环，其开关速率受 GEF 与 GAP 调控；③第二信使水平——cAMP、IP₃、Ca²⁺ 等的合成与降解速率决定信号的强度与持续时间；④磷酸化水平——蛋白激酶与蛋白磷酸酶作用相反，磷酸化与去磷酸化的平衡决定底物的活性状态；⑤反馈与限制——下游产物可反馈抑制上游组分，抑制蛋白与支架蛋白使信号具有时空特异性。（3）举例：①cAMP 通路中 Gs 与 Gi 的拮抗，Gs 激活腺苷酸环化酶使 cAMP 升高，Gi 则抑制之，同一刺激可通过不同 G 蛋白给出相反结果；②RTK 通路的 Ras-MAPK 级联，生长因子受体激活 Ras，再逐级激活 Raf、MEK、ERK，ERK 进入细胞核调节基因表达，同时通过负反馈去磷酸化限制信号强度；③霍乱毒素使 Gs 持续活化，cAMP 长期升高，肠道上皮细胞大量分泌 Cl⁻ 与水，引起剧烈腹泻，是调控失效的典型例证。（4）结论：细胞信号转导通路不是固定的单向线路，而是由受体、G 蛋白、第二信使、激酶与磷酸酶构成的可调、可放大、可整合并具有反馈调节的网络，使细胞对刺激作出适时、适度的反应。",false]]},{"kind":"mcq","stem":"一氧化氮作用于血管平滑肌时，直接激活的受体或酶是（ ）。","opts":{"A":"G 蛋白偶联受体","B":"可溶性鸟苷酸环化酶","C":"腺苷酸环化酶","D":"受体酪氨酸激酶"},"ans":"B","explain":"NO 是脂溶性气体信号分子，可扩散进入邻近的平滑肌细胞，直接激活可溶性鸟苷酸环化酶，使 GTP 生成 cGMP；cGMP 激活 PKG，引起平滑肌舒张。硝酸甘油缓解心绞痛，本质上就是增加 NO 信号。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"动物细胞内促使内质网储存 Ca²⁺ 释放的第二信使是（ ）。","opts":{"A":"IP₃","B":"DAG","C":"cAMP","D":"cGMP"},"ans":"A","explain":"IP₃ 是水溶性第二信使，可扩散到内质网并打开 IP₃ 受体钙通道，使 Ca²⁺ 从内质网钙库释放。DAG 留在质膜上，负责与 Ca²⁺ 共同激活 PKC，不能代替 IP₃ 直接打开内质网钙通道。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"偶联 G 蛋白的 cAMP 信号途径中，激活型与抑制型途径的共同点是（ ）。","opts":{"A":"G 蛋白均作用于腺苷酸环化酶（AC）","B":"都有相同的 G 蛋白","C":"都有相同的受体","D":"都使 cAMP 含量上升"},"ans":"A","explain":"激活型通路中 Gs 激活腺苷酸环化酶，抑制型通路中 Gi 抑制同一种效应酶，因此共同点是 G 蛋白最终都作用于腺苷酸环化酶。两条通路的受体不同，G 蛋白分别为 Gs 与 Gi，产生的 cAMP 变化方向也相反。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：细胞信号转导概述",false]]},{"kind":"num","runs":[["名词解释或简答：G 蛋白偶联受体介导的信号转导",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":20},{"title":"10月20日 · 细胞信号转导（下）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第11章 细胞信号转导（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞信号转导概述；考点2 G 蛋白偶联受体介导的信号转导；考点3 酶联受体介导的信号转导",false]]},{"kind":"bullet","runs":[["本日精读：考点3 酶联受体介导的信号转导",false]]}]},{"key":"understand","title":"先理解：RTK、Ras–MAPK 与 PI3K–Akt","blocks":[{"kind":"p","runs":[["先分清：GPCR 与受体酪氨酸激酶不是一类受体。",true]]},{"kind":"bullet","runs":[["GPCR：一条多肽链七次跨膜，靠膜内侧三聚体 G 蛋白传递信号，典型第二信使是 cAMP、IP₃、DAG、Ca²⁺，通常负责感觉、神经、激素和分泌等快速反应。",false]]},{"kind":"bullet","runs":[["RTK：受体酪氨酸激酶，通常只有一次跨膜；配体结合后两个受体形成二聚体，胞内段互相磷酸化，靠磷酸酪氨酸招募含 SH2 结构域的下游蛋白，常调控增殖、分化、存活和代谢。",false]]},{"kind":"diagram","type":"rtk","title":"图解：RTK 怎样从质膜把信号送进细胞核","caption":"关键开关是二聚化与酪氨酸自磷酸化；磷酸酪氨酸成为胞内蛋白的停靠位点。"},{"kind":"p","runs":[["RTK 的第一步：配体诱导二聚化与自磷酸化。",true]]},{"kind":"p","runs":[["生长因子与 RTK 的胞外结构域结合后，两个受体分子靠近并形成二聚体。二聚体中的激酶结构域互相把对方的酪氨酸残基磷酸化，这叫自磷酸化。磷酸酪氨酸不是给细胞提供能量，而是变成“停靠位点”：含有 SH2 或 PTB 结构域的接头蛋白可以识别并结合这些位点，于是信号从膜上向胞内传递。",false]]},{"kind":"p","runs":[["Ras–MAPK 支路：从膜上接到细胞核。",true]]},{"kind":"bullet","runs":[["配体 → RTK 二聚化 → 酪氨酸自磷酸化；",false]]},{"kind":"bullet","runs":[["磷酸酪氨酸招募接头蛋白 GRB2，GRB2 再招募鸟苷酸交换因子 SOS；",false]]},{"kind":"bullet","runs":[["SOS 促使 Ras 释放 GDP、结合 GTP，Ras 由关闭态转为开启态；",false]]},{"kind":"bullet","runs":[["Ras-GTP 激活 Raf（MAPKKK），Raf 激活 MEK（MAPKK），MEK 激活 ERK（MAPK）；",false]]},{"kind":"bullet","runs":[["ERK 进入细胞核并磷酸化转录因子，促进 cyclin D 等基因表达，细胞从 G₁ 期进入增殖程序。",false]]},{"kind":"p","runs":[["这条链的本质是三次连续的蛋白激酶磷酸化，所以叫 MAPK 级联。每一级激酶都磷酸化下一级，信号被放大并形成严格顺序，避免通路随意串线。",false]]},{"kind":"p","runs":[["RTK 还有一条重要的 PI3K–Akt 支路。",true]]},{"kind":"p","runs":[["RTK 的磷酸酪氨酸还可招募 PI3K。PI3K 把膜上的 PIP₂ 磷酸化为 PIP₃；Akt 通过 PH 结构域结合 PIP₃，并在 PDK1 等激酶帮助下活化。Akt 促进细胞存活、增殖和代谢，抑制凋亡。PTEN 能把 PIP₃ 去磷酸化变回 PIP₂，因此 PTEN 是这条通路的刹车。PI3K 或 Akt 过度活化、PTEN 缺失，都会让细胞获得更强的存活和增殖能力。",false]]},{"kind":"p","runs":[["为什么通路必须能够关闭？",true]]},{"kind":"p","runs":[["Ras 自身具有较低的 GTP 酶活性，GAP 能显著加速 GTP 水解，使 Ras 回到 GDP 结合的关闭态；RTK 会被内吞、降解或去磷酸化；ERK 也会受到负反馈抑制。若 Ras 发生突变而失去 GTP 酶活性，Ras-GTP 就会长期存在，MAPK 通路持续开启。这正是许多肿瘤中 Ras 突变驱动无限增殖的原因。",false]]},{"kind":"p","runs":[["考试时怎样快速判断是哪条通路？",true]]},{"kind":"bullet","runs":[["看到七次跨膜、三聚体 G 蛋白、cAMP、IP₃、DAG、PKA、PKC，优先想到 GPCR 通路。",false]]},{"kind":"bullet","runs":[["看到生长因子、受体二聚化、酪氨酸自磷酸化、SH2、Ras、Raf、MEK、ERK，优先想到 RTK–MAPK 通路。",false]]},{"kind":"bullet","runs":[["看到 PIP₃、Akt、PTEN、细胞存活与代谢，想到 RTK–PI3K–Akt 支路。",false]]},{"kind":"bullet","runs":[["看到 Gs 持续活化与剧烈水样腹泻，想到霍乱毒素；看到 NO、cGMP、PKG 与血管舒张，想到可溶性鸟苷酸环化酶通路。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["RTK 的开关",true]]},{"kind":"p","runs":[["配体结合使受体酪氨酸激酶（RTK）二聚化并发生酪氨酸自磷酸化；磷酸酪氨酸成为 SH2/PTB 结构域的停靠位点。",false]]},{"kind":"p","runs":[["Ras–MAPK 支路",true]]},{"kind":"p","runs":[["RTK → GRB2 → SOS → Ras-GTP → Raf → MEK → ERK → 转录因子 → 增殖相关基因表达。",false]]},{"kind":"p","runs":[["PI3K–Akt 支路",true]]},{"kind":"p","runs":[["RTK → PI3K → PIP₂ 变为 PIP₃ → Akt 活化 → 促进存活、增殖与代谢；PTEN 使 PIP₃ 变回 PIP₂，是该通路的刹车。",false]]},{"kind":"p","runs":[["与 GPCR 的核心区别",true]]},{"kind":"p","runs":[["GPCR 靠七次跨膜受体与三聚体 G 蛋白，反应多为秒到分钟级；RTK 靠二聚化、自磷酸化与激酶级联，反应多为分钟到小时级，更常调控增殖、分化与存活。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"PIP₂ 水解后产生哪两种第二信使？","opts":{"A":"IP₃ 与 DAG","B":"ATP 与 ADP","C":"cAMP 与 cGMP","D":"NAD⁺ 与 FAD"},"ans":"A","explain":"磷脂酶 C（PLC）水解质膜中的 PIP₂，生成水溶性的 IP₃ 与留在膜上的 DAG。IP₃ 促使内质网释放 Ca²⁺，DAG 与 Ca²⁺ 共同激活 PKC，因此二者构成双信使系统。","src":"811真题·2025"},{"kind":"p","runs":[["如何理解细胞信号转导通路的可调控性？请举例说明。",true]]},{"kind":"p","runs":[["答案：（1）通路的基本组成：以 G 蛋白偶联受体通路为例，细胞信号转导通路由配体、受体、G 蛋白、效应酶、第二信使与蛋白激酶级联组成，信号经逐级传递并逐级放大，最终引起基因表达或代谢的改变。（2）可调控性的来源：①受体水平——受体的数量、亲和力与亚型分布可调，细胞可通过受体的上调或下调改变对信号的敏感程度；②G 蛋白水平——G 蛋白在 GTP 结合的活化态与 GDP 结合的失活态之间循环，其开关速率受 GEF 与 GAP 调控；③第二信使水平——cAMP、IP₃、Ca²⁺ 等的合成与降解速率决定信号的强度与持续时间；④磷酸化水平——蛋白激酶与蛋白磷酸酶作用相反，磷酸化与去磷酸化的平衡决定底物的活性状态；⑤反馈与限制——下游产物可反馈抑制上游组分，抑制蛋白与支架蛋白使信号具有时空特异性。（3）举例：①cAMP 通路中 Gs 与 Gi 的拮抗，Gs 激活腺苷酸环化酶使 cAMP 升高，Gi 则抑制之，同一刺激可通过不同 G 蛋白给出相反结果；②RTK 通路的 Ras-MAPK 级联，生长因子受体激活 Ras，再逐级激活 Raf、MEK、ERK，ERK 进入细胞核调节基因表达，同时通过负反馈去磷酸化限制信号强度；③霍乱毒素使 Gs 持续活化，cAMP 长期升高，肠道上皮细胞大量分泌 Cl⁻ 与水，引起剧烈腹泻，是调控失效的典型例证。（4）结论：细胞信号转导通路不是固定的单向线路，而是由受体、G 蛋白、第二信使、激酶与磷酸酶构成的可调、可放大、可整合并具有反馈调节的网络，使细胞对刺激作出适时、适度的反应。",false]]},{"kind":"mcq","stem":"一氧化氮作用于血管平滑肌时，直接激活的受体或酶是（ ）。","opts":{"A":"G 蛋白偶联受体","B":"可溶性鸟苷酸环化酶","C":"腺苷酸环化酶","D":"受体酪氨酸激酶"},"ans":"B","explain":"NO 是脂溶性气体信号分子，可扩散进入邻近的平滑肌细胞，直接激活可溶性鸟苷酸环化酶，使 GTP 生成 cGMP；cGMP 激活 PKG，引起平滑肌舒张。硝酸甘油缓解心绞痛，本质上就是增加 NO 信号。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"动物细胞内促使内质网储存 Ca²⁺ 释放的第二信使是（ ）。","opts":{"A":"IP₃","B":"DAG","C":"cAMP","D":"cGMP"},"ans":"A","explain":"IP₃ 是水溶性第二信使，可扩散到内质网并打开 IP₃ 受体钙通道，使 Ca²⁺ 从内质网钙库释放。DAG 留在质膜上，负责与 Ca²⁺ 共同激活 PKC，不能代替 IP₃ 直接打开内质网钙通道。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"偶联 G 蛋白的 cAMP 信号途径中，激活型与抑制型途径的共同点是（ ）。","opts":{"A":"G 蛋白均作用于腺苷酸环化酶（AC）","B":"都有相同的 G 蛋白","C":"都有相同的受体","D":"都使 cAMP 含量上升"},"ans":"A","explain":"激活型通路中 Gs 激活腺苷酸环化酶，抑制型通路中 Gi 抑制同一种效应酶，因此共同点是 G 蛋白最终都作用于腺苷酸环化酶。两条通路的受体不同，G 蛋白分别为 Gs 与 Gi，产生的 cAMP 变化方向也相反。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：酶联受体介导的信号转导",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":21},{"title":"10月21日 · 细胞周期与细胞分裂","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第12章 细胞周期与细胞分裂（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞周期；考点2 细胞分裂",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞周期",false]]},{"kind":"p","runs":[["第12章 细胞周期与细胞分裂（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞周期；考点2 细胞分裂",false]]},{"kind":"bullet","runs":[["本日精读：考点2 细胞分裂",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["细胞周期与检查点",true]]},{"kind":"p","runs":[["G1、S、G2与M期；G1/S、G2/M与M中期三个检查点分别检查DNA损伤、复制完整与染色体排列。",false]]},{"kind":"p","runs":[["MPF",true]]},{"kind":"p","runs":[["MPF由cyclinB与CDK1组成，cdc25去磷酸化激活后驱动G2/M转换；cyclinB经APC泛素化降解使细胞退出M期。",false]]},{"kind":"p","runs":[["减数分裂",true]]},{"kind":"p","runs":[["前期Ⅰ经细线、偶线、粗线、双线、终变；联会复合体在同源染色体配对与重组中起作用；经两次分裂产生4个单倍体配子。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["细胞周期蛋白（cyclin）有哪些特征和功能？",true]]},{"kind":"p","runs":[["答案：周期蛋白在细胞周期中周期性合成与降解，其含量随周期时相波动；它与 CDK 结合形成复合物，激活 CDK 的蛋白激酶活性，决定底物特异性并引导 CDK 定位。cyclinB 与 CDK1组成 MPF 驱动 G2/M 转换；cyclinA 参与 S 期与 M 期调控；cyclin 的降解由 APC 介导的泛素化途径完成，使细胞退出分裂。",false]]},{"kind":"mcq","stem":"在有丝分裂过程中，使用 ）可以抑制纺锤体的形成。","opts":{"A":"秋水仙素","B":"紫杉酚","C":"羟基脲","D":"细胞松弛素B"},"ans":"A","explain":"秋水仙素是一种生物碱，可以抑制微管聚合，从而抑制细胞纺锤体的形成， 将细胞阻断在细胞分裂中期。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"在有丝分裂的哪个时期染色体最分散？（）［中科院-中科大 2007年 研」","opts":{"A":"前期","B":"前中期","C":"中期","D":"后期"},"ans":"A","explain":"B 项，前中期的一个特征性现象是染色体整列，染色体彼此靠近慢慢排列 在赤道板上。C项，中期染色体已完成整列，规则的排列在赤道板上。D项，后期染色 体在纺锤丝的牵引下移向细胞两极，排列较规则。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"在减数分裂S 期 DNA 并不完全复制，大约还有（）DNA 是在偶线期 合成的。","opts":{"A":"100%","B":"50%","C":"10%","D":"0.3%"},"ans":"D","explain":"偶线期发生的重要事件：①同源染色体配对；②合成在S 期未合成的约 0.3%的DNA（偶线期 DNA）。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列关于纺锤体的叙述正确的是（）。","opts":{"A":"由微管和微管结合蛋白组成","B":"有动力微管和极性微管两种类型","C":"是细胞分裂中染色体分离相关细胞器","D":"以上全对"},"ans":"D","explain":"纺锤体是细胞分裂中染色体分离相关细胞器，由微管和微管结合蛋白组成， 分为动力微管和极性微管两种类型。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：细胞周期",false]]},{"kind":"num","runs":[["名词解释或简答：细胞分裂",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":22},{"title":"10月22日 · 机动复习：默写高频名词","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["今天只做名词解释的闭卷默写。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"bullet","runs":[["抽 20 个高频名词：流动镶嵌模型、钠钾泵、半自主性、信号肽、导肽、联会复合体、MPF、第二信使等。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"bullet","runs":[["对照标准答案逐条订正。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["写错的名词各抄三遍。",false]]}]}],"n":23},{"title":"10月23日 · 细胞增殖调控与癌细胞","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第13章 细胞增殖调控与癌细胞（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞增殖调控；考点2 癌细胞",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞增殖调控",false]]},{"kind":"p","runs":[["第13章 细胞增殖调控与癌细胞（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞增殖调控；考点2 癌细胞",false]]},{"kind":"bullet","runs":[["本日精读：考点2 癌细胞",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["周期调控",true]]},{"kind":"p","runs":[["cyclin周期性合成降解并与CDK结合激活其激酶活性；CDK抑制因子与APC泛素化降解cyclin调控周期进程。",false]]},{"kind":"p","runs":[["癌基因与抑癌基因",true]]},{"kind":"p","runs":[["癌基因由原癌基因激活突变而来，促进增殖；p53、Rb等抑癌基因失活后失去抑制，导致肿瘤。",false]]},{"kind":"p","runs":[["肿瘤细胞特征",true]]},{"kind":"p","runs":[["无限增殖、失接触抑制、侵袭转移、逃避凋亡、基因组不稳定、Warburg效应。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"p53 与 KRAS 的突变类型分别是","opts":{"A":"都属抑癌基因突变","B":"p53 为抑癌基因失活型，KRAS 为原癌基因激活型","C":"p53 为激活型，KRAS 为失活型","D":"都属原癌基因激活型"},"ans":"B","explain":"p53 是抑癌基因，失活后丧失监视功能；KRAS 是原癌基因，激活突变后持续传递增殖信号。","src":"811真题·2025"},{"kind":"mcq","stem":"有活性的 CDK1 激酶符合下列何种描述？","opts":{"A":"与周期蛋白以复合物形式存在","B":"Thr161 去磷酸化","C":"Thr14 和 Tyr15 磷酸化","D":"与之结合的周期蛋白泛素化"},"ans":"A","explain":"CDK 激酶激活的途径包括：① CDK 蛋白本身不具有蛋白激酶活性；②当 周期蛋白 B/A 含量积累到一定值时，二者相互结合形成复合体，但不表现出激酶活性； 88 周期蛋白与 CDK 的结合是 CDK 激酶活性表现的先决条件；③在 weel/mikl 和 CAK 激 酶的催化下，CDK 的 Thrl4、Tyr15、Thr161 磷酸化，形成高度磷酸化的周期蛋白 CDK 复合体，但仍不具备激酶活性：④在磷酸酶 Cdc25C 的催化下，Thr14 和 Tyr15 去磷 酸化，CDK 激酶活性才能表现出来。Thr161 位点保持磷酸化状态是 CDK1 激酶活性表 现所必需的前提。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"癌细胞的主要特点之一是（）。","opts":{"A":"细胞间黏附性增强","B":"缺少接触抑制作用","C":"对生长因子的需求量上升","D":"增殖力下降"},"ans":"B","explain":"AB 两项，癌细胞几乎丧失细胞间的黏着，相互之间不产生抑制作用，更 有利于快速繁殖。C项，由于癌细胞的增殖能力增强，其对生长因子的需求量下降。D项， 癌细胞的一个典型特征就是增殖力增强。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"Rb 和p53 都是抑癌基因，能与 DNA 特异性结合，真蛋白活性主要受（） 调控。","opts":{"A":"糖基化","B":"羟基化","C":"磷酸化","D":"羧基化"},"ans":"C","explain":"Rb 蛋白的磷酸化/去磷酸化是其调节细胞生长分化的主要形式。P53 主要 集中于核仁区，能与 DNA 特异结合，其活性亦受磷酸化调控。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"关于肿瘤细胞的增殖特征，下列说法不正确的是（）。","opts":{"A":"肿瘤细胞在增殖过程中，不会失去接触依赖性抑制","B":"肿瘤细胞都有恶性增殖和侵袭、转移的能力","C":"肿瘤细胞和胚胎细胞某些特征相似，如无限增殖的特性","D":"肿瘤细胞来源于正常细胞，但是多表现为去分化"},"ans":"A","explain":"正常细胞生长到彼此相互接触时，其运动和分裂活动将会停止，即接触抑 90 制。肿瘤细胞失去运动和分裂的接触抑制，这也是恶性肿瘤易发生转移的原因。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：细胞增殖调控",false]]},{"kind":"num","runs":[["名词解释或简答：癌细胞",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":24},{"title":"10月24日 · 细胞分化与干细胞","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第14章 细胞分化与干细胞（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞分化；考点2 干细胞",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞分化",false]]},{"kind":"p","runs":[["第14章 细胞分化与干细胞（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞分化；考点2 干细胞",false]]},{"kind":"bullet","runs":[["本日精读：考点2 干细胞",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["细胞分化",true]]},{"kind":"p","runs":[["同一来源细胞在形态、结构与功能上产生稳定性差异，本质是基因选择性表达。",false]]},{"kind":"p","runs":[["细胞全能性",true]]},{"kind":"p","runs":[["一个细胞发育成完整个体的潜能；分化程度越高全能性越弱。",false]]},{"kind":"p","runs":[["干细胞与iPS",true]]},{"kind":"p","runs":[["干细胞具自我更新与多向分化能力；iPS由体细胞导入Oct4、Sox2、Klf4、c-Myc重编程获得。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"以下哪种细胞的发育潜能最高？（ ）","opts":{"A":"multipotent cells","B":"pluripotent cells","C":"monopotent cells","D":"Totipotent cells"},"ans":"D","explain":"一般情况下，在整个发育过程中，细胞分化潜能逐渐受到越来越多的限制 而变窄，即由全能性细胞转化为多能和单能干细胞，因此全能干细胞 Totipotent cells 的发育潜能最高。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列哪类细胞具有分化能力？（）","opts":{"A":"肝细胞","B":"肾细胞","C":"胚胎细胞","D":"神经细胞"},"ans":"C","explain":"AB 两项，肝细胞、肾细胞都属于GO期细胞，丧失分化能力。D项，神 经细胞属于终端分化细胞，失去分化能力。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列哪种是终端分化细胞？（）","opts":{"A":"神经元","B":"骨髓干细胞","C":"肝细胞","D":"表皮细胞"},"ans":"A","explain":"终端分化细胞的结构和功能发生高度分化，已经丧失增殖能力，终生处于 GO期，直到衰老死亡。如：人的红细胞、神经元细胞和骨骼肌细胞等。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"对于干细胞，下面说法正确的是（）。［中科院-中科大 2004年研］","opts":{"A":"动物胚胎干细胞具有全能性 （totipotency）","B":"动物多能造血干细胞也具有全能性 96","C":"在动物细胞发育过程中，细胞核的分化全能性会逐步减弱变窄","D":"从多莉羊试验看出，动物的体细胞可以独立分化诱导成一个完整的新个体 E. 以上答案都不对"},"ans":"C","explain":"AB 两项，动物的胚胎干细胞和多能造血干细胞，不具有发育成完整个体 的潜能，因此不具有全能性。D项，多莉羊试验中，经过核移植的细胞需要转入母羊内， 在体内特定的生理条件下进行诱导发育，因此，动物体细胞不能独立分化诱导成一个完 整新个体。","src":"考点笔记·考研例题"},{"kind":"fib","stem":"分化细胞基因组中所表达的基因大致分为两种基本类型：一类是[[0]]，另一类称为[[1]]。","ans":[["管家基因","持家基因"],["组织特异性基因","奢侈基因"]],"explain":"分化细胞基因组中表达的基因分为两类：管家基因是维持细胞基本生命活动所必需、在各种细胞中都表达的基因；组织特异性基因（奢侈基因）只在特定类型的细胞中表达。","src":"考研真题 · 安徽师范大学 2019 年","order":"any"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：细胞分化",false]]},{"kind":"num","runs":[["名词解释或简答：干细胞",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":25},{"title":"休息日","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["今天休息，不安排新内容。如果还有余力，可以花 10 分钟翻一遍昨天学的内容。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["（休息日无背诵任务，好好放松。）",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["——",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"p","runs":[["——",false]]}]}],"n":26},{"title":"10月26日 · 细胞死亡与细胞衰老","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第15章 细胞死亡与细胞衰老（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞程序性死亡；考点2 细胞衰老",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞程序性死亡",false]]},{"kind":"p","runs":[["第15章 细胞死亡与细胞衰老（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞程序性死亡；考点2 细胞衰老",false]]},{"kind":"bullet","runs":[["本日精读：考点2 细胞衰老",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["细胞凋亡",true]]},{"kind":"p","runs":[["基因控制的程序化死亡；外源途径经死亡受体激活caspase8，内源途径经线粒体释放细胞色素c激活caspase9，最终激活caspase3。",false]]},{"kind":"p","runs":[["凋亡与坏死",true]]},{"kind":"p","runs":[["凋亡是主动、程序化、形成凋亡小体、不引起炎症；坏死是被动、细胞肿胀破裂、引起炎症。",false]]},{"kind":"p","runs":[["细胞衰老",true]]},{"kind":"p","runs":[["端粒随分裂缩短达Hayflick界限；自由基氧化损伤累积；p53-p21-Rb通路导致细胞周期阻滞。",false]]},{"kind":"p","runs":[["细胞自噬",true]]},{"kind":"p","runs":[["自噬泡包裹胞内受损成分运送至溶酶体降解，饥饿时供能并清除受损成分。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"下列分子哪些与细胞凋亡有关？（）","opts":{"A":"磷脂酰丝氨酸","B":"磷脂酰乙醇胺","C":"磷脂酰胆碱 101","D":"磷脂酰肌醇"},"ans":"A","explain":"当细胞凋亡时，膜内侧磷脂酰丝氨酸外翻到膜表面，胞膜结构仍然完整，最 终可将凋亡细胞遗骸分割包裹为几个凋亡小体，无内含物外溢，因此不引起周围的炎症 反应，凋亡小体可迅速被周围专职或非专职吞噬细胞吞噬。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"在 caspases 家族中，起细胞凋亡执行者作用的是（ ）。","opts":{"A":"caspase-1， -4，-11","B":"caspase-2，-8，-9","C":"caspase-3， -6，-7","D":"caspase-3，-5，-10"},"ans":"C","explain":"在 caspases 家族中，凋亡起始者包括 caspase-2，-8，-9，-10，-11；J 亡执行者包括 caspase-3，-6，-7。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列关于细胞凋亡说法中，哪项不正确？（）","opts":{"A":"细胞凋亡是一种正常的生理现象","B":"细胞凋亡受多种因素影响","C":"细胞凋亡过程是受调控的过程","D":"细胞凋亡的形态学特征是细胞结构的全面溶解"},"ans":"D","explain":"细胞凋亡最重要的特征是整个过程中细胞膜始终保持完整，细胞内含物不准 漏到细胞外。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列哪项不属于细胞衰老的特征？（）","opts":{"A":"原生质减少，细胞形状改变 103","B":"细胞膜磷脂含量下降，胆固醇含量上升","C":"线粒体数目减少，核膜内折","D":"脂褐素减少，细胞代谢能力下降"},"ans":"D","explain":"细胞衰老的特征之一是细胞色素颗粒沉积增多，如脂褐素在胞浆中沉积随 老年化过程而增加，在肝细胞、肌细胞和神经细胞中的积聚更为明显。","src":"考点笔记·考研例题"},{"kind":"p","runs":[["名词解释：细胞自噬",true]]},{"kind":"p","runs":[["答案：细胞自噬是指细胞通过溶酶体与双层膜包裹的细胞自身物质融合，从而降解细胞自身物质的过程。正常的动物细胞为了维持细胞内环境的动态平衡，需要不断降解功能失常或不需要的细胞结构，如各种蛋白质、细胞器以及胞质组分。通常，寿命较短的蛋白质如调控蛋白等通过泛素-蛋白酶体系统进行降解；而寿命较长的细胞结构及蛋自质通过细胞自噬途径，由溶酶体进行降解。细胞自噬的特征是细胞中出现大的双层膜包裹的自噬泡即自噬小体。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：细胞程序性死亡",false]]},{"kind":"num","runs":[["名词解释或简答：细胞衰老",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":27},{"title":"10月27日 · 细胞的社会联系（上）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第16章 细胞的社会联系（第1部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞连接；考点2 细胞黏着；考点3 细胞外基质",false]]},{"kind":"bullet","runs":[["本日精读：考点1 细胞连接；考点2 细胞黏着",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["细胞连接",true]]},{"kind":"p","runs":[["紧密连接封闭细胞间隙形成屏障；间隙连接由连接蛋白形成通道介导通讯；锚定连接连接细胞与基质。",false]]},{"kind":"p","runs":[["细胞外基质",true]]},{"kind":"p","runs":[["由胶原、蛋白聚糖、糖蛋白构成，经整联蛋白连接细胞骨架，提供支持并调控细胞行为。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"下列连接方式中，除了（ ）外，都有通讯的作用。［中科院-中科大 2007 年研］","opts":{"A":"桥粒连接","B":"间隙连接","C":"胞间连丝","D":"化学突触"},"ans":"A","explain":"通讯连接主要包括动物细胞间的间隙连接、神经元之间或神经元与效应细 胞间的化学突触和植物细胞间的胞间连丝。A 项，桥粒连接属于锚定连接的一种。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"有关纤连蛋白，下面说法错误的是（）。","opts":{"A":"纤连蛋白的膜蛋白受体为整合素家族成员之一，具有与 RGD 高亲和性结合部位","B":"纤连蛋白是高分子量糖蛋白，各亚单位在C 端形成二硫键交联","C":"不同的亚单位是不同基因的表达产物，每个亚单位有数个结构域构成","D":"血浆纤连蛋白是二聚体，由相似的 A 链及 B 链组成，整个分子呈V 型，细胞 107 纤连蛋白是多聚体"},"ans":"C","explain":"纤连蛋白的两个亚基是同一基因的表达产物，只是转录后 RNA 的剪切方 式不同而产生不同的 mRNA。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"体外培养的成纤维细胞通过（）附着在培养瓶上。","opts":{"A":"黏着斑","B":"黏着带","C":"桥粒","D":"半桥粒"},"ans":"A","explain":"体外培养的成纤维细胞通过黏着斑附着在培养皿基质上，微丝终止于黏着 斑处，这种结构有助于维持细胞在运动过程中的张力以及影响细胞生长的信号传递。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"下列物质中除（）外，都是细胞外基质的组成成分。例题】 年研］","opts":{"A":"胶原 109","B":"层粘连蛋白","C":"整联蛋白","D":"蛋白聚糖"},"ans":"C","explain":"细胞外基质的成分主要有 3 种类型：①结构蛋白，包括胶原和弹性蛋白； ②蛋白聚糖，由蛋白和多糖共价形成；③粘连糖蛋白，包括纤连蛋白和层粘连蛋白。","src":"考点笔记·考研例题"},{"kind":"fib","stem":"与中间纤维有关的细胞连接方式有[[0]] 和 [[1]]，与微丝有关的细胞连接方式有[[2]] 和 [[3]]。","ans":[["桥粒"],["半桥粒"],["黏着带","黏合带"],["黏着斑","黏合斑"]],"explain":"锚定连接按参与连接的骨架纤维性质不同分为两类：与中间纤维相连的锚定连接包括桥粒和半桥粒；与肌动蛋白纤维（微丝）相连的锚定连接主要有黏着带和黏着斑。","src":"考研真题 · 浙江师范大学 2011 年","order":[[0,1],[2,3]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释或简答：细胞连接",false]]},{"kind":"num","runs":[["名词解释或简答：细胞黏着",false]]},{"kind":"num","runs":[["闭卷默写本章的标志性定义与关键过程各一条。",false]]}]}],"n":28},{"title":"10月28日 · 细胞的社会联系（下）","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["第16章 细胞的社会联系（第2部分）",true]]},{"kind":"bullet","runs":[["本章考点：考点1 细胞连接；考点2 细胞黏着；考点3 细胞外基质",false]]},{"kind":"bullet","runs":[["本日精读：考点3 细胞外基质",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["细胞连接",true]]},{"kind":"p","runs":[["紧密连接封 化细胞经导入山中因子（Oct4、Sox2、Klf4、c-Myc）重编程获得，绕开胚胎来源的伦理问题。",true]]},{"kind":"p","runs":[["二、生殖细胞：由原始生殖细胞经减数分裂形成配子（精子与卵子），是遗传信息传递的载体。核心知识点在减数分裂：同源染色体联会、交叉互换、染色体数目减半；受精时精卵融合恢复二倍体。",true]]},{"kind":"p","runs":[["三、肿瘤细胞：无限增殖、丧失接触抑制、侵袭与转移、逃避凋亡、代谢重编程（有氧糖酵解，即 Warburg 效应）、基因组不稳定。分子基础是原癌基因激活（如 Ras、EGFR）与抑癌基因失活（如 p53、Rb）。",true]]},{"kind":"p","runs":[["四、免疫细胞：分固有免疫细胞（中性粒细胞、巨噬细胞、树突状细胞、自然杀伤 NK 细胞）与适应性免疫细胞（B 细胞介导体液免疫、T 细胞介导细胞免疫）。详见下一个模块的免疫专题。",true]]},{"kind":"p","runs":[["五、神经细胞：神经元由胞体、树突、轴突构成，通过动作电位与突触（化学突触释放神经递质）传递信息；胶质细胞（星形胶质、少突胶质、小胶质）提供支持、髓鞘与免疫监视。轴突运输依赖微管与驱动蛋白、动力蛋白。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"以下哪种生物不是典型的单细胞生物","opts":{"A":"褐藻","B":"大肠杆菌","C":"酿酒酵母","D":"硫化叶菌"},"ans":"A","explain":"褐藻是多细胞真核生物，其余为单细胞。","src":"811真题·2024"},{"kind":"p","runs":[["什么是真核细胞的微核？产生的原因是什么？其生物学意义如何？",true]]},{"kind":"p","runs":[["答案：微核是细胞分裂后期，染色体片段或整条染色体因纺锤体功能异常或 DNA 损伤未能进入主核，而在细胞质中形成的膜包被小核。形成原因包括物理因素（电离辐射、紫外线致 DNA 双链断裂）、化学因素（诱变剂、重金属、化疗药物抑制纺锤体组装）、生物因素（病毒感染、细胞衰老、基因突变）。意义：作为遗传毒性与染色体损伤的标志物，用于药物安全性检测与环境致癌物筛查，并与细胞衰老、肿瘤发生和染色体不稳定密切相关。",false]]},{"kind":"mcq","stem":"建立分泌单克隆抗体的杂交瘤细胞是通过下列哪种技术构建的？（）","opts":{"A":"细胞融合","B":"核移植","C":"病毒转化","D":"基因转移"},"ans":"A","explain":"杂交瘤细胞是利用瘤细胞与特异性抗原免疫的 B 淋巴细胞进行细胞融合 制得的。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"Rb 和p53 都是抑癌基因，能与 DNA 特异性结合，真蛋白活性主要受（） 调控。","opts":{"A":"糖基化","B":"羟基化","C":"磷酸化","D":"羧基化"},"ans":"C","explain":"Rb 蛋白的磷酸化/去磷酸化是其调节细胞生长分化的主要形式。P53 主要 集中于核仁区，能与 DNA 特异结合，其活性亦受磷酸化调控。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"以下哪种细胞的发育潜能最高？（ ）","opts":{"A":"multipotent cells","B":"pluripotent cells","C":"monopotent cells","D":"Totipotent cells"},"ans":"D","explain":"一般情况下，在整个发育过程中，细胞分化潜能逐渐受到越来越多的限制 而变窄，即由全能性细胞转化为多能和单能干细胞，因此全能干细胞 Totipotent cells 的发育潜能最高。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：干细胞、诱导多能干细胞（iPS）、肿瘤细胞、神经元。",false]]},{"kind":"num","runs":[["简答：干细胞按来源和分化潜能如何分类？",false]]},{"kind":"num","runs":[["简答：肿瘤细胞有哪些主要生物学特征？",false]]},{"kind":"num","runs":[["简答：神经细胞的结构与信息传递方式。",false]]},{"kind":"num","runs":[["论述：干细胞研究的意义与潜在应用（联系类器官与再生医学）。",false]]}]}],"n":30},{"title":"10月30日 · 免疫（上）：两条防线","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["你是跨考生，免疫属于底层知识缺失区，第一遍看教材会觉得抽象。",false]]},{"kind":"bullet","runs":[["811 的免疫相关考点集中在第 12 章，2024、2026 都有直接命题。",false]]},{"kind":"bullet","runs":[["复习方法：先记两条防线的对比框架，再记具体细胞和分子，最后记疾病案例。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、先天免疫（固有免疫）：机体与生俱来、不需要预先接触病原体即可启动的非特异性防御系统，是第一、第二道防线。识别方式是由胚系基因直接编码的模式识别受体（PRR）识别病原体共有的病原相关分子模式（PAMP），如 LPS、dsRNA、细菌 DNA。特点是反应快（数分钟到数小时）、无免疫记忆、特异性低但足以区分自我与非我。组成包括屏障（皮肤黏膜）、吞噬细胞、NK 细胞、补体、炎症反应、干扰素。",true]]},{"kind":"p","runs":[["二、适应性免疫（获得性免疫）：机体在接触特定抗原后才逐步产生的、具有高度特异性和免疫记忆的防御系统。识别方式是由基因重排产生的 BCR/TCR 识别特定抗原表位（epitope）。特点是特异性高、反应慢（首次 3—7 天）、有免疫记忆、具自身耐受。组成分体液免疫（B 细胞—抗体）与细胞免疫（T 细胞）。",true]]},{"kind":"p","runs":[["三、两者的关系：先天免疫是适应性免疫的启动者与效应放大器——树突状细胞摄取抗原后成熟，向 T 细胞提供抗原信号，从而启动适应性应答；抗体与补体、吞噬细胞协同清除病原体，反过来增强固有免疫。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"建立分泌单克隆抗体的杂交瘤细胞是通过下列哪种技术构建的？（）","opts":{"A":"细胞融合","B":"核移植","C":"病毒转化","D":"基因转移"},"ans":"A","explain":"杂交瘤细胞是利用瘤细胞与特异性抗原免疫的 B 淋巴细胞进行细胞融合 制得的。","src":"考点笔记·考研例题"},{"kind":"p","runs":[["名词解释：monoclonal antibody；单克隆抗体",true]]},{"kind":"p","runs":[["答案：monoclonal antibody 的中文名称是单克隆抗体。单克隆抗体是指由一个被特定抗原免疫的B 淋巴细胞与骨髓瘤细胞融合后形成的杂交细胞产生的针对该特异性抗原的抗体。单克隆抗体具有高度特异性，在生物学研究和临床上都有广泛而重要的用途。",false]]},{"kind":"p","runs":[["用二色荧光分别标记人和鼠细胞膜蛋白，将二细胞融合，进行荧光抗体免 疫实验，首先出现荧光扩散现象，当时间延长后，均匀分布在细胞表面的标记荧光会重 新排布，出现成斑现象。请解释为什么会出现上述两种似乎矛盾的现象。",true]]},{"kind":"p","runs":[["答案：出现上述两种似乎矛盾现象的原因如下：（1）由于细胞膜的流动性，人和鼠的细胞膜会融合，使得荧光均匀分布，即荧光扩散现象。（2）当时间延长后，已均匀分布的荧光会重新分布，聚集在细胞表面的某些部位，即成斑现象。成斑现象进一步证实了膜蛋白的流动性，其原因是二价的抗体分子交联相邻的膜蛋白分子使荧光聚集。这一现象也与膜蛋白和膜下骨架系统的相互作用以及质膜和细胞内膜系统之间的膜泡运输有关。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["简答：先天免疫与适应性免疫的识别方式、特点和组成有何不同？",false]]},{"kind":"num","runs":[["名词解释：PRR、PAMP、抗原表位、免疫记忆、自身耐受。",false]]},{"kind":"num","runs":[["简答：为什么说先天免疫是适应性免疫的启动者与效应放大器？",false]]},{"kind":"num","runs":[["简答：列举五类免疫细胞及其主要功能。",false]]}]}],"n":31},{"title":"10月31日 · 免疫（上）：免疫细胞谱系复述","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["今天只做一件事：不看笔记，把免疫细胞谱系与功能默写出来。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"bullet","runs":[["中性粒细胞：数量最多的固有免疫细胞，快速吞噬细菌，急性炎症的主力。",true]]},{"kind":"bullet","runs":[["巨噬细胞：吞噬病原体与衰老细胞，作为抗原呈递细胞，分泌细胞因子。",true]]},{"kind":"bullet","runs":[["树突状细胞（DC）：最强的抗原呈递细胞，连接固有免疫与适应性免疫的桥梁。",true]]},{"kind":"bullet","runs":[["自然杀伤细胞（NK）：不需预先致敏即可杀伤病毒感染细胞和肿瘤细胞。",true]]},{"kind":"bullet","runs":[["B 细胞：表面 BCR 识别抗原，活化后分化为浆细胞分泌抗体、或成为记忆 B 细胞，介导体液免疫。",true]]},{"kind":"bullet","runs":[["T 细胞：辅助性 T 细胞（Th，CD4⁺）分泌细胞因子协调免疫；细胞毒性 T 细胞（CTL，CD8⁺）直接杀伤靶细胞；调节性 T 细胞（Treg）抑制免疫、维持自身耐受。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"建立分泌单克隆抗体的杂交瘤细胞是通过下列哪种技术构建的？（）","opts":{"A":"细胞融合","B":"核移植","C":"病毒转化","D":"基因转移"},"ans":"A","explain":"杂交瘤细胞是利用瘤细胞与特异性抗原免疫的 B 淋巴细胞进行细胞融合 制得的。","src":"考点笔记·考研例题"},{"kind":"p","runs":[["名词解释：monoclonal antibody；单克隆抗体",true]]},{"kind":"p","runs":[["答案：monoclonal antibody 的中文名称是单克隆抗体。单克隆抗体是指由一个被特定抗原免疫的B 淋巴细胞与骨髓瘤细胞融合后形成的杂交细胞产生的针对该特异性抗原的抗体。单克隆抗体具有高度特异性，在生物学研究和临床上都有广泛而重要的用途。",false]]},{"kind":"p","runs":[["用二色荧光分别标记人和鼠细胞膜蛋白，将二细胞融合，进行荧光抗体免 疫实验，首先出现荧光扩散现象，当时间延长后，均匀分布在细胞表面的标记荧光会重 新排布，出现成斑现象。请解释为什么会出现上述两种似乎矛盾的现象。",true]]},{"kind":"p","runs":[["答案：出现上述两种似乎矛盾现象的原因如下：（1）由于细胞膜的流动性，人和鼠的细胞膜会融合，使得荧光均匀分布，即荧光扩散现象。（2）当时间延长后，已均匀分布的荧光会重新分布，聚集在细胞表面的某些部位，即成斑现象。成斑现象进一步证实了膜蛋白的流动性，其原因是二价的抗体分子交联相邻的膜蛋白分子使荧光聚集。这一现象也与膜蛋白和膜下骨架系统的相互作用以及质膜和细胞内膜系统之间的膜泡运输有关。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["默写六类免疫细胞及其功能。",false]]},{"kind":"num","runs":[["简答：先天免疫与适应性免疫的关系。",false]]}]}],"n":32},{"title":"休息日","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"p","runs":[["今天休息，不安排新内容。如果还有余力，可以花 10 分钟翻一遍昨天学的内容。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["（休息日无背诵任务，好好放松。）",false]]}]},{"key":"exam","title":"今日真题对 、钠钾泵循环、蛋白质分选路径、凋亡两条途径。",false]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"bullet","runs":[["画不出来说明没掌握，回到对应的一天。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["六张流程图各画一遍。",false]]}]}],"n":35},{"title":"11月4日 · 免疫（下）：HIV 与免疫缺陷","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["2024 简答与 2025 大题都涉及。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["病毒入侵宿主细胞的基本步骤：① 吸附——病毒表面蛋白与宿主细胞受体特异性结合（决定组织嗜性）；② 穿入与脱壳——膜融合或内吞后释放基因组；③ 生物合成——利用宿主机器复制核酸并翻译蛋白；④ 装配与释放——组装子代病毒并出芽或裂解释放。",true]]},{"kind":"p","runs":[["HIV 的侵入与致病链：gp120 结合 CD4⁺T 细胞表面 CD4 → 结合辅助受体 CCR5 或 CXCR4 → gp41 介导膜融合 → 逆转录酶将 RNA 逆转录为 DNA → 整合酶将前病毒整合入宿主基因组 → 转录翻译、装配出芽 → 感染并逐步清除 CD4⁺T 细胞。",true]]},{"kind":"p","runs":[["必背逻辑：HIV 开门（gp120 结合 CD4）→ 开双锁（CCR5/CXCR4）→ 撞门（gp41 融合）→ 写进档案（整合）→ 大量复制 → CD4⁺T 大量减少 → 细胞免疫崩溃 → 条件致病菌感染与恶性肿瘤 → AIDS。",true]]},{"kind":"p","runs":[["2024 简答题",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"p","runs":[["为什么艾滋病患者常死于其他感染性疾病？",true]]},{"kind":"p","runs":[["答案：HIV 通过 gp120结合 CD4与 CCR5/CXCR4侵入并破坏 CD4⁺T 细胞，使辅助性 T 细胞大量减少；细胞免疫与体液免疫失去协调，机体对条件致病菌和肿瘤无法产生有效应答，因而常死于机会性感染。",false]]},{"kind":"p","runs":[["HIV 感染导致艾滋病的原理。",true]]},{"kind":"p","runs":[["答案：HIV 表面 gp120结合 CD4⁺T 细胞的 CD4并借助 CCR5或 CXCR4共受体，gp41介导膜融合，病毒 RNA 逆转录为 DNA 后整合入宿主基因组，随宿主复制并出芽释放，逐步破坏 CD4⁺T 细胞；辅助性 T 细胞减少导致细胞免疫与体液免疫崩溃，最终因机会性感染或恶性肿瘤死亡。",false]]}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["默写 HIV 侵入宿主细胞的步骤。",false]]},{"kind":"num","runs":[["简答：为什么艾滋病患者容易死于机会性感染？",false]]}]}],"n":36},{"title":"11月5日 · 肿瘤细胞基础","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["第 12 章高频，常与信号通路、细胞周期、凋亡结合。",false]]}]},{"key":"must","title":"今日必须背诵 ★★★","blocks":[{"kind":"p","runs":[["一、癌基因与原癌基因：原癌基因是正常细胞中调控生长增殖的基因，发生突变、扩增或过表达后被激活成为癌基因（如 Ras、MYC、EGFR）。",true]]},{"kind":"p","runs":[["二、抑癌基因：正常时抑制细胞增殖、促进凋亡或修复 DNA，失活后促癌。典型是 p53（基因组保护神，DNA 损伤时阻滞周期或诱导凋亡）与 Rb（G1/S 检查点的闸门）。",true]]},{"kind":"p","runs":[["三、肿瘤细胞的生物学特征：无限增殖、失去接触抑制与生长因子依赖、侵袭与转移、逃避凋亡、诱导血管生成、基因组不稳定、代谢重编程（Warburg 效应，即有氧糖酵解）。",true]]}]},{"key":"exam","title":"今日真题对应","blocks":[{"kind":"mcq","stem":"p53 与 KRAS 的突变类型分别是","opts":{"A":"都属抑癌基因突变","B":"p53 为抑癌基因失活型，KRAS 为原癌基因激活型","C":"p53 为激活型，KRAS 为失活型","D":"都属原癌基因激活型"},"ans":"B","explain":"p53 是抑癌基因，失活后丧失监视功能；KRAS 是原癌基因，激活突变后持续传递增殖信号。","src":"811真题·2025"},{"kind":"mcq","stem":"有活性的 CDK1 激酶符合下列何种描述？","opts":{"A":"与周期蛋白以复合物形式存在","B":"Thr161 去磷酸化","C":"Thr14 和 Tyr15 磷酸化","D":"与之结合的周期蛋白泛素化"},"ans":"A","explain":"CDK 激酶激活的途径包括：① CDK 蛋白本身不具有蛋白激酶活性；②当 周期蛋白 B/A 含量积累到一定值时，二者相互结合形成复合体，但不表现出激酶活性； 88 周期蛋白与 CDK 的结合是 CDK 激酶活性表现的先决条件；③在 weel/mikl 和 CAK 激 酶的催化下，CDK 的 Thrl4、Tyr15、Thr161 磷酸化，形成高度磷酸化的周期蛋白 CDK 复合体，但仍不具备激酶活性：④在磷酸酶 Cdc25C 的催化下，Thr14 和 Tyr15 去磷 酸化，CDK 激酶活性才能表现出来。Thr161 位点保持磷酸化状态是 CDK1 激酶活性表 现所必需的前提。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"癌细胞的主要特点之一是（）。","opts":{"A":"细胞间黏附性增强","B":"缺少接触抑制作用","C":"对生长因子的需求量上升","D":"增殖力下降"},"ans":"B","explain":"AB 两项，癌细胞几乎丧失细胞间的黏着，相互之间不产生抑制作用，更 有利于快速繁殖。C项，由于癌细胞的增殖能力增强，其对生长因子的需求量下降。D项， 癌细胞的一个典型特征就是增殖力增强。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"Rb 和p53 都是抑癌基因，能与 DNA 特异性结合，真蛋白活性主要受（） 调控。","opts":{"A":"糖基化","B":"羟基化","C":"磷酸化","D":"羧基化"},"ans":"C","explain":"Rb 蛋白的磷酸化/去磷酸化是其调节细胞生长分化的主要形式。P53 主要 集中于核仁区，能与 DNA 特异结合，其活性亦受磷酸化调控。","src":"考点笔记·考研例题"},{"kind":"mcq","stem":"关于肿瘤细胞的增殖特征，下列说法不正确的是（）。","opts":{"A":"肿瘤细胞在增殖过程中，不会失去接触依赖性抑制","B":"肿瘤细胞都有恶性增殖和侵袭、转移的能力","C":"肿瘤细胞和胚胎细胞某些特征相似，如无限增殖的特性","D":"肿瘤细胞来源于正常细胞，但是多表现为去分化"},"ans":"A","explain":"正常细胞生长到彼此相互接触时，其运动和分裂活动将会停止，即接触抑 90 制。肿瘤细胞失去运动和分裂的接触抑制，这也是恶性肿瘤易发生转移的原因。","src":"考点笔记·考研例题"}]},{"key":"quiz","title":"今日默写检测","blocks":[{"kind":"num","runs":[["名词解释：癌基因、抑癌基因、原癌基因、Warburg 效应。",false]]},{"kind":"num","runs":[["简答：肿瘤细胞有哪些主要生物学特征？",false]]},{"kind":"num","runs":[["论述：EGFR 突变如何驱动肿瘤，靶向治疗为什么会产生耐药？",false]]},{"kind":"num","runs":[["简答：p53 与 Rb 在肿瘤发生中的作用。",false]]}]}],"n":37},{"title":"11月6日 · 肿瘤靶向治疗与耐药","sections":[{"key":"frame","title":"今日知识框架","blocks":[{"kind":"bullet","runs":[["重点：EGFR 突变、靶向药、耐药机制、免疫检
